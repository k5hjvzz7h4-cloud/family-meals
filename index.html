<script>
(function(){
  window.getThemePref=function(){try{var t=localStorage.getItem('mpl_theme');return(t==='light'||t==='dark')?t:'auto';}catch(e){return'auto';}};
  window.applyTheme=function(){
    var t=window.getThemePref(),dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#1a2423':'#ffffff');
    var b=document.getElementById('theme-btn');
    if(b){b.innerHTML=t==='light'?'&#9728;&#65039;':t==='dark'?'&#127769;':'&#127763;';b.setAttribute('aria-label','Theme: '+t+(t==='auto'?' (matches your phone)':'')+'. Tap to change');b.title='Theme: '+t;}
  };
  window.cycleTheme=function(){var o=['auto','light','dark'],t=window.getThemePref();try{localStorage.setItem('mpl_theme',o[(o.indexOf(t)+1)%3]);}catch(e){}window.applyTheme();};
  window.applyTheme();
  if(window.matchMedia){var q=window.matchMedia('(prefers-color-scheme: dark)');var f=function(){window.applyTheme();};if(q.addEventListener)q.addEventListener('change',f);else if(q.addListener)q.addListener(f);}
  document.addEventListener('DOMContentLoaded',window.applyTheme);
})();
</script>
<style>
:root{

  --acc:#2a8a80;--acc-light:#e6f5f4;--acc-border:#8acfca;
  --blue-bg:#e8f4f8;--blue-border:#80c4d8;--blue-text:#0e5a70;
  --green-bg:#e6f5ee;--green-border:#7acca0;--green-text:#1a5e3a;--green-acc:#2a8a60;
  --amber-bg:#fdf6e0;--amber-border:#d8b840;--amber-text:#6a4a08;
  --red-bg:#fdf0ee;--red-border:#e8b0a8;--red-text:#b03020;
  --r:14px;--rl:16px;
  --shadow:0 1px 3px rgba(0,0,0,0.07),0 4px 12px rgba(0,0,0,0.05);

  --day0:#c656a6;--day1:#db4241;--day2:#ec7c0e;--day3:#e8b616;
  --day4:#20a04e;--day5:#337bd0;--day6:#6d47b8;--day7:#10a3b5;--onacc:#fff;
}
html[data-theme=dark]{
  --cs:dark;color-scheme:dark;
  --bg:#101716;--surface:#1a2423;--surface2:#223130;--surface3:#2b3d3b;
  --border:rgba(255,255,255,0.09);--border-med:rgba(255,255,255,0.18);
  --text:#e4efed;--text2:#a6c0bc;--text3:#7a9a96;
  --acc:#4dbfb3;--acc-light:#16302d;--acc-border:#2f6e68;
  --blue-bg:#14282f;--blue-border:#2c5d70;--blue-text:#7fcbe3;
  --green-bg:#142a20;--green-border:#2e6d4b;--green-text:#82d8a7;--green-acc:#2a8a60;
  --amber-bg:#2c2510;--amber-border:#7c6622;--amber-text:#e8c56c;
  --red-bg:#2f1a17;--red-border:#7d3c34;--red-text:#f2917f;

}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 6rem;-webkit-text-size-adjust:100%}
.app{max-width:680px;margin:0 auto}
h2{font-size:15px;font-weight:600;margin-bottom:0.75rem;color:var(--text)}
/* Header */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:1.25rem 1rem 0;margin-bottom:0;position:sticky;top:0;z-index:10}
.app-header h1{font-family:inherit;font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.01em;margin-bottom:0.875rem}
.app-header h1 span{color:var(--acc)}
/* Tabs */
.tabs{display:flex;border-bottom:none;margin-bottom:0}
.tab{flex:1;padding:10px 4px 12px;font-size:11.5px;font-weight:500;background:transparent;border:none;cursor:pointer;color:var(--text3);font-family:inherit;transition:color .15s;line-height:1.2;min-height:44px;position:relative}
.tab.active{color:var(--acc);font-weight:600}
.tab.active::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:2.5px;background:var(--acc);border-radius:2px 2px 0 0}
.section{display:none;padding:1rem 1rem 0}.section.active{display:block}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem;margin-bottom:0.75rem;box-shadow:var(--shadow-sm)}
.field{margin-bottom:0.75rem}
.fl{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:0.06em}
/* Inputs */
input[type=text],input[type=search],input[type=date],input[type=number],textarea,select{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none;transition:border-color .15s,background .15s;-webkit-appearance:none}
input:focus,textarea:focus,select:focus,input[type=search]:focus{border-color:var(--acc);background:var(--surface)}
input[type=date]{color-scheme:var(--cs,light);text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin-left:0}
input[type=date]::-webkit-datetime-edit{text-align:left}
input[type=date]::-webkit-datetime-edit-fields-wrapper{text-align:left}
textarea{resize:vertical;line-height:1.55;min-height:54px}
input[type=search]::-webkit-search-decoration{-webkit-appearance:none}
input::placeholder,textarea::placeholder{color:var(--text3)}
/* Buttons */
.btn{padding:10px 16px;font-size:14px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:active{opacity:0.72}
.btn.pri{border-color:var(--acc);color:#fff;background:var(--acc);font-weight:600}
.btn.pri:active{opacity:0.8}
.iar .btn.sm:not(.pri):not(.gh){border-color:var(--acc);background:var(--acc);color:#fff;font-weight:600}
.btn.amb{border-color:var(--acc);color:#fff;background:var(--acc);font-weight:600}
.btn.sm{padding:8px 12px;font-size:13px;min-height:38px;border-radius:9px}
.btn.gh{border-color:transparent;background:transparent;color:var(--text2);padding:8px 10px;font-size:13px;min-height:38px}
.btn.gh.d{color:var(--red-text)}
.btn.do{border-color:#c0392b;color:#fff;font-size:13px;padding:8px 12px;background:#c0392b;font-weight:600;min-height:38px}
.btn.pinon{border-color:#d9a21b;color:#2b1d00;background:#e8b730;font-weight:600}
.iar{display:flex;gap:7px}
.iar input{flex:1;font-size:16px;padding:10px 12px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none}
.iar input:focus{border-color:var(--acc);background:var(--surface)}
.arr{background:var(--surface2);border:1px solid var(--border-med);border-radius:8px;cursor:pointer;color:var(--text2);padding:6px 10px;font-size:12px;line-height:1;font-family:inherit;min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center}
.arr:active{background:var(--surface3);color:var(--text)}
.arr:disabled{opacity:0.2;cursor:default}
.btn:disabled{opacity:0.4;cursor:default}
.uc-fl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px}
.ings{list-style:none;padding:0;margin:0.4rem 0 0}
.ing{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border)}
.ing:last-child{border-bottom:none}
.ing input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--acc);flex-shrink:0}
.ing.dn>span{text-decoration:line-through;color:var(--text3)}
.di{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px 6px;line-height:1;margin-left:auto;flex-shrink:0;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.di:active{color:var(--red-text)}
.uc-notes{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface2);color:var(--text);font-family:inherit;resize:vertical;line-height:1.55;min-height:54px;outline:none;margin-top:0.5rem;-webkit-appearance:none}
.uc-notes:focus{border-color:var(--acc);background:var(--surface)}
/* Menu cards */
.menu-card{padding-left:10px}
.dow{position:relative;width:12px;height:31px;flex-shrink:0;margin-right:-3px}
.dow>span{position:absolute;left:50%;top:50%;width:31px;transform:translate(-50%,-50%) rotate(-90deg);display:flex;justify-content:space-between;font-size:11px;font-weight:700;line-height:1;color:var(--dc)}
.dow i{font-style:normal}
.menu-card .day-num{font-weight:800}
.menu-card.planned .day-num{font-weight:400;opacity:0.85}
.menu-card.planned .dow{opacity:0.85}
.menu-card.later .day-num{font-weight:200;opacity:0.6}
.menu-card.later .dow{opacity:0.55}
.mtb:not(.plan):not(.unpl){background:var(--green-acc);border-color:var(--green-acc);color:#fff}
.mtb:not(.plan):not(.unpl):active{background:#1f7048}
.day-num{background:none;border:none;cursor:pointer;font-family:inherit;font-size:44px;line-height:1;color:var(--dc,var(--text3));box-sizing:border-box;width:58px;min-width:58px;padding:0 4px 0 0;font-variant-numeric:tabular-nums;flex-shrink:0;align-self:stretch;display:flex;align-items:center;justify-content:center;letter-spacing:-0.03em}
.day-num:active{opacity:0.6}
.menu-card{position:relative;border-left-width:3px;border-left-style:solid;border-left-color:var(--dc,var(--green-acc));border-radius:4px var(--rl) var(--rl) 4px}
/* Planned (not yet bought): dashed coloured edge */
.menu-card.planned{border-left-color:transparent}
.menu-card.planned::before{content:'';position:absolute;left:-3px;top:-1px;bottom:-1px;width:3px;border-radius:3px 0 0 3px;background:repeating-linear-gradient(to bottom,var(--dc) 0,var(--dc) 9px,transparent 9px,transparent 15px)}
.mtb.plan{border-color:#f08a3c;background:#f08a3c;color:#fff;font-size:20px;font-weight:700;min-width:48px;justify-content:center;line-height:1}
.mtb.plan:active{background:#d9742a}
/* Not planned yet (calendar-added): faint dotted edge, hollow button */
.menu-card.later{border-left-color:transparent}
.menu-card.later::before{content:'';position:absolute;left:-3px;top:-1px;bottom:-1px;width:3px;border-radius:3px 0 0 3px;background:repeating-linear-gradient(to bottom,var(--dc) 0,var(--dc) 3px,transparent 3px,transparent 8px);opacity:.55}
.mtb.unpl{border:1.5px solid #6f9894;background:var(--surface);color:#4e7a76;font-size:20px;font-weight:700;min-width:48px;justify-content:center;line-height:1}
.mtb.unpl:active{background:var(--surface2)}
.msec-h{display:flex;align-items:center;gap:8px;padding:12px 4px 6px;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;cursor:pointer}
.msec-n{margin-left:auto;font-weight:400;color:var(--text3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{font-size:11px;color:var(--text3);text-align:center;padding:4px 0}
.cal-d{aspect-ratio:1;border:none;background:none;border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.cal-d.past{color:var(--text3)}
.cal-d.today{outline:1.5px solid var(--acc)}
.cal-d:active{background:var(--acc-light)}
.cal-d .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.cal-d.past .dot,.cal-d .dot.f{opacity:.35}
.cal-d .nodot{width:6px;height:6px}
.cal-meal{border:1px solid var(--border);border-radius:12px;padding:0.7rem;margin-bottom:0.7rem;background:var(--surface)}
.cal-chip{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:2px 7px;border-radius:6px;border:1px solid var(--border-med);color:var(--text3);margin-bottom:0.4rem}
.sug-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-med)}
.sug-row:last-child{border-bottom:none}
/* Things to use up / You could make: a solid, muted box that sits back from the main cards */
.sc.solid-box,.card.solid-box{margin-top:0.75rem;background:var(--surface3);border:1px solid var(--border-med)}
.solid-box .sub-h{color:var(--text2)}
.solid-box .box-arrow{color:var(--text2)}
.solid-box .sug-more{color:var(--text)}
.solid-box .rpicker-item{background:var(--surface)}
/* Save warning modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(30,46,44,0.5);display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap}
.modal-btns .btn{flex:1}
/* Buttons at the bottom of a modal stay in view; the content above them scrolls */
#am-scroll,.modal-card{scroll-padding-bottom:5.5rem}   /* a field you focus is scrolled clear of the pinned buttons */
.modal-btns{position:sticky;bottom:0;z-index:3;background:var(--surface);padding-top:0.7rem;padding-bottom:0.15rem}
.modal-card:not(.flexcard)>.modal-btns,.modal-card:not(.flexcard)>.modal-foot{position:sticky;bottom:-1.25rem;z-index:3;background:var(--surface);margin-left:-1.1rem;margin-right:-1.1rem;margin-bottom:-1.25rem;padding:0.75rem 1.1rem 1.25rem;box-shadow:0 -8px 10px -8px rgba(0,0,0,0.18)}
.modal-card .modal-foot .modal-btns{position:static;background:none;padding:0;margin:0;box-shadow:none}
.btn.red{background:var(--red-text);border-color:var(--red-text);color:#fff;font-weight:600}
.btn.red:active{opacity:0.8}
/* Generic (non-red) modal card — recipe confirm/view, add-recipe */
.modal-card{background:var(--surface);border-radius:var(--rl);padding:1.25rem 1.1rem;max-width:400px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-card h2,.modal-card h3{margin-bottom:0.75rem}
.mtb{font-size:13px;padding:8px 14px;border:1.5px solid var(--green-border);border-radius:10px;background:var(--green-bg);color:var(--green-text);cursor:pointer;font-family:inherit;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:5px}
.mtb:active{background:#d0ecc0}
.pb{font-size:13px;padding:8px 14px;border:1.5px solid var(--acc);border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:5px}
.pb:active{opacity:0.72}
/* Recipe picker */
.rpicker{background:var(--surface2);border:1px solid var(--border-med);border-radius:var(--rl);padding:0.875rem 1rem;margin-top:0.5rem;box-shadow:var(--shadow)}
.rpicker-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;-webkit-overflow-scrolling:touch}
.rpicker-item{display:flex;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:14px;transition:background .12s;min-height:44px}
.rpicker-item{flex-shrink:0}
.rpicker-item:active{background:var(--acc-light);border-color:var(--acc-border)}
/* Shopping */
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem;margin-bottom:1rem;box-shadow:var(--shadow-sm)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;flex-wrap:wrap;gap:8px}
.si{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--border)}
.si:last-child{border-bottom:none}
.si input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--acc);flex-shrink:0}
.si.dn>span{text-decoration:line-through;color:var(--text3)}
.cc{font-size:11px;font-weight:600;background:var(--blue-bg);color:var(--blue-text);border-radius:20px;padding:2px 8px;margin-left:auto;border:1px solid var(--blue-border)}
.shop-src{font-size:12px;font-style:italic;color:var(--text3);font-weight:400}
/* Recipes */
.rc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem;margin-bottom:0.75rem;box-shadow:var(--shadow-sm)}
.rc.pn{border-color:var(--amber-border);background:var(--amber-bg)}
.rn{font-size:15px;font-weight:600;color:var(--text)}
.rii{display:flex;align-items:center;gap:3px;padding:5px 0;font-size:14px;color:var(--text);border-bottom:1px solid var(--border)}
.ing-pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.ing-pill{display:inline-flex;align-items:center;gap:5px;background:var(--acc-light);border:1px solid var(--acc-border);color:var(--acc);font-weight:500;border-radius:20px;padding:5px 11px;font-size:13px;max-width:100%}
.ing-pill.cup{background:var(--surface2);border-color:var(--border-med);color:var(--text);font-weight:400}
.ing-pill-text{flex:1;min-width:0;word-break:break-word}
/* Amount shown as a fill gauge: whole = full, half = half, a little = a sliver */
.ing-pill.g{position:relative;overflow:hidden;background:var(--surface);border:1.5px solid var(--acc);color:var(--text);font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ing-pill.g>*{position:relative}
.ing-pill.g>.gf{position:absolute;left:0;top:0;bottom:0;background:var(--acc);background:color-mix(in srgb,var(--acc) 55%,var(--surface));pointer-events:none}
.ing-pill.g.cup{border-color:var(--text3);color:var(--text2);font-weight:500}
.ing-pill.g.cup>.gf{background:var(--border-med);background:color-mix(in srgb,var(--text3) 38%,var(--surface))}
.ing-pill.g:active{filter:brightness(.94)}
.gq{font-weight:700;font-size:12px;flex-shrink:0}
.gm{font-weight:700;font-size:12px;flex-shrink:0}
.gs{font-size:11px;font-weight:500;color:var(--text2);flex-shrink:0}
.ing-pill.g.add{opacity:.55;border-style:dashed;border-color:var(--text3);color:var(--text2);min-width:38px;justify-content:center;font-size:16px;font-weight:500;padding:3px 12px}
.tag-plus{border-style:dashed}
.ing-pill.g.chk{border-style:dashed}
.ing-pill.g.dn{border-color:var(--border-med);color:var(--text3);font-weight:400}
.ing-pill.g.dn>.gf{background:var(--border);opacity:.7}
.ing-pill.g.dn .ing-pill-text{text-decoration:line-through}
.ing.check>span{color:var(--text2)}
.rearr-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.rearr-date{flex:0 0 74px;font-size:13px;color:var(--text2)}.rearr-date b{display:block;font-weight:700;color:var(--text)}.rearr-date span{display:block;font-size:11px;font-style:italic;color:var(--text3);line-height:1.25}
.rearr-meal{flex:1;min-width:0;font-size:15px;font-weight:600;word-break:break-word}
.di:disabled{opacity:0.25;cursor:default}
.ing-pill-use{background:none;border:1px solid var(--border-med);border-radius:12px;cursor:pointer;color:var(--text3);font-size:11px;font-family:inherit;padding:2px 8px;line-height:1.3;flex-shrink:0;min-height:22px;white-space:nowrap}
.ing-pill-use.whole{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.ing-pill-use.half{background:#8fd0cb;border-color:#6dbdb7;color:#0f4a45;font-weight:600}
.ing-pill-use.little{background:var(--acc-light);border-color:var(--acc-border);color:var(--acc);font-weight:600}
.ing-pill-use.tagged{color:var(--acc);border-color:var(--acc-border);background:var(--acc-light);font-weight:600}
.use-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--acc);background:var(--acc-light);border:1px solid var(--acc-border);border-radius:10px;padding:0 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.use-hint{font-size:11px;color:var(--text3);margin:2px 0 6px;line-height:1.4}
.util-card{margin:1.4rem 0 0.5rem;padding:0.4rem 0.2rem;border-top:1px dashed var(--border-med);font-size:13px}
.util-head{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text3);font-size:12px;font-weight:600;min-height:32px;user-select:none}
.util-n{font-weight:400;margin-left:auto}
.util-note{font-size:11px;color:var(--text3);margin:0.2rem 0 0.5rem;line-height:1.4}
.util-card .reg-row{padding:5px 0;font-size:13px;color:var(--text2)}
.aisle-h{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:0.06em;margin:0.8rem 0 0.2rem;padding-bottom:3px;border-bottom:1px solid var(--acc-border)}
.aisle-h:first-of-type{margin-top:0.2rem}
.box-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;min-height:32px}
.box-head h2{margin:0;flex:1}
.box-arrow{font-size:13px;color:var(--text3);min-width:16px}
.box-n{font-size:12px;color:var(--text3)}
/* tighter shopping list */
.si{padding:3px 0;gap:8px}
.si .di{min-height:26px;min-width:26px;padding:2px}
.si .ing-pill-use{min-height:20px;padding:1px 7px}
.si-name{font-size:14px;line-height:1.25}
.si-sub{display:block;font-size:11px;font-style:italic;color:var(--text3);line-height:1.2}
.si.dn .si-name{text-decoration:line-through;color:var(--text3)}
.aisle-h{margin-top:0.5rem !important}
.ing .ing-pill-use{margin-left:auto}
.ing .ing-pill-use+.di{margin-left:0}
.ed-sub{flex-basis:100%;display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text2)}
.btn.dotted::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#f5c542;margin-left:7px;vertical-align:middle}
.drow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-left:3px solid;border-radius:6px;margin:3px 0;font-size:13px}
.drow.green{border-color:var(--green-acc);background:var(--green-bg);color:var(--green-text)}
.drow.red{border-color:var(--red-text);background:var(--red-bg);color:var(--red-text)}
.drow.amber{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber-text)}
.dtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;opacity:0.8}
.sec-row{display:flex;align-items:center;gap:4px;padding:6px 0;border-bottom:1px solid var(--border);font-size:15px}
.sec-row .di{min-width:30px}
.sec-row .di:disabled{opacity:0.25;cursor:default}
.qty{display:inline-flex;align-items:center;gap:3px}
.qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border-med);background:var(--surface);color:var(--acc);font-size:16px;line-height:1;cursor:pointer;padding:0;font-family:inherit}
.qty button:active{background:var(--acc-light)}
.qty b{min-width:20px;text-align:center;font-size:13px}
.cmp-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px}
.cmp-row:last-child{border-bottom:none}
.cmp-name{flex:1;min-width:0;word-break:break-word}
.cmp-ctl{display:flex;align-items:center;gap:8px;flex-basis:100%;flex-wrap:wrap}
.sub-h{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:0.06em;margin:0.7rem 0 0.2rem}
.left-row{padding:7px 0;border-bottom:1px solid var(--border);font-size:14px}
.left-row:last-child{border-bottom:none}
.sug-more{background:none;border:none;color:var(--acc);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;padding:8px 0 0;min-height:32px}
.reg-row{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--border)}
.reg-row:last-child{border-bottom:none}
.reg-row span{flex:1;min-width:0;word-break:break-word;color:var(--text)}
.reg-row .tag{flex:none;min-width:auto}
.reg-add-btn{background:none;border:none;cursor:pointer;color:var(--acc);font-size:18px;font-weight:600;padding:4px 6px;line-height:1;flex-shrink:0;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;transition:color .15s}
.reg-add-btn:active{color:var(--green-text)}
.reg-add-btn.added{color:var(--green-text)}
.reg-del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px 6px;line-height:1;flex-shrink:0;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.reg-del-btn:active{color:var(--red-text)}
.btn.added{background:var(--green-acc);border-color:var(--green-acc);color:#fff}
.rii:last-child{border-bottom:none}
.rii span{flex:1;min-width:0;word-break:break-word}
.mt{font-size:13px;color:var(--text2);line-height:1.65;white-space:pre-wrap;cursor:pointer}
.mt:active{color:var(--text)}
.mp{font-size:13px;color:var(--text3);font-style:italic;cursor:pointer;padding:6px 0;display:block}
.rsl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin:0.65rem 0 0.4rem}
.sb{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.sb span{font-size:13px;color:var(--text2)}
.sort-btn{font-size:13px;padding:8px 12px;border:1px solid var(--border-med);border-radius:9px;background:var(--surface);color:var(--text2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;min-height:38px}
.sort-btn:active{background:var(--surface2);color:var(--text)}
.method-area{max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.es{color:var(--text3);font-size:14px;font-style:italic;padding:0.5rem 0}
/* Tags */
.tag{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid transparent;cursor:pointer;transition:all .12s;white-space:nowrap;min-height:32px;user-select:none}
.tag.off{background:var(--surface2);border-color:var(--border-med);color:var(--text3)}
.tag.on{border-color:currentColor}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:0.4rem 0}
/* Stats page */
#stats-btn.on{color:var(--acc);background:var(--acc-light)}
.st-sub{font-size:12px;color:var(--text3);margin:-0.45rem 0 0.7rem;line-height:1.4}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:0.5rem 0 0.4rem}
.pod{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.pod-name{font-size:12.5px;font-weight:600;line-height:1.2;margin-bottom:5px;padding:0 2px;word-break:break-word;max-height:3.7em;overflow:hidden}
.pod-blk{width:100%;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;color:#1e2e2c}
.pod-rk{font-size:11px;font-weight:700;opacity:.6;letter-spacing:.04em}
.pod-n{font-size:28px;font-weight:800;line-height:1.05}
.pod-l{font-size:10px;font-weight:600;opacity:.75}
.bar-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.bar-rk{width:18px;color:var(--text3);font-size:12px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.bar-nm{flex:0 0 38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-nm small{display:block;font-size:10.5px;color:var(--text3);line-height:1.1}
.bar-tr{flex:1;height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar-fl{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar-v{width:34px;text-align:right;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;flex-shrink:0}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{flex:0 0 138px;position:relative;width:138px;height:138px}
.donut svg{width:138px;height:138px;display:block}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-c b{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.donut-c span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;font-weight:600}
.legend{flex:1;min-width:0}

/* Check the cupboards */

/* Undo / redo + toast */

#undo-bar button:not(:disabled):active{background:var(--surface2)}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
html.offline #app-title,html.offline #app-title span{color:#e8801a}

<body>
<div class="app">
  <div class="app-header">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <h1 id="app-title" style="margin-bottom:0"><span>Menu</span></h1>
      <div style="display:flex;align-items:center;gap:8px"><button class="btn sm gh" id="stats-btn" onclick="openStats()" aria-label="Stats" title="Stats" style="min-height:36px;min-width:36px;padding:6px 10px;flex-shrink:0;line-height:1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M11 13V5A8 8 0 1 0 19 13Z"/><path d="M13 11V3A8 8 0 0 1 21 11Z"/></svg></button><button class="btn sm gh" id="theme-btn" onclick="cycleTheme()" style="min-height:36px;min-width:36px;padding:6px 10px;flex-shrink:0;font-size:15px;line-height:1"></button><button class="btn sm gh" id="sync-btn" onclick="openSyncModal()" style="min-height:36px;padding:6px 12px;flex-shrink:0">Save/Load</button></div>
    </div>
    <div style="height:0.9rem"></div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('menu')">Menu</button>
      <button class="tab" onclick="showTab('shopping')">Shopping</button>
      <button class="tab" onclick="showTab('recipes')">Recipes</button>
      <button class="tab" onclick="showTab('regulars')">Regulars</button>
    </div>
  </div>
  <div id="tab-menu" class="section active"></div>
  <div id="tab-shopping" class="section"></div>
  <div id="tab-recipes" class="section"></div>
  <div id="tab-regulars" class="section"></div>
  <div id="tab-stats" class="section"></div>
  <div id="undo-bar"><button data-u onclick="doUndo()" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><button data-r onclick="doRedo()" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button></div>
</div>
<script>
// State: meals use stable IDs. All mutations use ID lookup, never array index from UI.
let S=JSON.parse(localStorage.getItem('mplv9')||'null')||{meals:[],extras:[],recipes:[],recipeSort:'az',regulars:{rai:[],ryan:[],items:[]}};
['extras','recipes','later','freezer','history','master','masterHidden','components','leftDismissed'].forEach(k=>{if(!S[k])S[k]=[];});
if(!S.shopQty)S.shopQty={};
if(!S.recipeSort)S.recipeSort='az';
if(!S.shopSort)S.shopSort='az';
if(!S.regulars)S.regulars={rai:[],ryan:[],fern:[],items:[]};
['rai','ryan','fern','items'].forEach(k=>{if(!S.regulars[k])S.regulars[k]=[];});
ensureLayout();
let openPicker=null; // meal ID of currently open recipe picker

// ── Recipe ingredients: {name, use}. use = 'whole' (default) | 'half' | 'little'.
// Older data stored plain strings; they are converted here (as whole) on load and after a cloud Load. ──
function normIng(i){
  if(typeof i==='string')return{name:i,use:'whole'};
  if(i&&typeof i==='object'){const o={name:String(i.name||''),use:canonUse(i.use)};if(i.cupboard)o.cupboard=true;const q=Math.min(20,parseFloat(i.qty)||1);if(q>1)o.qty=q;return o;}
  return null;
}
function normRecipes(){
  (S.recipes||[]).forEach(r=>{r.ingredients=(Array.isArray(r.ingredients)?r.ingredients:[]).map(normIng).filter(x=>x&&x.name);});
}
// Amount of a pack a recipe uses, in 30ths of a pack: whole, half, or a little (0.1).
// (An earlier version also had thirds; those are treated as half.)
const USE_UNITS={whole:30,half:15,little:3};
const USE_LABEL={whole:'whole',half:'half',little:'a little'};
const USE_ORDER=['whole','half','little'];
function canonUse(u){return u==='twothirds'||u==='third'?'half':(USE_UNITS[u]?u:'whole');}
function useUnits(u,q){return USE_UNITS[canonUse(u)]*Math.max(1,parseFloat(q)||1);}
function ingQty(i){return Math.max(1,parseFloat(i&&i.qty)||1);}
// Amounts: a little (0.1), half, 1, 1.5, 2 ... stored as use (little/half/whole) plus a multiplier for whole packs
const STEPS=[0.1,0.5,1,1.5,2,2.5,3,3.5,4,4.5,5,6,7,8,9,10];
const SLIDER_STEPS=STEPS.slice(0,11);
function ingAmt(i){return USE_UNITS[canonUse(i&&i.use)]*ingQty(i)/30;}
function snapAmt(a){return STEPS.reduce((b,x)=>Math.abs(x-a)<Math.abs(b-a)?x:b,STEPS[0]);}
function setIngAmt(i,a){a=snapAmt(a);if(a<=0.1){i.use='little';delete i.qty;}else if(a<1){i.use='half';delete i.qty;}else{i.use='whole';if(a>1)i.qty=a;else delete i.qty;}}
const NOPL=new Set('milk rice flour butter cheese pasta sugar salt pepper oil cream yoghurt yogurt water juice meat mince ham bacon honey jam garlic ginger bread coffee tea beef pork lamb fish salmon tuna cod broccoli spinach lettuce cabbage celery parsley basil mint thyme rosemary coriander oregano cinnamon paprika cumin turmeric stock gravy ketchup mayonnaise mustard vinegar wine beer cider soup custard lard cous couscous quinoa sweetcorn corn kale rocket parmesan mozzarella cheddar feta halloumi tofu hummus butter semolina yeast cocoa chocolate ice'.split(' '));
const IRRPL={potato:'potatoes',tomato:'tomatoes',mango:'mangoes',loaf:'loaves',leaf:'leaves',knife:'knives',half:'halves',cherry:'cherries'};
function plWord(w){
  const l=w.toLowerCase();if(!l||NOPL.has(l))return w;
  if(IRRPL[l]){return w[0]===w[0].toUpperCase()&&w[0]!==w[0].toLowerCase()?IRRPL[l][0].toUpperCase()+IRRPL[l].slice(1):IRRPL[l];}
  if(/(ss|sh|ch|x|z)$/.test(l))return w+'es';
  if(/s$/.test(l))return w;
  if(/[^aeiou]y$/.test(l))return w.slice(0,-1)+'ies';
  return w+'s';
}
// "onion" shown as "onions" once there is more than one
function plName(name,a){
  if(!(a>1)||!name)return name;
  const t=String(name),m=t.match(/^(.*?)(\s+of\s+.*)$/i);
  if(m)return plName(m[1],a)+m[2];
  const i=t.search(/\S+$/);return i<0?t:t.slice(0,i)+plWord(t.slice(i));
}
function amtText(a){const x=snapAmt(a);if(x<=0.1)return'a little';if(x<1)return'half';const w=Math.floor(x);return x%1?(w?w:'')+'\u00bd':String(w);}
function gaugeW(a){return a>=1?100:a>=0.5?50:14;}
function nextUse(u){return USE_ORDER[(USE_ORDER.indexOf(canonUse(u))+1)%USE_ORDER.length];}
function useTag(u){u=canonUse(u);return(u!=='whole')?`<span class="use-tag">${USE_LABEL[u]}</span>`:'';}
// Cupboard ingredients (herbs, spices, sauces…) don't go onto the shopping list when a recipe is
// added to the menu: they appear on the meal as "to check" (ing.check) until you tap +.
// Where a stocked ingredient came from, shown instead of a tick box
const LOC_LABEL={freezer:'freezer',stock:'in stock',leftover:'leftover'};
// Finds (and uses up) a freezer ingredient or in-stock item that a recipe ingredient needs.
// Not for unbought partial packs: if it would finish a leftover from the menu it goes on the shopping list as normal.
function takeFromStock(name,leftovers){
  const w=ingWords(name);if(!w.length)return null;
  if(leftovers.some(l=>wordsCover(l.words,w)))return null;
  const hit=list=>S[list].findIndex(c=>{if(list==='freezer'&&c.kind!=='ingredient')return false;const cw=ingWords(c.name);return wordsCover(cw,w);});
  let i=hit('components'),list='components';
  if(i<0){i=hit('freezer');list='freezer';}
  if(i<0)return null;
  const c=S[list][i];
  const loc=list==='freezer'?'freezer':(c.src==='leftover'?'leftover':'stock');
  if((c.qty||1)>1)c.qty--;else S[list].splice(i,1);
  return loc;
}
// Put things back in stock (an ingredient is removed from a meal, or the meal is cleared/deleted)
function restoreStock(ings){
  (ings||[]).forEach(ing=>{
    if(!ing||!ing.loc)return;
    const list=ing.loc==='freezer'?'freezer':'components';
    const ex=S[list].find(c=>c.name.toLowerCase()===ing.name.toLowerCase()&&(list!=='freezer'||c.kind==='ingredient'));
    if(ex){ex.qty=(ex.qty||1)+1;return;}
    const o={name:ing.name,use:canonUse(ing.use),qty:1};
    if(list==='freezer')o.kind='ingredient';
    if(ing.loc==='leftover')o.src='leftover';
    S[list].push(o);
  });
}
// Use up stock for a meal's already-stocked ingredients (when a meal arrives from the cloud)
function consumeStock(ings){
  (ings||[]).forEach(ing=>{
    if(!ing||!ing.loc)return;
    const list=ing.loc==='freezer'?'freezer':'components',w=ingWords(ing.name);
    const i=S[list].findIndex(c=>{if(list==='freezer'&&c.kind!=='ingredient')return false;const cw=ingWords(c.name);return wordsCover(cw,w);});
    if(i<0)return;
    const c=S[list][i];if((c.qty||1)>1)c.qty--;else S[list].splice(i,1);
  });
}
// Meal ingredients for a recipe, using up anything already in stock
function mealIngsFor(recipeIngs){
  const lo=getLeftovers();
  return(Array.isArray(recipeIngs)?recipeIngs:[]).map(n=>{
    const r=mealIng(n);
    const loc=takeFromStock(r.name,lo);
    if(loc){r.loc=loc;r.check=true;r.checked=false;}
    return r;
  });
}
function mealIng(n){const o=normIng(n);const r={name:o.name,done:false,use:o.use};if(o.qty>1)r.qty=o.qty;if(o.cupboard||isCupboard(o.name))r.check=true;if(r.check)r.cup=true;return r;}
normRecipes();
// Freezer and components hold {name,use}; older data was plain text (treated as "whole")
function normSimpleLists(){
  ['freezer','components'].forEach(k=>{
    S[k]=(S[k]||[]).map(x=>{
      if(typeof x==='string')return{name:x,use:'whole'};
      if(!x||!x.name)return null;
      const o={name:String(x.name),use:canonUse(x.use),qty:Math.max(1,parseInt(x.qty)||1)};
      if(k==='freezer')o.kind=x.kind==='ingredient'?'ingredient':'meal';   // meal = a whole meal option; ingredient = used for recipe suggestions
      if(x.src)o.src=x.src;return o;
    }).filter(Boolean);
  });
}
normSimpleLists();
// ── Sections: order, hidden, and your own lists on the Regulars and Shopping tabs ──
const SEC_DEF={regulars:['rai','ryan','fern','items'],shopping:['fz','later']};
const SEC_NAME={rai:"Rai's lunches",ryan:"Ryan's lunches",fern:"Things for Fern",items:'Regular items',fz:'Freezer & in stock',later:'Non-urgent'};
function ensureLayout(){
  if(!Array.isArray(S.customLists))S.customLists=[];
  if(!Array.isArray(S.hiddenSecs))S.hiddenSecs=[];
  if(!S.layout||typeof S.layout!=='object')S.layout={};
  ['regulars','shopping'].forEach(k=>{if(!Array.isArray(S.layout[k]))S.layout[k]=[];});
  if(!S.cl||typeof S.cl!=='object')S.cl={};
  ensureStats();
  // items cleared off the shopping list in the last 14 days (lets Save/Load compare what was bought)
  S.boughtLog=(Array.isArray(S.boughtLog)?S.boughtLog:[]).filter(e=>e&&e.id&&e.name&&e.at>Date.now()-14*86400000);
  S.customLists.forEach(l=>{
    if(l.page==='regulars'){if(!Array.isArray(S.regulars[l.id]))S.regulars[l.id]=[];}
    else if(!Array.isArray(S.cl[l.id]))S.cl[l.id]=[];
  });
}
function secOrder(page,src){
  src=src||S;
  const customs=(src.customLists||[]).filter(l=>l.page===page).map(l=>l.id);
  const valid=SEC_DEF[page].concat(customs);
  const o=((src.layout||{})[page]||[]).filter((x,i,a)=>valid.includes(x)&&a.indexOf(x)===i);
  valid.forEach(x=>{if(!o.includes(x))o.push(x);});
  return o;
}
function secName(id){if(SEC_NAME[id])return SEC_NAME[id];const l=S.customLists.find(x=>x.id===id);return l?l.name:id;}
function secHidden(id){return S.hiddenSecs.includes(id);}
function listArr(id){return id==='later'?S.later:(S.cl[id]||(S.cl[id]=[]));}
function layoutBtnsHTML(page){
  return`<div style="display:flex;gap:8px;margin:0.2rem 0 0.9rem"><button class="btn sm gh" style="flex:1" onclick="openAddList('${page}')">+ Add list</button><button class="btn sm gh" style="flex:1" onclick="openRearrange('${page}')">&#8645; Rearrange</button></div>`;
}
let secModal=null,secRename=null,secRenameVal='';
function openRearrange(page){secModal={page,mode:'rearrange'};secRename=null;renderSecModal();}
function openAddList(page){secModal={page,mode:'add'};renderSecModal();setTimeout(()=>{const i=document.getElementById('newlist-in');if(i)i.focus();},0);}
function closeSecModal(){secModal=null;secRename=null;renderSecModal();}
function createList(){
  const i=document.getElementById('newlist-in');const v=i?i.value.trim():'';if(!v||!secModal)return;
  const page=secModal.page,id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  S.customLists.push({id,name:v,page});
  ensureLayout();
  S.layout[page]=secOrder(page);
  save();closeSecModal();render();
}
function moveSec(page,id,d){
  const o=secOrder(page),i=o.indexOf(id),j=i+d;
  if(i<0||j<0||j>=o.length)return;
  [o[i],o[j]]=[o[j],o[i]];S.layout[page]=o;
  save();renderSecModal();render();
}
function togSecHidden(id){
  const i=S.hiddenSecs.indexOf(id);
  if(i>=0)S.hiddenSecs.splice(i,1);else S.hiddenSecs.push(id);
  save();renderSecModal();render();
}
function startRenameSec(id){secRename=id;secRenameVal=secName(id);renderSecModal();setTimeout(()=>{const i=document.getElementById('sec-rename');if(i){i.focus();i.select();}},0);}
function saveRenameSec(){
  const v=(secRenameVal||'').trim();const l=S.customLists.find(x=>x.id===secRename);
  if(l&&v){l.name=v;save();}
  secRename=null;renderSecModal();render();
}
function delSec(id){
  const l=S.customLists.find(x=>x.id===id);if(!l)return;
  const arr=l.page==='regulars'?(S.regulars[id]||[]):(S.cl[id]||[]);
  if(arr.length&&!confirm('Delete "'+l.name+'" and its '+arr.length+' item'+(arr.length===1?'':'s')+'? This cannot be undone.'))return;
  S.customLists=S.customLists.filter(x=>x.id!==id);
  delete S.regulars[id];delete S.cl[id];
  S.layout[l.page]=(S.layout[l.page]||[]).filter(x=>x!==id);
  S.hiddenSecs=S.hiddenSecs.filter(x=>x!==id);delete openBox[id];
  save();renderSecModal();render();
}
function renderSecModal(){
  const el=document.getElementById('section-modal');
  if(!secModal){if(el)el.remove();return;}
  const page=secModal.page;let body='';
  if(secModal.mode==='add'){
    body=`<h2>Add a list</h2><p style="font-size:13px;color:var(--text2);margin-bottom:0.6rem">${page==='regulars'?'A new list of regulars. Tap + on an item to add it to the shopping list.':'A new tick-off list like Non-urgent. Items can be moved up to the main shopping list.'}</p>
      <input type="text" id="newlist-in" placeholder="List name" onkeydown="if(event.key==='Enter')createList()" style="width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--acc);border-radius:10px;background:var(--surface);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none">
      <div class="modal-btns" style="margin-top:1rem"><button class="btn pri" onclick="createList()">Create</button><button class="btn gh" onclick="closeSecModal()">Cancel</button></div>`;
  }else{
    const o=secOrder(page);
    const lock=t=>`<div class="sec-row" style="opacity:0.6"><span style="flex:1">${t}</span><span style="font-size:11px;color:var(--text3)">locked</span></div>`;
    const rows=o.map((id,i)=>{
      const hid=secHidden(id),custom=!SEC_DEF[page].includes(id);
      const nameCell=secRename===id
        ?`<input type="text" id="sec-rename" value="${esc(secRenameVal)}" oninput="secRenameVal=this.value" onkeydown="if(event.key==='Enter')saveRenameSec();else if(event.key==='Escape'){secRename=null;renderSecModal();}" style="flex:1;min-width:0;font-size:15px;padding:5px 8px;border:1.5px solid var(--acc);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;outline:none"><button class="btn sm pri" onclick="saveRenameSec()">Save</button>`
        :`<span style="flex:1;min-width:0;word-break:break-word">${esc(secName(id))}${hid?' <span style="font-size:11px;color:var(--text3)">(hidden)</span>':''}</span>`;
      return`<div class="sec-row"${hid?' style="opacity:0.6"':''}>${nameCell}
        <button class="di" style="margin-left:0" ${i===0?'disabled':''} onclick="moveSec('${page}','${id}',-1)" aria-label="move up">&#9650;</button>
        <button class="di" style="margin-left:0" ${i===o.length-1?'disabled':''} onclick="moveSec('${page}','${id}',1)" aria-label="move down">&#9660;</button>
        <button class="btn sm gh" onclick="togSecHidden('${id}')">${hid?'Show':'Hide'}</button>
        ${custom?`<button class="di" style="margin-left:0" onclick="startRenameSec('${id}')" aria-label="rename">&#9998;</button><button class="di" style="margin-left:0" onclick="delSec('${id}')" aria-label="delete list">&#128465;</button>`:''}
      </div>`;}).join('');
    body=`<h2>Rearrange</h2><p style="font-size:13px;color:var(--text2);margin-bottom:0.4rem">Move sections up or down, or hide ones you don't need. Hiding never deletes anything.</p>
      ${page==='shopping'?lock('Shopping list'):''}${rows}${page==='shopping'?lock('You could make'):lock('Items we buy')}
      <div class="modal-btns" style="margin-top:1rem"><button class="btn pri" onclick="closeSecModal()">Done</button></div>`;
  }
  const html=`<div class="modal-bg" id="section-modal"><div class="modal-card">${body}</div></div>`;
  if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
}
// A tap-through list of the places that need to open/close: boxes are collapsed until opened
const openBox={};
function togBox(id){openBox[id]=!openBox[id];render();}
function boxArrow(id){return openBox[id]?'&#9660;':'&#9654;';}

function persist(){
  localStorage.setItem('mplv9',JSON.stringify(S));
  dirty=true;localStorage.setItem('mpl_dirty','1');
  updateSyncBtn();
}
function save(){
  try{autoMoveLeftovers();}catch(e){}
  syncMaster();
  try{rollStats();}catch(e){}
  undoCommit();

}
// ── Undo / redo ── every change in the app goes through save(), so each save is one step.
// Steps made within half a second of each other count as one. Kept for this visit only (not stored or synced).
let undoStack=[],redoStack=[],undoBase=null,undoAt=0;
function snapStr(){return JSON.stringify(S,(k,v)=>(k==='lastSavedAt'||k==='lastSavedByDevice')?undefined:v);}
function undoInit(){undoBase=snapStr();updateUndoUI();}
function undoCommit(){
  if(undoBase===null)return;
  const cur=snapStr();if(cur===undoBase)return;
  const now=Date.now();
  if(!undoStack.length||now-undoAt>500){undoStack.push(undoBase);if(undoStack.length>40)undoStack.shift();}
  undoAt=now;redoStack=[];undoBase=cur;updateUndoUI();
}
function applySnap(str){
  const a=S.lastSavedAt,b=S.lastSavedByDevice;
  S=JSON.parse(str);if(a)S.lastSavedAt=a;if(b)S.lastSavedByDevice=b;
  ensureLayout();
  editingShop=null;editingLater=null;editingCL=null;editDraft=null;editAisle=undefined;shopTagOpen=null;openPicker=null;
  undoBase=snapStr();undoAt=0;
  persist();render();updateUndoUI();
}
function doUndo(){if(!undoStack.length)return;redoStack.push(snapStr());applySnap(undoStack.pop());toast('Undone');}
function doRedo(){if(!redoStack.length)return;undoStack.push(snapStr());applySnap(redoStack.pop());toast('Redone');}
function updateUndoUI(){
  const el=document.getElementById('undo-bar');if(!el)return;
  el.style.display=(undoStack.length||redoStack.length)?'flex':'none';
  el.querySelector('[data-u]').disabled=!undoStack.length;
  el.querySelector('[data-r]').disabled=!redoStack.length;
}
let toastT=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1700);
}
document.addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey)||String(e.key).toLowerCase()!=='z')return;
  const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  e.preventDefault();if(e.shiftKey)doRedo();else doUndo();
});
window.addEventListener('offline',()=>toast("You're offline. Changes stay on this device."));
window.addEventListener('online',()=>toast('Back online'));

const JB_KEY='$2a$10$r5gcMnW1wkZ0I1L0u6TshOkFeXwbw2Yh/Lh8pP30v4.E.UhJqzbOq';
const JB_BIN='6a3a3356da38895dfeeff853';

// A random id for this browser/device only — not a login, just enough to tell
// "you" from "someone else" when showing who last saved.
function getDeviceId(){
  let id=localStorage.getItem('mpl_device');
  if(!id){id='dev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('mpl_device',id);}

const DEVICE_ID=getDeviceId();

// Dirty = local data has changed since the last successful Save or Load.
// Persisted so a page refresh doesn't forget you had unsaved changes.
let dirty=localStorage.getItem('mpl_dirty')==='1';
function clearDirty(){dirty=false;localStorage.setItem('mpl_dirty','0');updateSyncBtn();}

function updateSyncBtn(){
  const b=document.getElementById('sync-btn');
  if(!b)return;
  b.classList.remove('red','gh','pri');
  b.classList.add('pri');
  b.textContent='Save/Load';
  // a small dot when this device differs from the last cloud copy checked (a local comparison, no network)
  let changed=dirty;
  if(cloudCache){try{changed=diffRows(S,cloudCache.data).length>0||localDiffers(S,cloudCache.data);}catch(e){}}
  b.classList.toggle('dotted',changed);
  b.title=changed?'You have changes that differ from the cloud copy':'';
}
setInterval(updateSyncBtn,60000);

// ── Save/Load modal ──
// "Check changes" does the only cloud read. The copy it fetches is kept (here and in localStorage) for an
// hour, and the modal compares against it with no network calls. Save is one write; Load uses the kept copy.
const CLOUD_TTL=3600000;
let cloudCache=null; // {at:ms, data}
try{const c=JSON.parse(localStorage.getItem('mpl_cloudcache')||'null');if(c&&c.data&&c.at)cloudCache=c;}catch(e){}
function setCloudCache(data){
  cloudCache={at:Date.now(),data:JSON.parse(JSON.stringify(data))};
  try{localStorage.setItem('mpl_cloudcache',JSON.stringify(cloudCache));}catch(e){}
}
function cacheFresh(){return !!cloudCache&&(Date.now()-cloudCache.at)<CLOUD_TTL;}
function agoText(ms){const m=Math.round((Date.now()-ms)/60000);return m<1?'just now':m===1?'1 min ago':m<60?m+' min ago':'over an hour ago';}

let syncPrev='summary';
let syncModalStep=null; // null|'check'|'loading'|'error'|'summary'|'confirm-save'|'confirm-load'
let syncModalError='';

function openSyncModal(){
  syncModalError='';
  syncModalStep=cacheFresh()?'summary':'check';
  renderSyncModal();
}
async function checkCloud(){
  syncModalStep='loading';syncModalError='';renderSyncModal();
  try{
    const resp=await fetch(`https://api.jsonbin.io/v3/b/${JB_BIN}/latest`,{headers:{'X-Master-Key':JB_KEY}});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    setCloudCache(data.record);
    syncModalStep='summary';
  }catch(e){
    syncModalStep='error';syncModalError=netMsg(e);
  }
  updateSyncBtn();renderSyncModal();
}
function closeSyncModal(){syncModalStep=null;renderSyncModal();}

// ── Comparing this device with the cloud copy ──
// Rows: green = only here / further along here; red = only on the cloud / further along there; amber = on both but edited.
// Each row can carry an action that changes THIS device only (nothing goes to the cloud until Save).
const cpJ=x=>JSON.parse(JSON.stringify(x));
function diffRows(local,remote){
  const rows=[];
  const row=(area,color,tag,label,btn,act)=>rows.push({area,color,tag,label,btn,act});
  const lc=x=>String(x||'').trim().toLowerCase();
  const nm=x=>typeof x==='string'?x:(x&&x.name)||JSON.stringify(x);
  const cutoff=Date.now()-14*86400000;
  const logOf=st=>(st.boughtLog||[]).filter(e=>e&&e.at>cutoff);
  const boughtNames=st=>new Set(logOf(st).map(e=>lc(e.name)));
  const lBought=boughtNames(local),rBought=boughtNames(remote);
  function removeMatching(list,name){const k=lc(name);for(let i=list.length-1;i>=0;i--)if(lc(list[i].name)===k)list.splice(i,1);}

  // Generic list matched by a key. get(st) must give an array (S's arrays exist).
  function keyed(area,get,key,label,o){
    o=o||{};
    const W=()=>o.w?o.w():get(S);
    const L=get(local)||[],R=get(remote)||[];
    const lm=new Map(L.map(x=>[key(x),x])),rm=new Map(R.map(x=>[key(x),x]));
    lm.forEach((x,k)=>{if(!rm.has(k)&&!(o.skipLocal&&o.skipLocal(x)))row(area,'green','only here',label(x),'Remove here',()=>{const arr=W();const i=arr.findIndex(y=>key(y)===k);if(i>=0)arr.splice(i,1);});});
    rm.forEach((y,k)=>{
      if(!lm.has(k)){if(!(o.skipCloud&&o.skipCloud(y)))row(area,'red','only on cloud',label(y),'Bring in',()=>{const arr=W();arr.push(cpJ(y));});return;}
      const x=lm.get(k);
      if(o.tick&&!!x.done!==!!y.done){
        row(area,x.done?'green':'red',x.done?'ticked here':'ticked on cloud',label(y),x.done?'Untick here':'Tick here',()=>{const arr=W();const t=arr.find(z=>key(z)===k);if(t)t.done=!!y.done;});
      }
      if(o.cmp){const d=o.cmp(x,y);if(d)row(area,'amber','edited',label(y)+' — '+d,'Use cloud',()=>{const arr=W();const i=arr.findIndex(z=>key(z)===k);if(i>=0)arr[i]=cpJ(y);});}
    });
  }

  // ---- Menu (completed past meals are ignored) ----
  const inHist=(st,m)=>(st.history||[]).some(h=>h.mid===m.id||(h.date===m.date&&(h.meal||'')===(m.meal||'')));
  const rank=m=>m.status==='later'?0:m.status==='planned'?1:2;
  const stName=m=>m.status==='later'?'not planned yet':m.status==='planned'?'planned':'here';
  const mlabel=m=>(m.date?fmtShort(m.date)+' ':'')+(m.meal||'no meal set');
  const lM=local.meals||[],rM=remote.meals||[];
  const lMap=new Map(lM.map(m=>[m.id,m])),rMap=new Map(rM.map(m=>[m.id,m]));
  lM.forEach(m=>{if(!rMap.has(m.id)&&!inHist(remote,m))row('Menu','green','only here',mlabel(m),'Remove here',()=>{const mm=S.meals.find(x=>x.id===m.id);if(mm)restoreStock(mm.ingredients);S.meals=S.meals.filter(x=>x.id!==m.id);expandedMeals.delete(m.id);});});
  rM.forEach(c=>{
    const m=lMap.get(c.id);
    if(!m){if(!inHist(local,c))row('Menu','red','only on cloud',mlabel(c),'Bring in',()=>{const nc=cpJ(c);S.meals.push(nc);consumeStock(nc.ingredients);});return;}
    const useCloud=()=>{const i=S.meals.findIndex(x=>x.id===c.id);if(i>=0){restoreStock(S.meals[i].ingredients);const nc=cpJ(c);S.meals[i]=nc;consumeStock(nc.ingredients);}};
    if(rank(m)!==rank(c)){
      const ahead=rank(m)>rank(c);
      row('Menu',ahead?'green':'red',ahead?'further along here':'further along on cloud',mlabel(c)+' ('+stName(m)+' on this device, '+stName(c)+' on cloud)','Use cloud',useCloud);
    }else{
      const d=[];
      if((m.meal||'')!==(c.meal||''))d.push('name');
      if(m.date!==c.date)d.push('date');
      if((m.notes||'')!==(c.notes||''))d.push('notes');
      const ni=x=>JSON.stringify((x.ingredients||[]).map(i=>lc(i.name)+'|'+canonUse(i.use)+'|'+ingQty(i)+'|'+(i.loc||'')).sort());
      if(ni(m)!==ni(c))d.push('ingredients or amounts');
      if(d.length)row('Menu','amber','edited',mlabel(c)+' — '+d.join(', ')+' differ','Use cloud',useCloud);
      // ticks on ingredients that are on the shopping list
      if(m.status!=='later'&&c.status!=='later'){
        const cm=new Map((c.ingredients||[]).map(i=>[lc(i.name),i]));
        (m.ingredients||[]).forEach(i=>{
          const ci=cm.get(lc(i.name));if(!ci||i.check||ci.check||i.loc||ci.loc)return;
          if(!!i.done===!!ci.done)return;
          row('Shopping list',i.done?'green':'red',i.done?'ticked here':'ticked on cloud',i.name+' ('+(c.meal||'meal')+')',i.done?'Untick here':'Tick here',()=>{const t=S.meals.find(x=>x.id===c.id);const ti=t&&t.ingredients.find(z=>lc(z.name)===lc(i.name));if(ti){ti.done=!!ci.done;if(!ci.done)ti.cleared=false;}});
        });
      }
    }
  });

  // ---- Completed meals ----
  const matchH=(a,b)=>(a.mid&&a.mid===b.mid)||(a.date===b.date&&(a.meal||'')===(b.meal||''));
  const hlabel=h=>(h.date?fmtShort(h.date)+' ':'')+(h.meal||'no meal set');
  const lH=local.history||[],rH=remote.history||[];
  lH.forEach(h=>{if(!rH.some(x=>matchH(h,x)))row('Completed meals','green','completed here',hlabel(h),'Put back on menu',()=>{
    const i=S.history.findIndex(x=>matchH(x,h));if(i<0)return;const g=S.history[i];unlogCooked(g.mid);
    S.meals.push({id:g.mid||uid(),date:g.date,meal:g.meal,ingredients:cpJ(g.ingredients||[]),notes:g.notes||'',status:'ready',recipeId:g.recipeId||null});
    S.history.splice(i,1);});});
  rH.forEach(h=>{if(!lH.some(x=>matchH(h,x)))row('Completed meals','red','completed on cloud',hlabel(h),'Complete here',()=>{
    const mi=S.meals.findIndex(m=>(h.mid&&m.id===h.mid)||(m.date===h.date&&(m.meal||'')===(h.meal||'')));
    if(mi>=0)S.meals.splice(mi,1);
    S.history.unshift(cpJ(h));if(S.history.length>14)S.history.length=14;});});

  // ---- Shopping list: extras, bought log, Non-urgent ----
  keyed('Shopping list',st=>st.extras,x=>lc(x.name),x=>x.name,{tick:true,skipLocal:x=>rBought.has(lc(x.name)),skipCloud:x=>lBought.has(lc(x.name))});
  const lLog=new Map(logOf(local).map(e=>[e.id,e])),rLog=new Map(logOf(remote).map(e=>[e.id,e]));
  lLog.forEach((e,id)=>{if(!rLog.has(id))row('Shopping list','green','bought here',e.name,null,null);});
  rLog.forEach((e,id)=>{if(!lLog.has(id))row('Shopping list','red','bought on cloud',e.name,'Mark bought here',()=>{
    ensureLayout();S.boughtLog.push(cpJ(e));
    removeMatching(S.extras,e.name);removeMatching(S.later,e.name);
    S.meals.forEach(m=>{if(m.status==='later')return;m.ingredients.forEach(i=>{if(lc(i.name)===lc(e.name)&&!i.loc&&!i.check){i.done=true;i.cleared=true;}});});
  });});
  // quantity changes made with the +/- on the shopping list
  const lq=local.shopQty||{},rq=remote.shopQty||{};
  new Set(Object.keys(lq).concat(Object.keys(rq))).forEach(k=>{
    const a=lq[k]||0,b=rq[k]||0;if(a===b)return;
    const f=v=>v===0?'no change':(v>0?'+':'')+v;
    row('Shopping list','amber','quantity differs',k+' — '+f(a)+' here, '+f(b)+' on cloud','Use cloud',()=>{if(!S.shopQty)S.shopQty={};if(b)S.shopQty[k]=b;else delete S.shopQty[k];});
  });
  keyed('Non-urgent',st=>st.later,x=>lc(x.name),x=>x.name,{tick:true});

  // ---- Recipes, Items we buy ----
  keyed('Recipes',st=>st.recipes,x=>x.id,x=>x.name||'untitled',{cmp:(x,y)=>JSON.stringify(x)!==JSON.stringify(y)?'differs':''});
  const real=m=>m.tag||m.count>0||m.manual||m.cupboard;
  keyed('Items we buy',st=>(st.master||[]).filter(real),x=>x.id,x=>x.name,{w:()=>S.master,cmp:(x,y)=>((x.tag||null)!==(y.tag||null)||!!x.cupboard!==!!y.cupboard)?'aisle or cupboard setting differs':''});

  // ---- Freezer, In stock ----
  const fz=x=>typeof x==='string'?{name:x,use:'whole',qty:1}:x;
  const fzLab=x=>x.name+' ('+(USE_LABEL[canonUse(x.use)]||'whole')+((x.qty||1)>1?' ×'+x.qty:'')+(x.kind?', '+x.kind:'')+')';
  const fzCmp=(x,y)=>JSON.stringify([canonUse(x.use),x.qty||1,x.kind||'',x.src||''])!==JSON.stringify([canonUse(y.use),y.qty||1,y.kind||'',y.src||''])?'amount or tag differs':'';
  keyed('Freezer',st=>(st.freezer||[]).map(fz),x=>lc(x.name),fzLab,{w:()=>S.freezer,cmp:fzCmp});
  keyed('In stock',st=>(st.components||[]).map(fz),x=>lc(x.name),fzLab,{w:()=>S.components,cmp:fzCmp});

  // ---- Regulars ----
  const regLabels={rai:"Rai's lunches",ryan:"Ryan's lunches",fern:"Fern's regulars",items:'Regular items'};
  Object.keys(regLabels).forEach(k=>keyed(regLabels[k],st=>(st.regulars&&st.regulars[k])||[],x=>lc(nm(x)),nm));

  // ---- Your own lists ----
  const lL=local.customLists||[],rL=remote.customLists||[];
  const lLm=new Map(lL.map(l=>[l.id,l])),rLm=new Map(rL.map(l=>[l.id,l]));
  const content=(st,l)=>l.page==='regulars'?((st.regulars||{})[l.id]||[]):((st.cl||{})[l.id]||[]);
  lL.forEach(l=>{if(!rLm.has(l.id))row('Your lists','green','only here',l.name+' ('+l.page+')','Remove here',()=>{
    S.customLists=S.customLists.filter(x=>x.id!==l.id);delete S.regulars[l.id];delete S.cl[l.id];
    S.layout[l.page]=(S.layout[l.page]||[]).filter(x=>x!==l.id);S.hiddenSecs=S.hiddenSecs.filter(x=>x!==l.id);});});
  rL.forEach(l=>{
    const x=lLm.get(l.id);
    if(!x){row('Your lists','red','only on cloud',l.name+' ('+l.page+')','Bring in',()=>{
      ensureLayout();S.customLists.push(cpJ(l));
      if(l.page==='regulars')S.regulars[l.id]=cpJ(content(remote,l));else S.cl[l.id]=cpJ(content(remote,l));
      S.layout[l.page]=secOrder(l.page);});return;}

// True when this device differs from the cloud copy in ANY saved data, including things the list doesn't itemise

function stableJ(x){
  if(Array.isArray(x))return'['+x.map(stableJ).join(',')+']';
  if(x&&typeof x==='object')return'{'+Object.keys(x).sort().filter(k=>{const v=x[k];return !(v===undefined||v===null||v===false||v==='');}).map(k=>JSON.stringify(k)+':'+stableJ(x[k])).join(',')+'}';

function syncSig(st){
  const fz=x=>typeof x==='string'?{name:x,use:'whole',qty:1}:{name:x.name,use:canonUse(x.use),qty:x.qty||1,kind:x.kind||'',src:x.src||''};
  const cut=Date.now()-14*86400000;
  const skip=new Set(['lastSavedAt','lastSavedByDevice']);
  const o={};
  Object.keys(st).forEach(k=>{if(!skip.has(k))o[k]=st[k];});
  ['meals','extras','later','recipes','history','masterHidden','leftDismissed','customLists','hiddenSecs'].forEach(k=>{o[k]=Array.isArray(st[k])?st[k]:[];});
  o.meals=o.meals.map(m=>Object.assign({},m,{status:m.status||'ready'}));
  o.hiddenSecs=o.hiddenSecs.slice().sort();o.leftDismissed=o.leftDismissed.slice().sort();
  o.freezer=(st.freezer||[]).map(fz);o.components=(st.components||[]).map(fz);
  o.master=(st.master||[]).filter(m=>m.tag||m.count>0||m.manual||m.cupboard).map(m=>[m.id,m.tag||null,!!m.cupboard,m.count||0]);

function netMsg(e){return(typeof navigator!=='undefined'&&navigator.onLine===false)?"You're offline. Your changes are safe on this device; try again when you have signal.":e.message;}
async function doSyncSave(){
  syncModalStep='loading';renderSyncModal();
  try{
    // pull in anything another device has logged in Stats first, so saving never drops it
    const r0=await fetch(`https://api.jsonbin.io/v3/b/${JB_BIN}/latest`,{headers:{'X-Master-Key':JB_KEY}});
    if(!r0.ok)throw new Error('HTTP '+r0.status);
    const remote=(await r0.json()).record||{};
    S.stats=mergeStats(S.stats,remote.stats);
    S.lastSavedAt=new Date().toISOString();
    S.lastSavedByDevice=DEVICE_ID;
    const payload=JSON.stringify(S);
    const resp=await fetch(`https://api.jsonbin.io/v3/b/${JB_BIN}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':JB_KEY},
      body:payload

    if(!resp.ok)throw new Error('HTTP '+resp.status);
    setCloudCache(JSON.parse(payload)); // the cloud now holds exactly this, so no re-read is needed
    save();clearDirty();

function uid(){return Date.now()+Math.random().toString(36).slice(2);}
function tds(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(ds,n){const[y,m,d]=ds.split('-');const dt=new Date(+y,+m-1,+d);dt.setDate(dt.getDate()+n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function fmtShort(ds){if(!ds)return '';const[y,m,d]=ds.split('-');const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return days[new Date(+y,+m-1,+d).getDay()]+' '+d+'/'+m+'/'+y.slice(2);}

// ── STATS ── a permanent log (S.stats) kept separately from the 14-item history, so totals keep growing.
// cooked: one entry per finished meal. bought: one entry per shopping item cleared with "Clear done".
function dsOf(ms){const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ensureStats(){
  if(!S.stats||typeof S.stats!=='object')S.stats={};
  const st=S.stats;
  ['cooked','bought','cookedM','boughtM'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[];});
  if(!st.seeded){
    st.seeded=true;
    // start from what the app already remembers: the last 14 completed meals and the last 14 days of shopping
    (S.history||[]).slice().reverse().forEach(h=>{if(h&&(h.meal||'').trim()&&!st.cooked.some(c=>c.mid&&c.mid===h.mid))st.cooked.push({mid:h.mid||h.hid,d:h.date,name:h.meal.trim(),rid:h.recipeId||null});});
    (S.boughtLog||[]).forEach(e=>{if(e&&e.name){const nm=String(e.name).trim();st.bought.push({d:dsOf(e.at),name:nm.charAt(0).toUpperCase()+nm.slice(1),aisle:null,n:1});}});
    const ds=st.cooked.map(c=>c.d).concat(st.bought.map(b=>b.d)).filter(Boolean).sort();
    st.since=ds.length&&ds[0]<tds()?ds[0]:tds();
  }
  if(!st.since)st.since=tds();
  // older purchase entries get a stable id (the same on every device) so two devices' logs can be merged without doubling up
  const seen={};
  st.bought.forEach(b=>{if(b.id)return;const k=(b.d||'')+'|'+String(b.name).toLowerCase()+'|'+(b.n||1);seen[k]=(seen[k]||0)+1;b.id='L'+hashStr(k)+'_'+seen[k];});
}
function boughtEntry(name,aisle,n){return{id:'B'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:tds(),name,aisle:aisle||null,n:n||1};}
// ── Rolling old entries into monthly totals (keeps the log small) ──
// Entries more than ~2 months old are folded into one total per month per meal / item. Day-by-day detail
// is only needed for the "last 30 days" view, so nothing visible changes.
function monthOf(d){return String(d||'').slice(0,7);}
function statsBound(){const c=addDays(tds(),-60).split('-');let y=+c[0],m=+c[1]-1;if(m<1){m=12;y--;}return y+'-'+String(m).padStart(2,'0');}
function rollStats(){
  ensureStats();const st=S.stats,bound=statsBound();
  if(st.rolledTo&&st.rolledTo>=bound)return false;
  const cm=new Map(st.cookedM.map(e=>[e.m+'|'+e.key,e])),bm=new Map(st.boughtM.map(e=>[e.m+'|'+e.key,e]));
  const keepC=[],keepB=[];
  st.cooked.forEach(c=>{
    const m=monthOf(c.d);if(!c.d||m>bound){keepC.push(c);return;}
    const key=c.rid||('n:'+c.name.toLowerCase()),k=m+'|'+key;
    let o=cm.get(k);if(!o){o={m,key,name:c.name,rid:c.rid||null,n:0};cm.set(k,o);}
    o.n++;o.name=c.name;
  });
  st.bought.forEach(b=>{
    const m=monthOf(b.d);if(!b.d||m>bound){keepB.push(b);return;}
    const key=masterKey(b.name)||String(b.name).toLowerCase(),k=m+'|'+key;
    let o=bm.get(k);if(!o){o={m,key,name:b.name,aisle:b.aisle||null,trips:0,n:0};bm.set(k,o);}
    o.trips++;o.n+=(b.n||1);o.name=b.name;if(b.aisle)o.aisle=b.aisle;
  });
  st.cooked=keepC;st.bought=keepB;st.cookedM=[...cm.values()];st.boughtM=[...bm.values()];st.rolledTo=bound;
  return true;
}
// ── Merging two copies of the stats (this device + the cloud) ──
// Day-by-day entries are combined by id. Monthly totals are combined by month and item (keeping the larger,
// since both copies were rolled up from the same events). Whichever copy has rolled further wins for those months.
function mergeStats(a,b){
  a=a||{};b=b||{};
  const ra=a.rolledTo||'',rb=b.rolledTo||'',rolledTo=ra>rb?ra:rb;
  const out={seeded:true,since:[a.since,b.since].filter(Boolean).sort()[0]||tds(),rolledTo,cooked:[],bought:[],cookedM:[],boughtM:[]};
  const live=d=>!d||!rolledTo||monthOf(d)>rolledTo;
  const seenC=new Set(),seenB=new Set();
  [a,b].forEach(x=>{
    (x.cooked||[]).forEach(c=>{if(!live(c.d))return;const k=c.mid||(c.d+'|'+c.name+'|'+(c.rid||''));if(seenC.has(k))return;seenC.add(k);out.cooked.push(c);});
    (x.bought||[]).forEach(e=>{if(!live(e.d))return;const k=e.id||(e.d+'|'+e.name+'|'+e.n);if(seenB.has(k))return;seenB.add(k);out.bought.push(e);});
  });
  const mergeM=(key,field)=>{const m=new Map();[a,b].forEach(x=>(x[key]||[]).forEach(e=>{const k=e.m+'|'+e.key,o=m.get(k);if(!o||(e[field]||0)>(o[field]||0))m.set(k,e);}));return[...m.values()];};
  out.cookedM=mergeM('cookedM','n');out.boughtM=mergeM('boughtM','trips');
  return out;
}
function unlogCooked(mid){
  if(!mid||!S.stats||!Array.isArray(S.stats.cooked))return;
  for(let i=S.stats.cooked.length-1;i>=0;i--)if(S.stats.cooked[i].mid===mid){S.stats.cooked.splice(i,1);return;}
}

function statsToMenu(rid){openDateModal(rid);}
function hashStr(s){let h=0;s=String(s);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function recSavedMs(r){const m=/^(\d{13})/.exec(String(r.id||''));if(!m)return null;const t=+m[1];return(t>1.4e12&&t<=Date.now()+864e5)?t:null;}
function ageWords(ms){

}

function statsPodiumData(cut){
  const map={};
  const add=(key,name,n,ord)=>{const o=map[key]||(map[key]={name,n:0,ord:-1});o.n+=n;o.name=name;if(ord>o.ord)o.ord=ord;};
  if(!cut)(S.stats.cookedM||[]).forEach(e=>add(e.key,e.name,e.n,-1));
  S.stats.cooked.forEach((c,i)=>{if(cut&&(c.d||'')<cut)return;add(c.rid||('n:'+c.name.toLowerCase()),c.name,1,i);});
  return Object.values(map).sort((a,b)=>b.n-a.n||b.ord-a.ord);
}
function statsBoughtData(cut){

  const add=(name,aisle,trips,n)=>{
    const key=masterKey(name)||String(name).toLowerCase(),mm=masterFor(name);
    const o=map[key]||(map[key]={name,trips:0,packs:0,aisle:null});
    o.trips+=trips;o.packs+=n;o.name=name;

function shameList(){

function donutHTML(parts,centerN,centerL,counts){
  const total=parts.reduce((n,p)=>n+p.v,0);if(!total)return'';
  let off=0;
  const segs=parts.map((p,i)=>{
    const pct=p.v/total*100,len=Math.max(pct-(parts.length>1?0.9:0),0.3);
    const col=p.other?'var(--text3)':PIE_COLS[i%PIE_COLS.length];p.col=col;
    const s=`<circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:${col}" stroke-width="6" stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${(25-off).toFixed(2)}"/>`;
    off+=pct;return s;
  }).join('');
  const legend=parts.map(p=>`<div class="lg-row"><span class="lg-sw" style="background:${p.col}"></span><span class="lg-nm">${esc(p.name)}</span><span class="lg-v">${counts?p.v:Math.round(p.v/total*100)+'%'}</span></div>`).join('');
  return`<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 42 42" role="img"><circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:var(--surface2)" stroke-width="6"/>${segs}</svg><div class="donut-c"><b>${centerN}</b><span>${esc(centerL)}</span></div></div><div class="legend">${legend}</div></div>`;
}

function rearrMove(idx,dir){

  const keep=['id','date','notes'];
  const keys=[...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>!keep.includes(k));
  keys.forEach(k=>{const t=a[k];if(b[k]===undefined)delete a[k];else a[k]=b[k];if(t===undefined)delete b[k];else b[k]=t;});

// ── ITEMS WE BUY: master list of everything cleared off the shopping list, with an aisle tag ──
const AISLES=[

];

function migrateLocCheck(){if(S.locChk)return;S.locChk=1;(S.meals||[]).forEach(m=>{if(m.status==='later'||m.status==='ready'||!m.status)return;(m.ingredients||[]).forEach(i=>{if(i.loc&&!i.done&&i.check===undefined){i.check=true;i.checked=false;}});});}
function migrateAisles(){const mp={ambient:'ingredients'};(S.master||[]).forEach(m=>{if(m.tag&&mp[m.tag])m.tag=mp[m.tag];});}
migrateAisles();

function moveAisle(id,d){const o=aisleList().map(a=>a.id),i=o.indexOf(id),j=i+d;if(i<0||j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];S.aisleOrder=o;save();renderAisleModal();}

function aisleLabel(id){const a=AISLES.find(x=>x.id===id);return a?a.label:'';}
function masterKey(n){return ingWords(n,true).join(' ');}   // "2 Red Onions" -> "red onion"
function masterName(n){const t=ingWords(n,true,true).join(' ');return t.charAt(0).toUpperCase()+t.slice(1);}
// Every recipe ingredient and every Regulars item is added to the master list automatically
// (never bought yet, no aisle). Items removed by hand are remembered in masterHidden so they
// don't keep coming back; buying or manually adding one clears that.
function syncMaster(){
  if(!S.master)S.master=[];if(!S.masterHidden)S.masterHidden=[];
  const have=new Set(S.master.map(m=>m.key)),hid=new Set(S.masterHidden);
  let changed=false;
  function addName(n){
    const key=masterKey(n);if(!key||have.has(key)||hid.has(key))return;
    have.add(key);changed=true;
    S.master.push({id:key,name:masterName(n),key,count:0,last:null,tag:null});
  }
  (S.recipes||[]).forEach(r=>(r.ingredients||[]).forEach(i=>addName(typeof i==='string'?i:i&&i.name)));
  Object.values(S.regulars||{}).forEach(arr=>(arr||[]).forEach(addName));
  // Older recipes carried their own cupboard flag; it now lives on the master item.
  (S.recipes||[]).forEach(r=>(r.ingredients||[]).forEach(i=>{
    if(i&&typeof i==='object'&&i.cupboard){
      const e=ensureMaster(i.name);if(e&&!e.cupboard)e.cupboard=true;
      delete i.cupboard;changed=true;
    }
  }));
  return changed;
}
// The master item for a name (created if missing, e.g. after being removed by hand)
function ensureMaster(name){
  const key=masterKey(name);if(!key)return null;
  let e=S.master.find(m=>m.key===key);
  if(!e){unhide(key);e={id:key,name:masterName(name),key,count:0,last:null,tag:null};S.master.push(e);}
  return e;
}
// Cupboard items (herbs, spices, sauces…) are matched on the exact cleaned name only
function isCupboard(name){const key=masterKey(name);return !!(key&&S.master.some(m=>m.key===key&&m.cupboard));}
function setCupboard(name,on){const e=ensureMaster(name);if(!e)return;if(on)e.cupboard=true;else delete e.cupboard;}
function unhide(key){S.masterHidden=(S.masterHidden||[]).filter(k=>k!==key);}
function recordBought(names){
  const seen=new Set();
  names.forEach(n=>{
    const key=masterKey(n);if(!key||seen.has(key))return;seen.add(key);unhide(key);
    const e=S.master.find(m=>m.key===key);
    if(e){e.last=tds();}
    else S.master.push({id:key,name:masterName(n),key,count:1,last:tds(),tag:null});
  });
}
// Find the master entry for a shopping list item: same cleaned name, else the most specific
// master item whose words are all in the shopping item ("onion" covers "red onion pack").
function masterFor(display){
  const key=masterKey(display);if(!key)return null;
  const exact=S.master.find(m=>m.key===key);if(exact)return exact;
  const w=ingWords(display,true);let best=null,bl=0;
  S.master.forEach(m=>{const mw=m.key.split(' ');if(mw.length>bl&&mw.every(x=>w.includes(x))){best=m;bl=mw.length;}});
  return best;
}

function remVariety(i){if(!Array.isArray(S.varieties))S.varieties=VARIETY_DEF.slice();S.varieties.splice(i,1);save();rReg();}

function togMasterCup(id){const e=S.master.find(m=>m.id===id);if(!e)return;if(e.cupboard)delete e.cupboard;else e.cupboard=true;save();rReg();}
function setMasterTag(id,tag){const e=S.master.find(m=>m.id===id);if(!e)return;e.tag=(e.tag===tag)?null:tag;save();rReg();}
// Change the wording of an item. The old wording is hidden so it doesn't reappear from recipes/Regulars;
// if the new wording already exists as another item, the two are merged.
function renMaster(id){
  const e=S.master.find(m=>m.id===id);if(!e)return;
  const i=document.getElementById('mst-ren-'+id);const v=i?i.value.trim():'';if(!v)return;
  const key=masterKey(v);if(!key)return;
  const name=masterName(v);
  if(key===e.key){e.name=name;save();rReg();return;}
  const other=S.master.find(m=>m.key===key&&m.id!==id);
  if(!S.masterHidden.includes(e.key))S.masterHidden.push(e.key);
  S.masterHidden=S.masterHidden.filter(k=>k!==key);
  if(other){other.count=(other.count||0)+(e.count||0);if(!other.tag&&e.tag)other.tag=e.tag;if(e.cupboard)other.cupboard=true;if(e.manual)other.manual=true;
    S.master=S.master.filter(m=>m.id!==id);masterOpen=other.id;}
  else{e.name=name;e.key=key;e.manual=true;}
  save();rReg();
}
function remMaster(id){const e=S.master.find(m=>m.id===id);if(e&&!S.masterHidden.includes(e.key))S.masterHidden.push(e.key);S.master=S.master.filter(m=>m.id!==id);if(masterOpen===id)masterOpen=null;save();rReg();}
function masterToShop(id){
  const e=S.master.find(m=>m.id===id);if(!e)return;
  S.extras.push({name:e.name,done:false});save();
  flashAdded(document.getElementById('mst-add-'+id));
  if(ctab()==='shopping')rShop();
}
function addMaster(){
  const i=document.getElementById('mst-in');const v=i.value.trim();if(!v)return;
  const key=masterKey(v);if(!key){i.value='';return;}
  unhide(key);
  if(!S.master.find(m=>m.key===key))S.master.push({id:key,name:masterName(v),key,count:0,last:null,tag:null,manual:true});
  i.value='';save();rReg();flashAdded(document.getElementById('mst-addbtn'));refocus('mst-in');
}

// Long press on a pill opens the edit window; a quick tap does whatever that pill's own tap does
let holdT=null,holdFired=false,holdX=0,holdY=0;
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest&&e.target.closest('.ing-pill[data-k]');if(!t)return;
  holdFired=false;holdX=e.clientX;holdY=e.clientY;clearTimeout(holdT);
  holdT=setTimeout(()=>{holdFired=true;try{if(navigator.vibrate)navigator.vibrate(12);}catch(x){}openAmt(t.dataset.k,t.dataset.a,+t.dataset.b);},480);
});
document.addEventListener('pointermove',e=>{if(holdT&&(Math.abs(e.clientX-holdX)>8||Math.abs(e.clientY-holdY)>8)){clearTimeout(holdT);holdT=null;}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(holdT);holdT=null;}));
document.addEventListener('click',e=>{if(holdFired&&e.target.closest&&e.target.closest('.ing-pill[data-k]')){e.stopPropagation();e.preventDefault();}holdFired=false;},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.ing-pill'))e.preventDefault();});

function bldList(kind){return kind==='add'?(addM?addM.ings:[]):kind==='edm'?(editMeal?editMeal.ings:[]):dRI;}

function bldBump(kind,i,d){const g=bldList(kind)[i];if(!g)return;const k=Math.max(0,Math.min(STEPS.length-1,STEPS.indexOf(snapAmt(ingAmt(g)))+d));setIngAmt(g,STEPS[k]);bldRefresh(kind);}
function bldCup(kind,i){const g=bldList(kind)[i];if(!g)return;const on=!(g.cupboard||isCupboard(g.name));g.cupboard=on;if(g._c0!==undefined)g._tog=true;setCupboard(g.name,on);bldRefresh(kind);}
function bldRem(kind,i){bldList(kind).splice(i,1);bldRefresh(kind);}

// The edit window (long press a pill): name, amount slider, cupboard toggle, and for menu cards the check status and aisle
let amtCtx=null;
function amtIng(){
  const c=amtCtx;if(!c)return null;
  if(c.kind==='rec'){const r=S.recipes.find(x=>x.id===c.a);return r&&r.ingredients[c.b]||null;}
  if(c.kind==='meal'){const m=mById(c.a);return m&&m.ingredients[c.b]||null;}
  return null;
}
function openAmt(kind,a,b){amtCtx={kind,a,b};const g=amtIng();if(!g){amtCtx=null;return;}amtCtx.orig=g.name;renderAmt();}
function amtCommit(){
  const c=amtCtx,g=amtIng();if(!c||!g)return;
  g.name=String(g.name||'').trim()||c.orig;
  save();
  if(c.kind==='rec')rRecKeepOpen();else render();
}
function closeAmt(){amtCommit();amtCtx=null;renderAmt();}
function mealState(g){return g.check?(g.checked?'have':'check'):'need';}
function aisleChipsHTML(cur,fn){return`<div class="tag-row" style="flex-basis:100%;margin:2px 0 0">${aisleList().map(a=>`<span class="tag ${cur===a.id?'on':'off'}" onclick="${fn}('${a.id}')">${a.label}</span>`).join('')}</div>`;}
function renderAmt(){
  const el=document.getElementById('amt-panel'),g=amtIng(),c=amtCtx;
  if(!c||!g){amtCtx=null;if(el)el.remove();return;}
  const a=ingAmt(g),si=Math.min(10,Math.max(0,SLIDER_STEPS.indexOf(snapAmt(a))<0?10:SLIDER_STEPS.indexOf(snapAmt(a))));
  const cupOn=c.kind==='meal'?!!(g.cup||(g.check&&!g.loc)):isCupboard(g.name);

  let extra='';
  if(c.kind==='meal'){
    if(cupOn||g.loc)extra+=`<div class="uc-fl" style="margin-top:0.9rem">Status</div>${seg([['check','To check'],['have','Have it'],['need','Need it']],mealState(g),'amtStatus')}`;
    const mm=masterFor(g.name);
    extra+=`<div class="uc-fl" style="margin-top:0.9rem">Aisle</div>${aisleChipsHTML(mm&&mm.tag?mm.tag:null,'amtAisle')}`;
  }
  const html=`<div class="modal-bg" id="amt-panel" style="z-index:70" onclick="if(event.target===this)closeAmt()"><div class="modal-card" style="max-width:350px">
    <h2 style="margin-bottom:0.7rem">Edit ingredient</h2>
    <div class="uc-fl">Name</div><input type="text" value="${esc(g.name)}" oninput="amtName(this.value)" style="margin-bottom:0.2rem">
    <div class="uc-fl" style="margin-top:0.9rem">Amount</div><div class="amt-big" id="amt-lab">${amtText(a)}</div>
    <input type="range" min="0" max="10" step="1" value="${si}" oninput="amtSlide(this.value)" style="width:100%;padding:0;accent-color:var(--acc)">
    <div class="amt-ticks"><span>a little</span><span>half</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
    <div class="uc-fl" style="margin-top:0.9rem">Cupboard item</div>${seg([['0','No'],['1','Yes']],cupOn?'1':'0','amtCup')}
    ${extra}
    <div class="modal-foot" style="position:static;box-shadow:none;margin:1rem 0 0;padding:0;background:none"><div class="modal-btns"><button class="btn red" style="flex:1" onclick="amtRemove()">Remove</button><button class="btn pri" style="flex:2" onclick="closeAmt()">Done</button></div></div>
  </div></div>`;
  if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
