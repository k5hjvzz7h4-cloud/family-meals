function addDRI(){const i=document.getElementById('rii');const v=i.value.trim();if(!v)return;dRI.push({name:v,use:'whole'});i.value='';rdRI();flashAdded(document.getElementById('driadd'));i.focus();}
function remDRI(i){dRI.splice(i,1);rdRI();}
function togDRICup(i){if(!dRI[i])return;const on=!(dRI[i].cupboard||isCupboard(dRI[i].name));dRI[i].cupboard=on;setCupboard(dRI[i].name,on);rdRI();}
function cycDRI(i){if(dRI[i])dRI[i].use=nextUse(dRI[i].use);rdRI();}
function rdRI(){const el=document.getElementById('ril');if(!el)return;el.innerHTML=dRI.map((g,i)=>`<li class="iei"><span style="color:var(--text3);font-size:11px">&#8722;</span><span style="flex:1;cursor:pointer" onclick="togDRICup(${i})">${esc(g.name)}${(g.cupboard||isCupboard(g.name))?'<span class="use-tag" style="color:var(--text3);background:var(--surface2);border-color:var(--border-med)">cupboard</span>':''}</span><button class="ing-pill-use ${g.use}" style="margin-right:6px" onclick="cycDRI(${i})" aria-label="amount used: ${USE_LABEL[g.use]}. Tap to change">${USE_LABEL[g.use]}</button><button onclick="remDRI(${i})">&#10005;</button></li>`).join('');}
let addRecipeOpen=false;
function openAddRecipe(){addRecipeOpen=true;renderAddRecipeModal();}
function closeAddRecipe(){addRecipeOpen=false;dRI=[];dTags=[];renderAddRecipeModal();}
function renderAddRecipeModal(){
  const el=document.getElementById('add-recipe-modal');
  if(!addRecipeOpen){if(el)el.remove();return;}
  const html=`<div class="modal-bg" id="add-recipe-modal"><div class="modal-card">
    <h2>Add a recipe</h2>
    <div class="field"><label class="fl" for="rni">Name</label><input type="text" id="rni" placeholder="e.g. chicken tikka masala" onkeydown="if(event.key==='Enter')document.getElementById('rii').focus()"></div>
    <div class="field"><label class="fl">Ingredients</label><ul class="iel" id="ril"></ul>
      <div class="use-hint">Tap an ingredient's amount to change it (whole, half or a little). Tap its name to mark it as a cupboard item.</div>
      <div class="iar"><input type="text" id="rii" placeholder="type ingredient and press enter..." onkeydown="if(event.key==='Enter')addDRI()"><button class="btn sm" id="driadd" onclick="addDRI()">+ Add</button></div>
    </div>
    <div class="field"><label class="fl" for="rmi">Method</label><textarea id="rmi" placeholder="cooking instructions..." rows="5"></textarea></div>
    <div class="field"><label class="fl">Tags</label><div class="tag-row" id="draft-tags">${TAGS.map(t=>tagHTML(t.id,dTags.includes(t.id),`togDraftTag('${t.id}')`)).join('')}</div></div>
    <div class="modal-btns" style="padding-top:0.5rem"><button class="btn pri" onclick="svRec()">Save recipe</button><button class="btn gh" onclick="closeAddRecipe()">Cancel</button></div>
  </div></div>`;
  if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
  rdRI();
}
function svRec(){
  const nameEl=document.getElementById('rni');if(!nameEl)return;
  const name=nameEl.value.trim();if(!name)return;
  const method=document.getElementById('rmi').value.trim();
  S.recipes.push({id:uid(),name,ingredients:dRI.map(x=>({name:x.name,use:x.use})),method,pinned:false,tags:[...dTags]});
  dRI.forEach(x=>{if(x.cupboard)setCupboard(x.name,true);});
  dRI=[];dTags=[];
  addRecipeOpen=false;
  const el=document.getElementById('add-recipe-modal');if(el)el.remove();
  save();rRec();
}
function delRec(id){if(confirm('Delete this recipe?')){S.recipes=S.recipes.filter(r=>r.id!==id);S.meals.forEach(m=>{if(m.recipeId===id)m.recipeId=null;});save();rRec();}}
function togPin(id){const r=S.recipes.find(x=>x.id===id);if(r)r.pinned=!r.pinned;save();rRec();}
function cycSort(){const o=['az','za','newest','oldest'];const i=o.indexOf(S.recipeSort||'az');S.recipeSort=o[(i+1)%o.length];save();rRec();}
function sortLbl(){return{az:'A \u2192 Z',za:'Z \u2192 A',newest:'Newest first',oldest:'Oldest first'}[S.recipeSort||'az'];}
function addIR(id){
  const i=document.getElementById('ria-'+id);const v=i.value.trim();if(!v)return;
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  r.ingredients.push({name:v,use:'whole'});i.value='';save();
  // Update pill list in-place without collapsing card
  const grid=document.getElementById('rig-'+id);
  if(grid){
    grid.innerHTML=recPillsHTML(r);
  }
  flashAdded(document.getElementById('riadd-'+id));
  i.focus();
}
function recPillsHTML(r){
  return r.ingredients.map((ing,j)=>`<div class="ing-pill${isCupboard(ing.name)?' cup':''}"><span class="ing-pill-text" style="cursor:pointer" onclick="togCup('${r.id}',${j})" title="tap to mark as a cupboard item">${esc(ing.name)}</span><button class="ing-pill-use ${ing.use}" onclick="cycRI('${r.id}',${j})" aria-label="amount used: ${USE_LABEL[ing.use]}. Tap to change">${USE_LABEL[ing.use]}</button><button class="ing-pill-del" onclick="remRI('${r.id}',${j})" aria-label="remove">&#10005;</button></div>`).join('');
}
function togCup(id,j){
  const r=S.recipes.find(x=>x.id===id);if(!r||!r.ingredients[j])return;
  const name=r.ingredients[j].name;
  setCupboard(name,!isCupboard(name));
  save();
  // other recipes may use the same ingredient, so redraw the whole Recipes tab
  const open=S.recipes.filter(x=>{const b=document.getElementById('rb-'+x.id);return b&&b.style.display==='block';}).map(x=>x.id);
  rRec();
  open.forEach(rid=>{const b=document.getElementById('rb-'+rid),a=document.getElementById('ra-'+rid);if(b)b.style.display='block';if(a)a.textContent='▼';});
}
function cycRI(id,j){
  const r=S.recipes.find(x=>x.id===id);if(!r||!r.ingredients[j])return;
  r.ingredients[j].use=nextUse(r.ingredients[j].use);save();
  const grid=document.getElementById('rig-'+id);
  if(grid)grid.innerHTML=recPillsHTML(r);
}
function remRI(id,j){
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  r.ingredients.splice(j,1);save();
  const grid=document.getElementById('rig-'+id);
  if(grid){
    grid.innerHTML=recPillsHTML(r);
  }
}
function sEM(id){document.getElementById('md-'+id).style.display='none';document.getElementById('me-'+id).style.display='block';document.getElementById('mi-'+id).focus();}
function cEM(id){document.getElementById('md-'+id).style.display='';document.getElementById('me-'+id).style.display='none';}
function svM(id){const r=S.recipes.find(x=>x.id===id);if(r)r.method=document.getElementById('mi-'+id).value;save();rRec();}
function recToShop(id){
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  r.ingredients.forEach(ing=>{if(!isCupboard(ing.name))S.extras.push({name:ing.name,done:false,use:ing.use});});
  save();
  flashAdded(document.getElementById('shop-'+id));
  setTimeout(()=>showTab('shopping'),450);
}

// ── REGULARS ──
const REG_ORDER=[['rai',"Rai's lunches"],['ryan',"Ryan's lunches"],['fern',"Things for Fern"],['items','Regular items']];
function regRow(key,idx,name){
  return`<div class="reg-row"><button class="reg-add-btn" id="reg-add-${key}-${idx}" onclick="addRegToShop('${key}',${idx})" aria-label="add to shopping list">+</button><span>${esc(name)}</span><button class="reg-del-btn" onclick="remReg('${key}',${idx})" aria-label="remove">&#10005;</button></div>`;
}
function addReg(key){
  const i=document.getElementById('reg-in-'+key);
  const v=i.value.trim();if(!v)return;
  S.regulars[key].push(v);
  save();rReg();
  flashAdded(document.getElementById('regadd-'+key));
  refocus('reg-in-'+key);
}
function remReg(key,idx){
  S.regulars[key].splice(idx,1);save();rReg();
}
function refocus(id){
  const y=window.scrollY;
  const e=document.getElementById(id);
  if(e)e.focus({preventScroll:true});
  window.scrollTo(0,y);
}
function flashAdded(btn){
  if(!btn)return;
  const orig=btn.innerHTML;
  btn.classList.add('added');
  btn.innerHTML='&#10003;';
  btn.disabled=true;
  setTimeout(()=>{
    btn.classList.remove('added');
    btn.innerHTML=orig;
    btn.disabled=false;
  },900);
}
function addRegToShop(key,idx){
  const name=S.regulars[key][idx];if(!name)return;
  S.extras.push({name,done:false});
  save();
  flashAdded(document.getElementById('reg-add-'+key+'-'+idx));
  if(ctab()==='shopping')rShop();
}
function addAllReg(key){
  const list=S.regulars[key]||[];
  if(!list.length)return;
  list.forEach((name,idx)=>{
    S.extras.push({name,done:false});
    flashAdded(document.getElementById('reg-add-'+key+'-'+idx));
  });
  save();
  flashAdded(document.getElementById('addall-'+key));
  if(ctab()==='shopping')rShop();
}

// ── FREEZER ── freeform list of ready-to-defrost meals, offered from the recipe picker on Menu
// Freezer / In stock share one card, switched with tabs
let fzTab=(function(){try{return localStorage.getItem('mpl_fztab')==='components'?'components':'freezer';}catch(e){return'freezer';}})();
function setFzTab(t){fzTab=t;try{localStorage.setItem('mpl_fztab',t);}catch(e){}rReg();}
function addComponent(){
  const i=document.getElementById('cmp-in');
  const v=i.value.trim();if(!v)return;
  if(!S.components.some(c=>c.name.toLowerCase()===v.toLowerCase()))S.components.push({name:v,use:'whole',qty:1});
  i.value='';save();rReg();
  flashAdded(document.getElementById('cmp-add'));
  refocus('cmp-in');
}
function remComponent(idx){
  const c=S.components[idx];
  // a leftover that was moved here and is then removed shouldn't pop back into Leftovers
  if(c&&c.src==='leftover'){if(!S.leftDismissed)S.leftDismissed=[];const k=ingWords(c.name).join(' ');if(!S.leftDismissed.includes(k))S.leftDismissed.push(k);}
  S.components.splice(idx,1);save();rReg();
}
function cycComponent(idx){if(S.components[idx])S.components[idx].use=nextUse(S.components[idx].use);save();rReg();}
function cycFreezer(idx){if(S.freezer[idx])S.freezer[idx].use=nextUse(S.freezer[idx].use);save();rReg();}
function togFzKind(idx){const f=S.freezer[idx];if(!f)return;f.kind=f.kind==='meal'?'ingredient':'meal';save();rReg();}
function adjQty(list,idx,d){const it=S[list][idx];if(!it)return;it.qty=Math.max(1,(it.qty||1)+d);save();rReg();}
function amtBtn(use,fn,idx){const u=canonUse(use);return`<button class="ing-pill-use ${u}" onclick="${fn}(${idx})" aria-label="amount: ${USE_LABEL[u]}. Tap to change">${USE_LABEL[u]}</button>`;}
function qtyHTML(list,idx,q){return`<span class="qty"><button onclick="adjQty('${list}',${idx},-1)" aria-label="fewer">&#8722;</button><b>${q||1}</b><button onclick="adjQty('${list}',${idx},1)" aria-label="more">+</button></span>`;}
function fzCardHTML(){
  const open=!!openBox.fz;
  const tab=(id,label)=>`<button class="btn sm ${fzTab===id?'pri':'gh'}" style="flex:1" onclick="setFzTab('${id}')">${label}</button>`;
  let body='';
  if(open){
    if(fzTab==='freezer'){
      body=`<p style="font-size:12px;color:var(--text2);margin:0 0 0.6rem">Tag each item. <b>Meal</b>: offered as a whole meal option. <b>Ingredient</b>: used when suggesting recipes, and used up when a recipe needs it. Tap the tag or amount to change it.</p>
      ${S.freezer.length?`<div>${S.freezer.map((f,j)=>`<div class="cmp-row"><span class="cmp-name">${esc(f.name)}</span><button class="reg-del-btn" onclick="remFreezer(${j})" aria-label="remove">&#10005;</button><div class="cmp-ctl"><button class="ing-pill-use ${f.kind==='meal'?'tagged':''}" onclick="togFzKind(${j})">${f.kind==='meal'?'meal':'ingredient'}</button>${amtBtn(f.use,'cycFreezer',j)}${qtyHTML('freezer',j,f.qty)}</div></div>`).join('')}</div>`:'<p class="es">Nothing in the freezer yet.</p>'}
      <div class="iar" style="margin-top:0.5rem">
        <input type="text" id="fz-in" placeholder="e.g. leftover bolognese" onkeydown="if(event.key==='Enter')addFreezer()">
        <button class="btn sm" id="fz-add" onclick="addFreezer()">+ Add</button>
      </div>`;
    }else{
      body=`<p style="font-size:12px;color:var(--text2);margin:0 0 0.6rem">Things you have in (naan, tinned tomatoes&#8230;). They're used when suggesting recipes, and used up when a recipe that needs them goes on the menu. Tap the amount to change it.</p>
      ${S.components.length?`<div>${S.components.map((n,j)=>`<div class="cmp-row"><span class="cmp-name">${esc(n.name)}</span><button class="reg-del-btn" onclick="remComponent(${j})" aria-label="remove">&#10005;</button><div class="cmp-ctl">${amtBtn(n.use,'cycComponent',j)}${qtyHTML('components',j,n.qty)}</div></div>`).join('')}</div>`:'<p class="es">Nothing added yet.</p>'}
      <div class="iar" style="margin-top:0.5rem">
        <input type="text" id="cmp-in" placeholder="e.g. naan, tinned tomatoes" onkeydown="if(event.key==='Enter')addComponent()">
        <button class="btn sm" id="cmp-add" onclick="addComponent()">+ Add</button>
      </div>`;
    }
    body=`<div style="margin-top:0.7rem"><div style="display:flex;gap:6px;margin-bottom:0.7rem">${tab('freezer','&#129482; Freezer'+(S.freezer.length?' ('+S.freezer.length+')':''))}${tab('components','In stock'+(S.components.length?' ('+S.components.length+')':''))}</div>${body}</div>`;
  }
  return`<div class="card" style="border-color:var(--blue-border);background:var(--blue-bg)">
    <div class="box-head" onclick="togBox('fz')"><span class="box-arrow" style="color:var(--blue-text)">${boxArrow('fz')}</span><h2 style="color:var(--blue-text)">&#129482; Freezer &amp; in stock</h2><span class="box-n">${S.freezer.length+S.components.length||''}</span></div>
    ${body}
  </div>`;
}
function addFreezer(){
  const i=document.getElementById('fz-in');
  const v=i.value.trim();if(!v)return;
  S.freezer.push({name:v,use:'whole',qty:1,kind:'meal'});i.value='';save();rReg();
  flashAdded(document.getElementById('fz-add'));
  refocus('fz-in');
}
function remFreezer(idx){S.freezer.splice(idx,1);save();rReg();}
function rReg(){
  const c=document.getElementById('tab-regulars');
  const regBox=(key,label)=>{
    const list=S.regulars[key]||[];
    const id='reg-'+key,open=!!openBox[id];
    return`<div class="card">
      <div class="box-head" onclick="togBox('${id}')"><span class="box-arrow">${boxArrow(id)}</span><h2>${label}</h2><span class="box-n">${list.length||''}</span>${open&&list.length?`<button class="btn sm amb" id="addall-${key}" onclick="event.stopPropagation();addAllReg('${key}')">+ add all</button>`:''}</div>
      ${open?`<div style="margin-top:0.6rem">${list.length?`<div>${list.map((n,j)=>regRow(key,j,n)).join('')}</div>`:'<p class="es">Nothing added yet.</p>'}
      <div class="iar" style="margin-top:0.5rem">
        <input type="text" id="reg-in-${key}" placeholder="add item..." onkeydown="if(event.key==='Enter')addReg('${key}')">
        <button class="btn sm" id="regadd-${key}" onclick="addReg('${key}')">+ Add</button>
      </div></div>`:''}
    </div>`;
  };
  c.innerHTML=secOrder('regulars').filter(id=>!secHidden(id)).map(id=>id==='fz'?fzCardHTML():regBox(id,secName(id))).join('')+layoutBtnsHTML('regulars')+masterCardHTML();
}
function getSorted(){
  const fn={az:(a,b)=>a.name.localeCompare(b.name),za:(a,b)=>b.name.localeCompare(a.name),newest:(a,b)=>(b.id||'').localeCompare(a.id||''),oldest:(a,b)=>(a.id||'').localeCompare(b.id||'')}[S.recipeSort||'az'];
  return[...S.recipes.filter(r=>r.pinned).sort(fn),...S.recipes.filter(r=>!r.pinned).sort(fn)];
}
function togRec(id){
  const body=document.getElementById('rb-'+id);
  const arr=document.getElementById('ra-'+id);
  if(!body)return;
  const open=body.style.display==='block';
  body.style.display=open?'none':'block';
  arr.textContent=open?'▶':'▼';
}
function howToHTML(){
  return`<div class="util-card" style="margin-top:1.6rem">
    <div class="util-head" style="cursor:default"><span>How to use</span></div>
    <p class="util-note" style="font-size:12px"><b>Cupboard items.</b> Tap an ingredient's name to make it paler. That marks it as a cupboard item (herbs, spices, sauces). When the recipe goes on the menu it shows as &#8220;to check&#8221; instead of going on the shopping list, and it applies to that ingredient in every recipe.</p>
    <p class="util-note" style="font-size:12px"><b>How much of a pack.</b> The button on each ingredient says how much of a pack the recipe uses: <b>whole</b> (darkest), <b>half</b>, or <b>a little</b> (lightest, counted as a tenth of a pack). Tap it to change. The shopping list rounds up to whole packs.</p>
    <p class="util-note" style="font-size:12px"><b>Leftovers.</b> Whatever is left of a pack after the meals on your menu shows under Leftovers on the Menu tab, and recipes that would use it up are suggested.</p>
  </div>`;
}
function rRec(){
  const c=document.getElementById('tab-recipes');
  let h=`<button class="btn pri" style="width:100%;margin-bottom:${S.recipes.length?'1.1rem':'0.75rem'}" onclick="openAddRecipe()">+ Add a recipe</button>`;
  if(!S.recipes.length){h+='<p class="es">No recipes saved yet.</p>'+howToHTML();c.innerHTML=h;return;}
  // Tag filter bar — only show tags that exist on at least one recipe
  const usedTags=TAGS.filter(t=>S.recipes.some(r=>r.tags&&r.tags.includes(t.id)));
  if(usedTags.length){
    h+=`<div class="tag-row" style="margin-bottom:0.75rem">
      ${usedTags.map(t=>tagHTML(t.id,activeTagFilters.has(t.id),`setTagFilter('${t.id}')`)).join('')}
      ${activeTagFilters.size?`<span class="tag off" onclick="clearTagFilters()" style="color:var(--text3)">✕ clear</span>`:''}
    </div>`;
  }
  const filtered=activeTagFilters.size?getSorted().filter(r=>r.tags&&[...activeTagFilters].every(t=>r.tags.includes(t))):getSorted();
  h+=`<div class="sb"><span>${filtered.length} recipe${filtered.length!==1?'s':''}</span><button class="sort-btn" onclick="cycSort()">&#8645; ${sortLbl()}</button></div>`;
  h+=filtered.map(r=>{
    const hM=r.method&&r.method.trim();
    const rtags=(r.tags||[]);
    return`<div class="rc${r.pinned?' pn':''}">
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="togRec('${r.id}')" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);padding:4px;flex-shrink:0;min-width:28px;min-height:44px;display:flex;align-items:center;justify-content:center" id="ra-${r.id}">&#9654;</button>
        ${r.pinned?'<span style="color:var(--amber-text);font-size:13px;flex-shrink:0">&#128204;</span>':''}
        <div style="flex:1;min-width:0" onclick="togRec('${r.id}')">
          <div class="rn">${esc(r.name)}</div>
          ${rtags.length?`<div style="font-size:13px;margin-top:2px">${rtags.map(tid=>{const t=TAGS.find(x=>x.id===tid);return t?t.label.split(' ')[0]:'';}).join(' ')}</div>`:''}
        </div>
        <button class="btn sm amb" id="shop-${r.id}" onclick="recToShop('${r.id}')">+ shop</button>
      </div>
      <div id="rb-${r.id}" style="display:none">
        <div style="height:0.5px;background:var(--border);margin:0.6rem 0"></div>
        ${r.ingredients.length?`<div class="rsl">Ingredients</div><div class="ing-pills" id="rig-${r.id}">${recPillsHTML(r)}</div>`:''}
        <div class="iar" style="margin-top:0.5rem;margin-bottom:0.5rem">
          <input type="text" id="ria-${r.id}" placeholder="add ingredient..." onkeydown="if(event.key==='Enter')addIR('${r.id}')">
          <button class="btn sm" id="riadd-${r.id}" onclick="addIR('${r.id}')">+ Add</button>
        </div>
        <div style="height:0.5px;background:var(--border);margin:0.25rem 0 0.5rem"></div>
        <div class="rsl">Method</div>
        <div id="md-${r.id}">${hM?`<div class="method-area"><div class="mt" onclick="sEM('${r.id}')" title="click to edit">${esc(r.method)}</div></div>`:`<div class="mp" onclick="sEM('${r.id}')">+ add method...</div>`}</div>
        <div id="me-${r.id}" style="display:none">
          <textarea class="ita" id="mi-${r.id}" style="font-size:16px;padding:8px 10px;border:0.5px solid var(--border-med);border-radius:7px;background:var(--surface2);color:var(--text);font-family:inherit;resize:vertical;line-height:1.5;min-height:50px;width:100%;outline:none" rows="6" onblur="svM('${r.id}')" onkeydown="if(event.key==='Escape')cEM('${r.id}')">${esc(r.method||'')}</textarea>
        </div>
        <div style="height:0.5px;background:var(--border);margin:0.5rem 0"></div>
        <div class="rsl">Tags</div>
        <div class="tag-row">${TAGS.map(t=>tagHTML(t.id,rtags.includes(t.id),`togRecTag('${r.id}','${t.id}')`)).join('')}</div>
        <div style="display:flex;gap:8px;margin-top:0.75rem;padding-top:0.6rem;border-top:0.5px solid var(--border);flex-wrap:wrap">
          <button class="btn sm ${r.pinned?'pinon':'gh'}" onclick="togPin('${r.id}')">${r.pinned?'&#128204; unpin':'&#128204; pin'}</button>
          <button class="btn sm gh d" style="margin-left:auto" onclick="delRec('${r.id}')">&#128465; delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
  h+=howToHTML();
  c.innerHTML=h;
}

if(syncMaster())localStorage.setItem('mplv9',JSON.stringify(S)); // derived entries only: stored locally, not an "unsaved change"
updateSyncBtn();
rMenu();
</script>
</body>
