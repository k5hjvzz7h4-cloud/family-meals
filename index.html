function amtName(v){const g=amtIng();if(g)g.name=v;}
function amtSlide(v){const g=amtIng();if(!g)return;setIngAmt(g,SLIDER_STEPS[+v]);const l=document.getElementById('amt-lab');if(l)l.textContent=amtText(ingAmt(g));}
function amtCup(v){
  const g=amtIng(),c=amtCtx;if(!g)return;const on=v==='1';
  setCupboard(g.name,on);
  if(c.kind==='meal'){if(on){g.cup=true;g.check=true;g.checked=false;g.done=false;}else{g.check=false;g.checked=false;delete g.cup;}}
  amtCommitKeep();
}
function amtStatus(s){
  const g=amtIng();if(!g)return;if(!g.loc)g.cup=true;
  if(s==='check'){g.check=true;g.checked=false;g.done=false;}
  else if(s==='have'){g.check=true;g.checked=true;g.done=false;}
  else{g.check=false;g.checked=false;g.done=false;g.cleared=false;delete g.loc;}
  amtCommitKeep();
}
function amtAisle(id){const g=amtIng();if(!g)return;const e=ensureMaster(g.name);if(e)e.tag=(e.tag===id)?null:id;amtCommitKeep();}
// apply a change but keep the window open
function amtCommitKeep(){const c=amtCtx,g=amtIng();if(!c||!g)return;g.name=String(g.name||'').trim()||c.orig;save();if(c.kind==='rec')rRecKeepOpen();else render();renderAmt();}
function amtRemove(){
  const c=amtCtx;if(!c||!amtIng())return;
  if(c.kind==='rec'){remRI(c.a,c.b);const r=S.recipes.find(x=>x.id===c.a);if(r)rRecKeepOpen();}
  else if(c.kind==='meal')remI(c.a,c.b);
  amtCtx=null;renderAmt();
}

// ── SHOPPING LIST ──
function buildShopItems(){
  const map={};
  // Near-identical names (potato / potatoes) are collected into one line
  const simKey=n=>{const w=ingWords(n,true).sort().join(' ');return w||n.trim().toLowerCase();};
  function add(key,display,src,mealName,use,qty){
    key=simKey(display);
    if(!map[key])map[key]={display,count:0,sources:[],meals:new Set(),units:0};
    const it=map[key];
    if(display.length<it.display.length||(display.length===it.display.length&&display<it.display))it.display=display;
    it.count++;it.sources.push(src);
    it.units+=useUnits(use,qty);
    if(mealName)it.meals.add(mealName);
  }
  S.meals.forEach(m=>{if(m.status==='later')return;m.ingredients.forEach((ing,j)=>{if(ing.cleared||ing.check||ing.loc)return;add(ing.name.trim().toLowerCase(),ing.name.trim(),{type:'meal',id:m.id,j},m.meal&&m.meal.trim()?m.meal.trim():null,ing.use,ing.qty);});});
  S.extras.forEach((e,i)=>add(e.name.trim().toLowerCase(),e.name.trim(),{type:'extra',i},null,e.use,e.qty));
  Object.values(map).forEach(item=>{
    // Whole packs to buy: total amount used (whole=1, 2/3, 1/2, 1/3, a little=0.1) rounded up.
    item.packs=Math.ceil(item.units/30);
    if(item.packs<1)item.packs=1;
    item.auto=item.packs;
    // manual +/- from the edit row is kept as an adjustment on top of the calculated packs
    item.packs=Math.max(1,item.auto+((S.shopQty||{})[item.display.toLowerCase()]||0));
    item.done=item.sources.every(s=>{
      if(s.type==='meal'){const m=mById(s.id);return m&&m.ingredients[s.j]?m.ingredients[s.j].done:true;}
      return S.extras[s.i].done;
    });
    item.meals=Array.from(item.meals);
  });
  return Object.values(map);
}


// ── Shopping mode ──
const AISLE_COL={fruit:'var(--day1)',veg:'var(--day4)',meat:'var(--day0)',dairy:'var(--day5)',deli:'var(--day2)',chilled:'var(--day7)',bread:'var(--day3)',snacks:'var(--day6)',cereal:'var(--day2)',baking:'var(--day0)',ingredients:'var(--day3)',drinks:'var(--day7)',tea:'var(--day1)',household:'var(--day5)',health:'var(--day4)',baby:'var(--day6)',frozen:'var(--day7)'};
let shopModeOn=false,shopWake=null,shopClosed=new Set(),shopCols=2;
try{shopCols=localStorage.getItem('mpl_shopcols')==='1'?1:2;}catch(e){}
async function wakeOn(){try{if('wakeLock' in navigator){shopWake=await navigator.wakeLock.request('screen');shopWake.addEventListener('release',()=>{shopWake=null;});}}catch(e){}}
function wakeOff(){try{if(shopWake)shopWake.release();}catch(e){}shopWake=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&shopModeOn&&!shopWake)wakeOn();});
function openShopMode(){shopModeOn=true;document.body.style.overflow='hidden';renderShopMode();wakeOn();}
function closeShopMode(){shopModeOn=false;document.body.style.overflow='';wakeOff();renderShopMode();rShop();}
function shopTap(key){togShopItem(key);renderShopMode(true);}
function shopCol(n){shopCols=n;try{localStorage.setItem('mpl_shopcols',String(n));}catch(e){}renderShopMode(true);}
function shopFold(id){if(shopClosed.has(id))shopClosed.delete(id);else shopClosed.add(id);renderShopMode(true);}
function shopDone(){closeShopMode();}   // back to the list with everything still ticked, so you can check it over and press Clear done yourself
function smRow(it,col){
  const key=it.display.toLowerCase();
  return`<div class="sm-r${it.done?' d':''}" style="--k:${col}" data-k="${esc(key)}" onclick="shopTap(this.dataset.k)"><div class="sm-bx">${it.done?'&#10003;':''}</div><span class="sm-nm">${esc(it.display)}</span>${it.packs>1?`<span class="sm-q">${it.packs}</span>`:''}</div>`;
}
function renderShopMode(keepScroll){
  let el=document.getElementById('shop-mode');
  if(!shopModeOn){if(el)el.remove();return;}
  const prev=el?el.scrollTop:0;
  const items=buildShopItems().sort((a,b)=>a.display.localeCompare(b.display));
  const list=aisleList();
  const groups=list.map(a=>({id:a.id,label:a.label,col:AISLE_COL[a.id]||'var(--day5)',rows:[]}));
  const other={id:'other',label:'Other',col:'var(--text3)',rows:[]};
  items.forEach(it=>{const m=masterFor(it.display);const gi=m&&m.tag?list.findIndex(a=>a.id===m.tag):-1;(gi>=0?groups[gi]:other).rows.push(it);});
  const left=items.filter(i=>!i.done).length,tr=items.filter(i=>i.done);
  let h=`<div class="sm-top"><button class="btn sm gh" onclick="closeShopMode()" aria-label="back" style="min-height:34px">&#8592; Back</button><h2>Shopping</h2><span class="sm-n">${left} to get</span><div class="sm-seg"><button class="${shopCols===1?'on':''}" onclick="shopCol(1)">1</button><button class="${shopCols===2?'on':''}" onclick="shopCol(2)">2</button></div></div>`;
  const nchk=checkGroups().length;
  if(nchk)h+=`<div class="sm-chk" onclick="openCheckMode()">${nchk} still to check at home<b>Check now &#8594;</b></div>`;
  if(!items.length)h+=`<div class="sm-msg">Nothing left on the list.<br><br><button class="btn pri" onclick="closeShopMode()">Close</button></div>`;
  else{
    [...groups,other].forEach(g=>{
      const li=g.rows.filter(r=>!r.done);if(!li.length)return;
      const cl=shopClosed.has(g.id);
      h+=`<div class="sm-sec" style="--k:${g.col};--kt:${(g.id==='bread'||g.id==='ingredients')?'#2b2200':'#fff'}"><div class="sm-ah${cl?' cl':''}" onclick="shopFold('${g.id}')"><span class="bar"></span><b>${esc(g.label)}</b><span class="c">${li.length}</span><span class="ar">&#9660;</span></div>${cl?'':`<div class="sm-g c${shopCols}">${li.map(r=>smRow(r,g.col)).join('')}</div>`}</div>`;
    });
    if(!left)h+=`<div class="sm-msg" style="padding:28px 20px 6px">Everything's ticked off.</div>`;
    if(tr.length)h+=`<div class="sm-tr"><div class="sm-ah"><b style="color:var(--text2)">In trolley</b><span class="c" style="background:var(--text3)">${tr.length}</span></div><div class="sm-g c${shopCols}">${tr.map(r=>smRow(r,'var(--text3)')).join('')}</div></div><button class="sm-done" onclick="shopDone()">Done shopping</button>`;
  }
  if(!el){el=document.createElement('div');el.id='shop-mode';document.body.appendChild(el);}
  el.innerHTML=h;
  if(keepScroll)el.scrollTop=prev;
}

function checkGroups(){
  const map=new Map();
  S.meals.forEach(m=>{
    if(m.status==='later')return;
    m.ingredients.forEach((ing,j)=>{
      if(!ing.check||ing.checked)return;
      const key=ing.name.trim().toLowerCase();let o=map.get(key);
      if(!o){o={key,name:ing.name.trim(),refs:[],meals:new Set(),amt:0,locs:new Set()};map.set(key,o);}
      o.refs.push({id:m.id,j});o.amt+=ingAmt(ing);if(ing.loc)o.locs.add(LOC_LABEL[ing.loc]||ing.loc);
      if(m.meal&&m.meal.trim())o.meals.add(m.meal.trim());
    });
  });
  return[...map.values()];
}

}
let chkOn=false,chkQ=[],chkI=0,chkHist=[],chkTally={have:0,need:0};
function openCheckMode(){chkQ=checkGroups().map(g=>g.key);chkI=0;chkHist=[];chkTally={have:0,need:0};chkOn=true;document.body.style.overflow='hidden';renderCheckMode();}
function closeCheckMode(){chkOn=false;document.body.style.overflow=shopModeOn?'hidden':'';renderCheckMode();rShop();if(ctab()==='menu')rMenu();if(shopModeOn)renderShopMode(true);}
function chkCur(){const gs=checkGroups();while(chkI<chkQ.length){const g=gs.find(x=>x.key===chkQ[chkI]);if(g)return g;chkI++;}return null;}
function chkDecide(kind){
  const g=chkCur();if(!g)return;
  const prev=g.refs.map(r=>{const ing=mById(r.id).ingredients[r.j];return{id:r.id,j:r.j,check:!!ing.check,checked:!!ing.checked,done:!!ing.done,cup:!!ing.cup,loc:ing.loc};});
  g.refs.forEach(r=>{const ing=mById(r.id).ingredients[r.j];if(!ing.loc)ing.cup=true;if(kind==='have'){ing.check=true;ing.checked=true;}else{ing.check=false;ing.checked=false;ing.done=false;ing.cleared=false;delete ing.loc;}});

}
function chkSkip(){if(!chkCur())return;chkHist.push({i:chkI,kind:'skip',prev:[]});chkI++;renderCheckMode();}
function chkBack(){
  const h=chkHist.pop();if(!h)return;
  h.prev.forEach(p=>{const m=mById(p.id),ing=m&&m.ingredients[p.j];if(ing){ing.check=p.check;ing.checked=p.checked;ing.done=p.done;if(p.loc)ing.loc=p.loc;if(!p.cup)delete ing.cup;}});

// ── Ingredient matching: ignore quantities/units/plurals; "onion" matches "2 red onions" ──
const ING_NOISE=new Set(['g','kg','mg','ml','l','cl','dl','oz','lb','lbs','tbsp','tsp','tbs','cup','pack','packet','tin','can','jar','bottle','bunch','handful','pinch','slice','clove','of','a','an','the','fresh','chopped','diced','sliced','large','small','medium','grated','minced','frozen','dried','ground','x']);
function singular(w){
  if(w.length>3&&w.endsWith('ies'))return w.slice(0,-3)+'y';
  if(w.length>4&&w.endsWith('oes'))return w.slice(0,-2);
  if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')&&!w.endsWith('us')&&!w.endsWith('is'))return w.slice(0,-1);
  return w;
}
const KEEP_DESC=new Set(['frozen','dried','ground']); // change which aisle something is in
function ingWords(s,keepDesc,noSing){
  return String(s||'').toLowerCase()
    .replace(/\([^)]*\)/g,' ')
    .replace(/[¼-¾⅐-⅞]/g,' ')
    .replace(/[0-9]+([.\/][0-9]+)?/g,' ')
    .replace(/[^a-zÀ-ɏ\s-]/g,' ')
    .split(/[\s-]+/).filter(w=>w&&(!ING_NOISE.has(w)||(keepDesc&&KEEP_DESC.has(w)))).map(w=>noSing?w:singular(w));
}
// Words that don't make a different item: "red onion" can use up an "onion", but "spring onion" can't
// (anything else extra, like spring, sweet, cherry or black, makes it a different thing). Editable under Regulars > Items we buy.
const VARIETY_DEF=['red','white','brown','yellow','purple','golden','baby','new','organic','ripe'];
function varietySet(){return new Set((Array.isArray(S.varieties)?S.varieties:VARIETY_DEF).map(w=>singular(String(w).toLowerCase())));}
// True when `have` (a list of words) can stand in for `need`: every word of `have` is in `need`, and anything extra in `need` is only a variety word
function wordsCover(have,need){
  if(!have.length||!need.length)return false;
  if(!have.every(x=>need.includes(x)))return false;
  const v=varietySet();
  return need.every(x=>have.includes(x)||v.has(x));
}
// True when the shorter ingredient can stand in for the longer one (see wordsCover)
function ingMatch(a,b){
  if(!a.length||!b.length)return false;
  const [s,l]=a.length<=b.length?[a,b]:[b,a];
  return wordsCover(s,l);
}

// ── Leftovers: how much of the last pack is unused once every meal on the menu is made ──
// Total use is added up in 30ths of a pack and rounded up to whole packs; what's left of the last
// pack is the leftover. Meal ingredients that were ticked/cleared still count (you've bought them);
// finished meals do not.
function leftLabel(left){
  if(left<=8)return'a little left';
  if(left<=17)return'about half a pack left';
  return'plenty left';
}
function getLeftovers(){
  const map={};
  function add(name,use,src,done,qty){
    const key=name.trim().toLowerCase();if(!key||isCupboard(name))return;
    if(!map[key])map[key]={display:name.trim(),units:0,from:new Set(),pending:0};
    map[key].units+=useUnits(use,qty);
    if(!done)map[key].pending++;
    if(src)map[key].from.add(src);
  }
  S.meals.forEach(m=>{if(m.status==='later')return;m.ingredients.forEach(ing=>{if(!ing.check&&!ing.loc)add(ing.name,ing.use,m.meal&&m.meal.trim()?m.meal.trim():null,ing.done||ing.cleared,ing.qty);});});
  S.extras.forEach(e=>add(e.name,e.use,'shopping list',e.done,e.qty));
  const moved=new Set((S.components||[]).filter(c=>c.src==='leftover').map(c=>ingWords(c.name).join(' ')));
  const all=[];
  Object.values(map).forEach(o=>{
    const k=ingWords(o.display).join(' ');
    if(moved.has(k))return;               // already tracked as an in-stock item
    const rem=o.units%30;
    if(!rem)return;                       // packs are fully used
    const left=30-rem;
    if(left<3)return;
    all.push({display:o.display,key:k,left,label:leftLabel(left),words:ingWords(o.display),from:Array.from(o.from),allDone:o.pending===0});
  });
  // Dismissed leftovers stay hidden only while the meals that cause them are still on the menu
  if(!S.leftDismissed)S.leftDismissed=[];
  const present=new Set(all.map(l=>l.key));
  S.leftDismissed=S.leftDismissed.filter(k=>present.has(k));
  const gone=new Set(S.leftDismissed);
  return all.filter(l=>!gone.has(l.key)).sort((a,b)=>a.display.localeCompare(b.display));
}
// Once every part of a partly used pack has been ticked off, the remainder goes to the in-stock list by itself
let autoMoving=false;
function autoMoveLeftovers(){
  if(autoMoving)return;autoMoving=true;
  try{
    if(!Array.isArray(S.components))S.components=[];
    getLeftovers().forEach(l=>{
      if(!l.allDone)return;
      const use=l.left>=18?'whole':(l.left>=9?'half':'little');
      const c=S.components.find(x=>ingWords(x.name).join(' ')===l.key);
      if(c){c.use=use;c.src='leftover';}else S.components.push({name:l.display,use,qty:1,src:'leftover'});
    });
  }catch(e){}
  autoMoving=false;
}

// Every recipe not already on the menu that uses at least two ingredients you already have: leftovers,
// "useful meal components" or freezer ingredients. Ranked: recipes that use up the most leftovers first (a "half" that
// finishes a half-pack counts most), then by how many ingredients match.
function recSuggestions(shopItems){
  if(!S.recipes||!S.recipes.length)return[];
  const shopWords=shopItems.filter(i=>!i.done&&!isCupboard(i.display)).map(i=>ingWords(i.display));
  const leftovers=getLeftovers();
  const comps=(S.components||[]).concat((S.freezer||[]).filter(f=>f.kind==='ingredient')).map(c=>ingWords(c.name)).filter(w=>w.length);
  const onMenu=new Set(S.meals.filter(m=>m.meal).map(m=>m.meal.trim().toLowerCase()));
  return S.recipes
    .filter(r=>!onMenu.has(r.name.trim().toLowerCase()))
    .map(r=>{
      const ings=(r.ingredients||[]).map(normIng).filter(x=>x&&x.name&&!isCupboard(x.name));
      if(!ings.length)return null;
      const matchedNames=[],partial=[],haveComps=[];
      ings.forEach(ing=>{
        const w=ingWords(ing.name);
        const lo=leftovers.find(l=>wordsCover(l.words,w)); // recipe must be at least as specific as the leftover ("cheese" doesn't use up cream cheese)
        if(lo){
          const u=useUnits(ing.use,ing.qty);
          partial.push({name:ing.name,pairs:u<=lo.left&&lo.left-u<=3});  // fits and (almost) finishes the pack
          matchedNames.push(ing.name);
        }else if(comps.some(cw=>wordsCover(cw,w))){
          haveComps.push(ing.name);   // a cupboard component you already have in
          matchedNames.push(ing.name);
        }else if(shopWords.some(sw=>ingMatch(w,sw))){
          matchedNames.push(ing.name);
        }
      });
      const matched=matchedNames.length;
      const score=matched+partial.reduce((n,p)=>n+(p.pairs?3:2),0)+haveComps.length*2;
      return{r,matched,missing:ings.length-matched,total:ings.length,matchedNames,partial,haveComps,score};
    })
    .filter(x=>x&&(x.partial.length+x.haveComps.length)>=2)   // needs at least two ingredients you already have (leftovers, components, freezer ingredients); the shopping list doesn't count
    .sort((a,b)=>b.score-a.score||a.missing-b.missing||a.r.name.localeCompare(b.r.name));
}

// ── FREEZER ── freeform list of ready-to-defrost meals, offered from the recipe picker on Menu
// Freezer / In stock share one card, switched with tabs
let fzTab=(function(){try{return localStorage.getItem('mpl_fztab')==='components'?'components':'freezer';}catch(e){return'freezer';}})();
function setFzTab(t){fzTab=t;try{localStorage.setItem('mpl_fztab',t);}catch(e){}render();}
function addComponent(){
  const i=document.getElementById('cmp-in');
  const v=i.value.trim();if(!v)return;
  if(!S.components.some(c=>c.name.toLowerCase()===v.toLowerCase()))S.components.push({name:v,use:'whole',qty:1});
  i.value='';save();render();
  flashAdded(document.getElementById('cmp-add'));
  refocus('cmp-in');
}
function remComponent(idx){
  const c=S.components[idx];
  // a leftover that was moved here and is then removed shouldn't pop back into Leftovers
  if(c&&c.src==='leftover'){if(!S.leftDismissed)S.leftDismissed=[];const k=ingWords(c.name).join(' ');if(!S.leftDismissed.includes(k))S.leftDismissed.push(k);}
  S.components.splice(idx,1);save();render();
}
function cycComponent(idx){if(S.components[idx])S.components[idx].use=nextUse(S.components[idx].use);save();render();}
function cycFreezer(idx){if(S.freezer[idx])S.freezer[idx].use=nextUse(S.freezer[idx].use);save();render();}
function togFzKind(idx){const f=S.freezer[idx];if(!f)return;f.kind=f.kind==='meal'?'ingredient':'meal';save();render();}
function adjQty(list,idx,d){const it=S[list][idx];if(!it)return;it.qty=Math.max(1,(it.qty||1)+d);save();render();}
function amtBtn(use,fn,idx){const u=canonUse(use);return`<button class="ing-pill-use ${u}" onclick="${fn}(${idx})" aria-label="amount: ${USE_LABEL[u]}. Tap to change">${USE_LABEL[u]}</button>`;}
function qtyHTML(list,idx,q){return`<span class="qty"><button onclick="adjQty('${list}',${idx},-1)" aria-label="fewer">&#8722;</button><b>${q||1}</b><button onclick="adjQty('${list}',${idx},1)" aria-label="more">+</button></span>`;}
function fzCardHTML(){
  const open=!!openBox.fz;
  const tab=(id,label)=>`<button class="btn sm ${fzTab===id?'pri':'gh'}" style="flex:1" onclick="setFzTab('${id}')">${label}</button>`;
  let body='';
  if(open){
    if(fzTab==='freezer'){
      body=`<p style="font-size:12px;color:var(--text2);margin:0 0 0.6rem">Tag each item. <b>Meal</b>: offered as an option when building the menu. <b>Ingredient</b>: counted when suggesting recipes, and used up when a recipe needs it. Tap an item's tag or amount to change it.</p>
      ${S.freezer.length?`<div>${S.freezer.map((f,j)=>`<div class="cmp-row"><span class="cmp-name">${esc(f.name)}</span><button class="reg-del-btn" onclick="remFreezer(${j})" aria-label="remove">&#10005;</button><div class="cmp-ctl"><button class="ing-pill-use ${f.kind==='meal'?'tagged':''}" onclick="togFzKind(${j})">${f.kind==='meal'?'meal':'ingredient'}</button>${amtBtn(f.use,'cycFreezer',j)}${qtyHTML('freezer',j,f.qty)}</div></div>`).join('')}</div>`:'<p class="es">Nothing in the freezer yet.</p>'}
      <div style="display:flex;gap:6px;margin-top:0.6rem"><button class="btn sm ${fzNewKind==='meal'?'pri':'gh'}" style="flex:1" onclick="setFzNewKind('meal')">A meal</button><button class="btn sm ${fzNewKind==='ingredient'?'pri':'gh'}" style="flex:1" onclick="setFzNewKind('ingredient')">An ingredient</button></div>
      <div class="iar" style="margin-top:0.4rem">
        <input type="text" id="fz-in" placeholder="${fzNewKind==='meal'?'e.g. leftover bolognese':'e.g. frozen peas'}" onkeydown="if(event.key==='Enter')addFreezer()">
        <button class="btn sm" id="fz-add" onclick="addFreezer()">+ Add</button>
      </div>`;
    }else{
      body=`<p style="font-size:12px;color:var(--text2);margin:0 0 0.6rem">Things you have in (naan, tinned tomatoes&#8230;). They're used when suggesting recipes, and used up when a recipe that needs them goes on the menu. Tap the amount to change it.</p>
      ${S.components.length?`<div>${S.components.map((n,j)=>`<div class="cmp-row"><span class="cmp-name">${esc(n.name)}</span><button class="reg-del-btn" onclick="remComponent(${j})" aria-label="remove">&#10005;</button><div class="cmp-ctl">${amtBtn(n.use,'cycComponent',j)}${qtyHTML('components',j,n.qty)}</div></div>`).join('')}</div>`:'<p class="es">Nothing added yet.</p>'}
      <div class="iar" style="margin-top:0.5rem">
        <input type="text" id="cmp-in" placeholder="e.g. naan, tinned tomatoes" onkeydown="if(event.key==='Enter')addComponent()">
        <button class="btn sm" id="cmp-add" onclick="addComponent()">+ Add</button>
      </div>`;
    }
    body=`<div style="margin-top:0.7rem"><div style="display:flex;gap:6px;margin-bottom:0.7rem">${tab('freezer','&#129482; Freezer'+(S.freezer.length?' ('+S.freezer.length+')':''))}${tab('components','In stock'+(S.components.length?' ('+S.components.length+')':''))}</div>${body}</div>`;
  }
  return`<div class="card solid-box">
    <div class="box-head" onclick="togBox('fz')"><span class="box-arrow">${boxArrow('fz')}</span><h2>&#129482; Freezer &amp; in stock</h2><span class="box-n">${S.freezer.length+S.components.length||''}</span></div>
    ${body}
  </div>`;
}
let fzNewKind='meal';
function setFzNewKind(k){fzNewKind=k;const i=document.getElementById('fz-in');const v=i?i.value:'';render();const n=document.getElementById('fz-in');if(n){n.value=v;n.focus();}}
function addFreezer(){
  const i=document.getElementById('fz-in');
  const v=i.value.trim();if(!v)return;
  S.freezer.push({name:v,use:'whole',qty:1,kind:fzNewKind});i.value='';save();render();
  flashAdded(document.getElementById('fz-add'));
  refocus('fz-in');
}
function remFreezer(idx){S.freezer.splice(idx,1);save();render();}
function rReg(){
  const c=document.getElementById('tab-regulars');
  const regBox=(key,label)=>{
    const list=S.regulars[key]||[];
    const id='reg-'+key,open=!!openBox[id];
    return`<div class="card">
      <div class="box-head" onclick="togBox('${id}')"><span class="box-arrow">${boxArrow(id)}</span><h2>${label}</h2><span class="box-n">${list.length||''}</span>${open&&list.length?`<button class="btn sm amb" id="addall-${key}" onclick="event.stopPropagation();addAllReg('${key}')">+ add all</button>`:''}</div>
      ${open?`<div style="margin-top:0.6rem">${list.length?`<div>${list.map((n,j)=>regRow(key,j,n)).join('')}</div>`:'<p class="es">Nothing added yet.</p>'}
      <div class="iar" style="margin-top:0.5rem">
        <input type="text" id="reg-in-${key}" placeholder="add item..." onkeydown="if(event.key==='Enter')addReg('${key}')">
        <button class="btn sm" id="regadd-${key}" onclick="addReg('${key}')">+ Add</button>
      </div></div>`:''}
    </div>`;
  };
  c.innerHTML=secOrder('regulars').filter(id=>!secHidden(id)).map(id=>regBox(id,secName(id))).join('')+layoutBtnsHTML('regulars')+masterCardHTML();
}
function getSorted(){
  const fn={az:(a,b)=>a.name.localeCompare(b.name),za:(a,b)=>b.name.localeCompare(a.name),newest:(a,b)=>(b.id||'').localeCompare(a.id||''),oldest:(a,b)=>(a.id||'').localeCompare(b.id||'')}[S.recipeSort||'az'];
  return[...S.recipes.filter(r=>r.pinned).sort(fn),...S.recipes.filter(r=>!r.pinned).sort(fn)];
}
function togRec(id){
  const body=document.getElementById('rb-'+id);
  const arr=document.getElementById('ra-'+id);
  if(!body)return;
  const open=body.style.display==='block';
  body.style.display=open?'none':'block';
  arr.textContent=open?'▶':'▼';
}
function howToHTML(){
  return`<div class="util-card" style="margin-top:1.6rem">
    <div class="util-head" style="cursor:default"><span>How to use</span></div>
    <p class="util-note" style="font-size:12px"><b>Cupboard items.</b> Tap an ingredient and choose Cupboard item (it turns grey). That marks it as a cupboard item (herbs, spices, sauces). When the recipe goes on the menu it shows as &#8220;to check&#8221; instead of going on the shopping list, and it applies to that ingredient in every recipe.</p>
    <p class="util-note" style="font-size:12px"><b>How much of a pack.</b> Each ingredient pill fills up to show how much of a pack the recipe uses: <b>full</b> is a whole pack, <b>half full</b> is half, and a <b>sliver</b> is a little (counted as a tenth). A number in front, like 3, means how many. Tap a pill to change either, then the shopping list adds it all up and rounds to whole packs.</p>
    <p class="util-note" style="font-size:12px"><b>Leftovers.</b> Whatever is left of a pack after the meals on your menu shows under Leftovers on the Menu tab, and recipes that would use it up are suggested.</p>
  </div>`;
}
function rRec(){
  const c=document.getElementById('tab-recipes');
  let h=`<button class="btn pri" style="width:100%;margin-bottom:${S.recipes.length?'1.1rem':'0.75rem'}" onclick="openAddRecipe()">+ Add a recipe</button>`;
  if(!S.recipes.length){h+='<p class="es">No recipes saved yet.</p>'+howToHTML();c.innerHTML=h;return;}
  // Tag filter bar — only show tags that exist on at least one recipe
  const usedTags=TAGS.filter(t=>S.recipes.some(r=>r.tags&&r.tags.includes(t.id)));
  if(usedTags.length){
    h+=`<div class="tag-row" style="margin-bottom:0.75rem">
      ${usedTags.map(t=>tagHTML(t.id,activeTagFilters.has(t.id),`setTagFilter('${t.id}')`)).join('')}
      ${activeTagFilters.size?`<span class="tag off" onclick="clearTagFilters()" style="color:var(--text3)">✕ clear</span>`:''}
    </div>`;
  }
  const filtered=activeTagFilters.size?getSorted().filter(r=>r.tags&&[...activeTagFilters].every(t=>r.tags.includes(t))):getSorted();
  h+=`<div class="sb"><span>${filtered.length} recipe${filtered.length!==1?'s':''}</span><button class="sort-btn" onclick="cycSort()">&#8645; ${sortLbl()}</button></div>`;
  h+=filtered.map(r=>{
    const hM=r.method&&r.method.trim();
    const rtags=(r.tags||[]);
    return`<div class="rc${r.pinned?' pn':''}">
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="togRec('${r.id}')" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);padding:4px;flex-shrink:0;min-width:28px;min-height:44px;display:flex;align-items:center;justify-content:center" id="ra-${r.id}">&#9654;</button>
        ${r.pinned?'<span style="color:var(--amber-text);font-size:13px;flex-shrink:0">&#128204;</span>':''}
        <div style="flex:1;min-width:0" onclick="togRec('${r.id}')">
          <div class="rn">${esc(r.name)}</div>
          ${rtags.length?`<div style="font-size:13px;margin-top:2px">${rtags.map(tid=>{const t=TAGS.find(x=>x.id===tid);return t?t.label.split(' ')[0]:'';}).join(' ')}</div>`:''}
        </div>
        <button class="btn sm pri" id="shop-${r.id}" onclick="openCalForRecipe('${r.id}')" aria-label="put ${esc(r.name)} on the menu" style="min-width:44px;font-size:20px;font-weight:700;line-height:1;padding:6px 14px">+</button>
      </div>
      <div id="rb-${r.id}" style="display:none">
        <div style="height:0.5px;background:var(--border);margin:0.6rem 0"></div>
        ${r.ingredients.length?`<div class="rsl">Ingredients</div><div class="ing-pills" id="rig-${r.id}">${recPillsHTML(r)}</div>`:''}
        <div class="iar" style="margin-top:0.5rem;margin-bottom:0.5rem">
          <input type="text" id="ria-${r.id}" placeholder="add ingredient..." onkeydown="if(event.key==='Enter')addIR('${r.id}')">
          <button class="btn sm" id="riadd-${r.id}" onclick="addIR('${r.id}')">+ Add</button>
        </div>
        <div style="height:0.5px;background:var(--border);margin:0.25rem 0 0.5rem"></div>
        <div class="rsl">Method</div>
        <div id="md-${r.id}">${hM?`<div class="method-area"><div class="mt" onclick="sEM('${r.id}')" title="click to edit">${esc(r.method)}</div></div>`:`<div class="mp" onclick="sEM('${r.id}')">+ add method...</div>`}</div>
        <div id="me-${r.id}" style="display:none">
          <textarea class="ita" id="mi-${r.id}" style="font-size:16px;padding:8px 10px;border:0.5px solid var(--border-med);border-radius:7px;background:var(--surface2);color:var(--text);font-family:inherit;resize:vertical;line-height:1.5;min-height:50px;width:100%;outline:none" rows="6" onblur="svM('${r.id}')" onkeydown="if(event.key==='Escape')cEM('${r.id}')">${esc(r.method||'')}</textarea>
        </div>
        <div style="height:0.5px;background:var(--border);margin:0.5rem 0"></div>
        <div class="rsl">Tags</div>
        ${tagsRowHTML(rtags,'rec',r.id)}
        <div style="display:flex;gap:8px;margin-top:0.75rem;padding-top:0.6rem;border-top:0.5px solid var(--border);flex-wrap:wrap">
          <button class="btn sm ${r.pinned?'pinon':'gh'}" onclick="togPin('${r.id}')">${r.pinned?'&#128204; unpin':'&#128204; pin'}</button>
          <button class="btn sm gh d" style="margin-left:auto" onclick="delRec('${r.id}')">&#128465; delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
  h+=howToHTML();
  c.innerHTML=h;
}

if(syncMaster())localStorage.setItem('mplv9',JSON.stringify(S)); // derived entries only: stored locally, not an "unsaved change"
try{rollStats();}catch(e){}
localStorage.setItem('mplv9',JSON.stringify(S));   // (rolling up old stats is housekeeping, not an unsaved change)
undoInit();
updateSyncBtn();
rMenu();
// Offline use: needs sw.js and manifest.webmanifest next to this file, on a web address (https or localhost)
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
// Title turns orange (with a dot) while the device is offline
function netState(){const off=navigator.onLine===false;document.documentElement.classList.toggle('offline',off);const t=document.getElementById('app-title');if(t)t.title=off?'Offline: changes are saved on this device':'';}
window.addEventListener('online',netState);window.addEventListener('offline',netState);netState();
</script>
</body>
</html>
