  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f8f8;--surface:#ffffff;--surface2:#ecf4f4;--surface3:#dceeed;
  --border:rgba(0,0,0,0.07);--border-med:rgba(0,0,0,0.13);
  --text:#1e2e2c;--text2:#4e6e6a;--text3:#8aadaa;
  --acc:#2a8a80;--acc-light:#e6f5f4;--acc-border:#8acfca;
  --blue-bg:#e8f4f8;--blue-border:#80c4d8;--blue-text:#0e5a70;
  --green-bg:#e6f5ee;--green-border:#7acca0;--green-text:#1a5e3a;--green-acc:#2a8a60;
  --amber-bg:#fdf6e0;--amber-border:#d8b840;--amber-text:#6a4a08;
  --red-bg:#fdf0ee;--red-border:#e8b0a8;--red-text:#b03020;
  --r:14px;--rl:16px;
  --shadow:0 1px 3px rgba(0,0,0,0.07),0 4px 12px rgba(0,0,0,0.05);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05),0 2px 6px rgba(0,0,0,0.04);
  --day0:#c656a6;--day1:#db4241;--day2:#ec7c0e;--day3:#e8b616;
  --day4:#20a04e;--day5:#337bd0;--day6:#6d47b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 6rem;-webkit-text-size-adjust:100%}
.app{max-width:680px;margin:0 auto}
h2{font-size:15px;font-weight:600;margin-bottom:0.75rem;color:var(--text)}
/* Header */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:1.25rem 1rem 0;margin-bottom:0;position:sticky;top:0;z-index:10}
.app-header h1{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;color:var(--text);letter-spacing:-0.01em;margin-bottom:0.875rem}
.app-header h1 span{color:var(--acc)}
/* Tabs */
.tabs{display:flex;border-bottom:none;margin-bottom:0}
.tab{flex:1;padding:10px 4px 12px;font-size:11.5px;font-weight:500;background:transparent;border:none;cursor:pointer;color:var(--text3);font-family:inherit;transition:color .15s;line-height:1.2;min-height:44px;position:relative}
.tab.active{color:var(--acc);font-weight:600}
.tab.active::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:2.5px;background:var(--acc);border-radius:2px 2px 0 0}
.section{display:none;padding:1rem 1rem 0}.section.active{display:block}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem;margin-bottom:0.75rem;box-shadow:var(--shadow-sm)}
.add-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem;margin-bottom:1.25rem;box-shadow:var(--shadow-sm)}
.field{margin-bottom:0.75rem}
.fl{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:0.06em}
/* Inputs */
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none;transition:border-color .15s,background .15s;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc);background:var(--surface)}
input[type=date]{color-scheme:light;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin-left:0}
input[type=date]::-webkit-datetime-edit{text-align:left}
input[type=date]::-webkit-datetime-edit-fields-wrapper{text-align:left}
textarea{resize:vertical;line-height:1.55;min-height:54px}
input::placeholder,textarea::placeholder{color:var(--text3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Buttons */
.btn{padding:10px 16px;font-size:14px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:active{opacity:0.72}
.btn.pri{border-color:var(--acc);color:#fff;background:var(--acc);font-weight:600}
.btn.pri:active{background:#a8532e}
.btn.grn{border-color:var(--green-border);color:var(--green-text);background:var(--green-bg);font-weight:500}
.btn.amb{border-color:var(--acc-border);color:var(--acc);background:var(--acc-light);font-weight:500}
.btn.sm{padding:8px 12px;font-size:13px;min-height:38px;border-radius:9px}
.btn.gh{border-color:transparent;background:transparent;color:var(--text2);padding:8px 10px;font-size:13px;min-height:38px}
.btn.gh.d{color:var(--red-text)}
.btn.do{border-color:var(--red-border);color:var(--red-text);font-size:13px;padding:8px 12px;background:var(--red-bg);min-height:38px}
.btn.pinon{border-color:var(--amber-border);color:var(--amber-text);background:var(--amber-bg)}
.abr{display:flex;justify-content:flex-end;margin-top:0.5rem;gap:8px;flex-wrap:wrap}
.iar{display:flex;gap:7px}
.iar input{flex:1;font-size:16px;padding:10px 12px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none}
.iar input:focus{border-color:var(--acc);background:var(--surface)}
.iel{list-style:none;margin-bottom:7px}
.iei{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:14px;color:var(--text2)}
.iei button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:4px 6px;line-height:1;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.iei button:active{color:var(--red-text)}
/* Upcoming */
.uc-head{display:flex;align-items:center;gap:8px;margin-bottom:0.75rem}
.uc-date-block{flex:1}
.uc-day{font-size:14px;font-weight:600;color:var(--text)}
.uc-datestr{font-size:12px;color:var(--text3);margin-top:1px}
.uc-arrows{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.arr{background:var(--surface2);border:1px solid var(--border-med);border-radius:8px;cursor:pointer;color:var(--text2);padding:6px 10px;font-size:12px;line-height:1;font-family:inherit;min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center}
.arr:active{background:var(--surface3);color:var(--text)}
.arr:disabled{opacity:0.2;cursor:default}
.btn:disabled{opacity:0.4;cursor:default}
.uc-fl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px}
.uc-meal{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none;margin-bottom:0.6rem;-webkit-appearance:none}
.uc-meal:focus{border-color:var(--acc);background:var(--surface)}
.ings{list-style:none;padding:0;margin:0.4rem 0 0}
.ing{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border)}
.ing:last-child{border-bottom:none}
.ing input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--acc);flex-shrink:0}
.ing.dn>span{text-decoration:line-through;color:var(--text3)}
.di{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px 6px;line-height:1;margin-left:auto;flex-shrink:0;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.di:active{color:var(--red-text)}
.uc-notes{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--border-med);border-radius:10px;background:var(--surface2);color:var(--text);font-family:inherit;resize:vertical;line-height:1.55;min-height:54px;outline:none;margin-top:0.5rem;-webkit-appearance:none}
.uc-notes:focus{border-color:var(--acc);background:var(--surface)}
.uc-footer{display:flex;gap:8px;margin-top:0.75rem;flex-wrap:wrap;align-items:center;padding-top:0.7rem;border-top:1px solid var(--border)}
/* Menu cards */
.menu-card{padding-left:10px}
.dow{position:relative;width:12px;height:31px;flex-shrink:0;margin-right:1px}
.dow>span{position:absolute;left:50%;top:50%;width:31px;transform:translate(-50%,-50%) rotate(-90deg);display:flex;justify-content:space-between;font-size:11px;font-weight:700;line-height:1;color:var(--dc)}
.dow i{font-style:normal}
.menu-card .day-num{font-weight:800}
.menu-card.planned .day-num{font-weight:400;opacity:0.85}
.menu-card.planned .dow{opacity:0.85}
.menu-card.later .day-num{font-weight:200;opacity:0.6}
.menu-card.later .dow{opacity:0.55}
.mtb:not(.plan):not(.unpl){background:var(--green-acc);border-color:var(--green-acc);color:#fff}

<body>
<div class="app">
  <div class="app-header">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <h1 style="margin-bottom:0"><span>Menu</span></h1>
      <button class="btn sm gh" id="sync-btn" onclick="openSyncModal()" style="min-height:36px;padding:6px 12px;flex-shrink:0">Save/Load</button>
    </div>
    <div style="height:0.9rem"></div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('menu')">Menu</button>
      <button class="tab" onclick="showTab('shopping')">Shopping</button>
      <button class="tab" onclick="showTab('recipes')">Recipes</button>
      <button class="tab" onclick="showTab('regulars')">Regulars</button>
    </div>
  </div>
  <div id="tab-menu" class="section active"></div>
  <div id="tab-shopping" class="section"></div>
  <div id="tab-recipes" class="section"></div>
  <div id="tab-regulars" class="section"></div>
</div>
<script>
// State: meals use stable IDs. All mutations use ID lookup, never array index from UI.
let S=JSON.parse(localStorage.getItem('mplv9')||'null')||{meals:[],extras:[],recipes:[],recipeSort:'az',regulars:{rai:[],ryan:[],items:[]}};
['extras','recipes','later','freezer','history','master','masterHidden','components','leftDismissed'].forEach(k=>{if(!S[k])S[k]=[];});
if(!S.shopQty)S.shopQty={};
if(!S.recipeSort)S.recipeSort='az';
if(!S.shopSort)S.shopSort='az';
if(!S.regulars)S.regulars={rai:[],ryan:[],fern:[],items:[]};
['rai','ryan','fern','items'].forEach(k=>{if(!S.regulars[k])S.regulars[k]=[];});
ensureLayout();
let openPicker=null; // meal ID of currently open recipe picker

// ── Recipe ingredients: {name, use}. use = 'whole' (default) | 'half' | 'little'.
// Older data stored plain strings; they are converted here (as whole) on load and after a cloud Load. ──
function normIng(i){
  if(typeof i==='string')return{name:i,use:'whole'};
  if(i&&typeof i==='object'){const o={name:String(i.name||''),use:canonUse(i.use)};if(i.cupboard)o.cupboard=true;return o;}
  return null;
}
function normRecipes(){
  (S.recipes||[]).forEach(r=>{r.ingredients=(Array.isArray(r.ingredients)?r.ingredients:[]).map(normIng).filter(x=>x&&x.name);});
}
// Amount of a pack a recipe uses, in 30ths of a pack: whole, half, or a little (0.1).
// (An earlier version also had thirds; those are treated as half.)
const USE_UNITS={whole:30,half:15,little:3};
const USE_LABEL={whole:'whole',half:'half',little:'a little'};
const USE_ORDER=['whole','half','little'];
function canonUse(u){return u==='twothirds'||u==='third'?'half':(USE_UNITS[u]?u:'whole');}
function useUnits(u){return USE_UNITS[canonUse(u)];}
function nextUse(u){return USE_ORDER[(USE_ORDER.indexOf(canonUse(u))+1)%USE_ORDER.length];}
function useTag(u){u=canonUse(u);return(u!=='whole')?`<span class="use-tag">${USE_LABEL[u]}</span>`:'';}
// Cupboard ingredients (herbs, spices, sauces…) don't go onto the shopping list when a recipe is
// added to the menu: they appear on the meal as "to check" (ing.check) until you tap +.
// Where a stocked ingredient came from, shown instead of a tick box
const LOC_LABEL={freezer:'freezer',stock:'in stock',leftover:'leftover'};
// Finds (and uses up) a freezer ingredient or in-stock item that a recipe ingredient needs.
// Not for unbought partial packs: if it would finish a leftover from the menu it goes on the shopping list as normal.
function takeFromStock(name,leftovers){
  const w=ingWords(name);if(!w.length)return null;
  if(leftovers.some(l=>l.words.length&&l.words.every(x=>w.includes(x))))return null;
  const hit=list=>S[list].findIndex(c=>{if(list==='freezer'&&c.kind!=='ingredient')return false;const cw=ingWords(c.name);return cw.length&&cw.every(x=>w.includes(x));});
  let i=hit('components'),list='components';
  if(i<0){i=hit('freezer');list='freezer';}

const cpJ=x=>JSON.parse(JSON.stringify(x));
function diffRows(local,remote){
  const rows=[];

  const lc=x=>String(x||'').trim().toLowerCase();

  const boughtNames=st=>new Set(logOf(st).map(e=>lc(e.name)));
  const lBought=boughtNames(local),rBought=boughtNames(remote);
  function removeMatching(list,name){const k=lc(name);for(let i=list.length-1;i>=0;i--)if(lc(list[i].name)===k)list.splice(i,1);}

  // Generic list matched by a key. get(st) must give an array (S's arrays exist).
  function keyed(area,get,key,label,o){

    const L=get(local)||[],R=get(remote)||[];

    rm.forEach((y,k)=>{
      if(!lm.has(k)){if(!(o.skipCloud&&o.skipCloud(y)))row(area,'red','only on cloud',label(y),'Bring in',()=>{const arr=W();arr.push(cpJ(y));});return;}
      const x=lm.get(k);
      if(o.tick&&!!x.done!==!!y.done){
        row(area,x.done?'green':'red',x.done?'ticked here':'ticked on cloud',label(y),x.done?'Untick here':'Tick here',()=>{const arr=W();const t=arr.find(z=>key(z)===k);if(t)t.done=!!y.done;});
      }
      if(o.cmp){const d=o.cmp(x,y);if(d)row(area,'amber','edited',label(y)+' — '+d,'Use cloud',()=>{const arr=W();const i=arr.findIndex(z=>key(z)===k);if(i>=0)arr[i]=cpJ(y);});}
    });
  }

  // ---- Menu (completed past meals are ignored) ----
  const inHist=(st,m)=>(st.history||[]).some(h=>h.mid===m.id||(h.date===m.date&&(h.meal||'')===(m.meal||'')));
  const rank=m=>m.status==='later'?0:m.status==='planned'?1:2;
  const stName=m=>m.status==='later'?'not planned yet':m.status==='planned'?'planned':'here';
  const mlabel=m=>(m.date?fmtShort(m.date)+' ':'')+(m.meal||'no meal set');
  const lM=local.meals||[],rM=remote.meals||[];
  const lMap=new Map(lM.map(m=>[m.id,m])),rMap=new Map(rM.map(m=>[m.id,m]));

  rM.forEach(c=>{

    const useCloud=()=>{const i=S.meals.findIndex(x=>x.id===c.id);if(i>=0){restoreStock(S.meals[i].ingredients);const nc=cpJ(c);S.meals[i]=nc;consumeStock(nc.ingredients);}};

          if(!!i.done===!!ci.done)return;
          row('Shopping list',i.done?'green':'red',i.done?'ticked here':'ticked on cloud',i.name+' ('+(c.meal||'meal')+')',i.done?'Untick here':'Tick here',()=>{const t=S.meals.find(x=>x.id===c.id);const ti=t&&t.ingredients.find(z=>lc(z.name)===lc(i.name));if(ti){ti.done=!!ci.done;if(!ci.done)ti.cleared=false;}});

  const hlabel=h=>(h.date?fmtShort(h.date)+' ':'')+(h.meal||'no meal set');

  lH.forEach(h=>{if(!rH.some(x=>matchH(h,x)))row('Completed meals','green','completed here',hlabel(h),'Put back on menu',()=>{

  const lLog=new Map(logOf(local).map(e=>[e.id,e])),rLog=new Map(logOf(remote).map(e=>[e.id,e]));

  // ---- Recipes, Items we buy ----
  keyed('Recipes',st=>st.recipes,x=>x.id,x=>x.name||'untitled',{cmp:(x,y)=>JSON.stringify(x)!==JSON.stringify(y)?'differs':''});
  const real=m=>m.tag||m.count>0||m.manual||m.cupboard;
  keyed('Items we buy',st=>(st.master||[]).filter(real),x=>x.id,x=>x.name,{w:()=>S.master,cmp:(x,y)=>((x.tag||null)!==(y.tag||null)||!!x.cupboard!==!!y.cupboard)?'aisle or cupboard setting differs':''});

  // ---- Freezer, In stock ----
  const fz=x=>typeof x==='string'?{name:x,use:'whole',qty:1}:x;
  const fzLab=x=>x.name+' ('+(USE_LABEL[canonUse(x.use)]||'whole')+((x.qty||1)>1?' ×'+x.qty:'')+(x.kind?', '+x.kind:'')+')';
  const fzCmp=(x,y)=>JSON.stringify([canonUse(x.use),x.qty||1,x.kind||'',x.src||''])!==JSON.stringify([canonUse(y.use),y.qty||1,y.kind||'',y.src||''])?'amount or tag differs':'';
  keyed('Freezer',st=>(st.freezer||[]).map(fz),x=>lc(x.name),fzLab,{w:()=>S.freezer,cmp:fzCmp});
  keyed('In stock',st=>(st.components||[]).map(fz),x=>lc(x.name),fzLab,{w:()=>S.components,cmp:fzCmp});

  // ---- Regulars ----
  const regLabels={rai:"Rai's lunches",ryan:"Ryan's lunches",fern:"Fern's regulars",items:'Regular items'};
  Object.keys(regLabels).forEach(k=>keyed(regLabels[k],st=>(st.regulars&&st.regulars[k])||[],x=>lc(nm(x)),nm));

  // ---- Your own lists ----
  const lL=local.customLists||[],rL=remote.customLists||[];
  const lLm=new Map(lL.map(l=>[l.id,l])),rLm=new Map(rL.map(l=>[l.id,l]));
  const content=(st,l)=>l.page==='regulars'?((st.regulars||{})[l.id]||[]):((st.cl||{})[l.id]||[]);
  lL.forEach(l=>{if(!rLm.has(l.id))row('Your lists','green','only here',l.name+' ('+l.page+')','Remove here',()=>{
    S.customLists=S.customLists.filter(x=>x.id!==l.id);delete S.regulars[l.id];delete S.cl[l.id];
    S.layout[l.page]=(S.layout[l.page]||[]).filter(x=>x!==l.id);S.hiddenSecs=S.hiddenSecs.filter(x=>x!==l.id);});});
  rL.forEach(l=>{
    const x=lLm.get(l.id);
    if(!x){row('Your lists','red','only on cloud',l.name+' ('+l.page+')','Bring in',()=>{
      ensureLayout();S.customLists.push(cpJ(l));
      if(l.page==='regulars')S.regulars[l.id]=cpJ(content(remote,l));else S.cl[l.id]=cpJ(content(remote,l));
      S.layout[l.page]=secOrder(l.page);});return;}
    if(x.name!==l.name||x.page!==l.page)row('Your lists','amber','edited',l.name+' — name differs','Use cloud',()=>{const t=S.customLists.find(z=>z.id===l.id);if(t){t.name=l.name;t.page=l.page;}});
    if(l.page==='regulars'&&x.page==='regulars')keyed(l.name,st=>(st.regulars&&st.regulars[l.id])||[],y=>lc(nm(y)),nm);
    else if(l.page==='shopping'&&x.page==='shopping')keyed(l.name,st=>(st.cl&&st.cl[l.id])||[],y=>lc(y.name),y=>y.name,{tick:true});
  });
  ['regulars','shopping'].forEach(pg=>{
    const sig=o=>JSON.stringify([secOrder(pg,o),(o.hiddenSecs||[]).filter(x=>secOrder(pg,o).includes(x)).sort()]);
    if(sig(local)!==sig(remote))row('Section order','amber','edited',pg+' page: order or hidden sections differ','Use cloud',()=>{
      ensureLayout();const o=secOrder(pg,remote);S.layout[pg]=o.filter(id=>secOrder(pg).includes(id));
      const ids=secOrder(pg);S.hiddenSecs=S.hiddenSecs.filter(x=>!ids.includes(x)).concat((remote.hiddenSecs||[]).filter(x=>ids.includes(x)));});
  });
  return rows;
}
// True when this device differs from the cloud copy in ANY saved data, including things the list doesn't itemise
// (e.g. completed meals), so Save is never wrongly greyed out.
function stableJ(x){
  if(Array.isArray(x))return'['+x.map(stableJ).join(',')+']';
  if(x&&typeof x==='object')return'{'+Object.keys(x).sort().filter(k=>{const v=x[k];return !(v===undefined||v===null||v===false||v==='');}).map(k=>JSON.stringify(k)+':'+stableJ(x[k])).join(',')+'}';
  return JSON.stringify(x===undefined?null:x);
}
function syncSig(st){
  const fz=x=>typeof x==='string'?{name:x,use:'whole',qty:1}:{name:x.name,use:canonUse(x.use),qty:x.qty||1,kind:x.kind||'',src:x.src||''};
  const cut=Date.now()-14*86400000;
  const skip=new Set(['lastSavedAt','lastSavedByDevice']);
  const o={};
  Object.keys(st).forEach(k=>{if(!skip.has(k))o[k]=st[k];});
  ['meals','extras','later','recipes','history','masterHidden','leftDismissed','customLists','hiddenSecs'].forEach(k=>{o[k]=Array.isArray(st[k])?st[k]:[];});
  o.meals=o.meals.map(m=>Object.assign({},m,{status:m.status||'ready'}));
  o.hiddenSecs=o.hiddenSecs.slice().sort();o.leftDismissed=o.leftDismissed.slice().sort();
  o.freezer=(st.freezer||[]).map(fz);o.components=(st.components||[]).map(fz);
  o.master=(st.master||[]).filter(m=>m.tag||m.count>0||m.manual||m.cupboard).map(m=>[m.id,m.tag||null,!!m.cupboard,m.count||0]);
  o.boughtLog=(st.boughtLog||[]).filter(e=>e&&e.at>cut).map(e=>e.id).sort();
  o.shopQty=st.shopQty||{};o.cl=st.cl||{};
  o.layout={regulars:(st.layout&&st.layout.regulars)||[],shopping:(st.layout&&st.layout.shopping)||[]};
  o.regulars=Object.assign({rai:[],ryan:[],fern:[],items:[]},st.regulars||{});
  o.recipeSort=st.recipeSort||'az';o.shopSort=st.shopSort||'az';
  return stableJ(o);
}
function localDiffers(local,remote){try{return syncSig(local)!==syncSig(remote);}catch(e){return true;}}
let syncRows=[];
function applyRow(i){const r=syncRows[i];if(!r||!r.act)return;r.act();ensureLayout();save();render();renderSyncModal();}
function applyAllRed(){
  const reds=syncRows.filter(r=>r.color==='red'&&r.act);
  if(!reds.length)return;
  if(!confirm('Bring in '+reds.length+' change'+(reds.length===1?'':'s')+' from the cloud to this device? Nothing is sent to the cloud.'))return;
  reds.forEach(r=>r.act());ensureLayout();save();render();renderSyncModal();
}
function diffRowsHTML(rows){
  if(!rows.length)return'';
  const cap=40,groups=[],seen={};
  rows.forEach((r,i)=>{if(!(r.area in seen)){seen[r.area]=groups.length;groups.push({area:r.area,items:[]});}groups[seen[r.area]].items.push({r,i});});
  const n=c=>rows.filter(r=>r.color===c).length;
  return`<div style="font-size:12px;color:var(--text2);margin-bottom:0.5rem"><b style="color:var(--green-text)">Green</b>: only on this device (Save sends it). <b style="color:var(--red-text)">Red</b>: only on the cloud (Load brings it). <b style="color:var(--amber-text)">Amber</b>: on both but different. Buttons below change this device only.</div>
    <div style="font-size:13px;font-weight:600;margin-bottom:0.3rem"><span style="color:var(--green-text)">${n('green')} here</span> · <span style="color:var(--red-text)">${n('red')} on cloud</span> · <span style="color:var(--amber-text)">${n('amber')} edited</span></div>`
    +groups.map(g=>`<div class="rsl" style="margin-top:0.6rem">${esc(g.area)}</div>`+g.items.slice(0,cap).map(({r,i})=>`<div class="drow ${r.color}"><div style="flex:1;min-width:0"><div class="dtag">${esc(r.tag)}</div><div style="word-break:break-word">${esc(r.label)}</div></div>${r.act?`<button class="btn sm gh" style="flex-shrink:0" onclick="applyRow(${i})">${esc(r.btn)}</button>`:''}</div>`).join('')+(g.items.length>cap?`<div style="font-size:12px;color:var(--text3)">+${g.items.length-cap} more</div>`:'')).join('');
}
function deviceLabel(remote){
  if(!remote||!remote.lastSavedAt)return'No save recorded yet.';
  const who=remote.lastSavedByDevice===DEVICE_ID?'you':(remote.lastSavedByDevice?'someone else':'an earlier version of this app');
  const t=new Date(remote.lastSavedAt);
  const timeStr=t.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  return`Cloud copy last saved by ${who} • ${timeStr}`;
}

function renderSyncModal(){
  const el=document.getElementById('sync-modal');
  if(!syncModalStep){if(el)el.remove();return;}
  let body='';
  if(syncModalStep==='check'){
    body=`<p style="color:var(--text2);font-size:14px;margin-bottom:0.2rem">See how this device compares with the cloud copy. Nothing is changed until you choose Save or Load.</p>
      <div class="modal-btns" style="margin-top:1rem"><button class="btn pri" onclick="checkCloud()">Check changes</button><button class="btn gh" onclick="closeSyncModal()">Cancel</button></div>`;
  }else if(syncModalStep==='loading'){
    body=`<p style="color:var(--text2);font-size:14px">Working…</p>`;
  }else if(syncModalStep==='error'){
    body=`<p style="color:var(--red-text);font-size:14px">${esc(syncModalError)}</p>
      <div class="modal-btns" style="margin-top:1rem"><button class="btn pri" onclick="${cacheFresh()?`syncModalStep='summary';renderSyncModal()`:'checkCloud()'}">${cacheFresh()?'Back':'Try again'}</button><button class="btn gh" onclick="closeSyncModal()">Cancel</button></div>`;
  }else if(syncModalStep==='summary'){
    syncRows=diffRows(S,cloudCache.data);
    const hiddenDiff=!syncRows.length&&localDiffers(S,cloudCache.data);
    const none=!syncRows.length&&!hiddenDiff;
    const reds=syncRows.filter(r=>r.color==='red'&&r.act).length;
    body=`<p style="font-size:12px;color:var(--text3);margin-bottom:0.1rem">${esc(deviceLabel(cloudCache.data))}</p>
      <p style="font-size:12px;color:var(--text3);margin-bottom:0.6rem">Checked ${agoText(cloudCache.at)} · <a href="#" onclick="checkCloud();return false" style="color:var(--acc)">re-check cloud</a></p>
      ${none?`<p style="font-size:13px;color:var(--text3);font-style:italic;margin:0.3rem 0 0.75rem">No differences found.</p>`:hiddenDiff?`<p style="font-size:13px;color:var(--text2);margin:0.3rem 0 0.75rem">This device has changes that aren't itemised above (such as settings). Save will send them.</p>`:diffRowsHTML(syncRows)}
      ${reds?`<button class="btn sm" style="width:100%;margin-top:0.7rem" onclick="applyAllRed()">Bring in all red (${reds})</button>`:''}
      <div class="modal-btns" style="padding-top:0.6rem;border-top:0.5px solid var(--border);margin-top:0.7rem">
        <button class="btn pri" ${none?'disabled style="opacity:0.5"':''} onclick="syncModalStep='confirm-save';renderSyncModal()">&#8593; Save</button>
        <button class="btn" ${none?'disabled style="opacity:0.5"':''} onclick="syncModalStep='confirm-load';renderSyncModal()">&#8595; Load</button>
      </div>
      <div style="margin-top:0.6rem;text-align:center"><button class="btn gh sm" onclick="closeSyncModal()">Close</button></div>`;
  }else if(syncModalStep==='confirm-save'){
    body=`<p style="color:var(--red-text);font-weight:600;font-size:14px">&#9888; This will overwrite the cloud copy with what's on this device, including losing anything only on the cloud (the red rows).</p>
      <p style="font-size:12px;color:var(--text3)">Based on the cloud copy checked ${agoText(cloudCache.at)}.</p>
      <div class="modal-btns" style="margin-top:1rem"><button class="btn red" onclick="doSyncSave()">Yes, save</button><button class="btn gh" onclick="syncModalStep='summary';renderSyncModal()">Cancel</button></div>`;
  }else if(syncModalStep==='confirm-load'){
    body=`<p style="color:var(--red-text);font-weight:600;font-size:14px">&#9888; This will overwrite what's on this device with the cloud copy, including losing anything only on your version (the green rows).</p>
      <p style="font-size:12px;color:var(--text3)">Cloud copy checked ${agoText(cloudCache.at)}. Use &#8220;re-check cloud&#8221; first if another device may have saved since.</p>
      <div class="modal-btns" style="margin-top:1rem"><button class="btn red" onclick="doSyncLoad()">Yes, load</button><button class="btn gh" onclick="syncModalStep='summary';renderSyncModal()">Cancel</button></div>`;
  }
  const html=`<div class="modal-bg" id="sync-modal"><div class="modal-card" style="max-height:90vh;overflow-y:auto"><h2>Save / Load</h2>${body}</div></div>`;
  if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
}

async function doSyncSave(){
  syncModalStep='loading';renderSyncModal();
  S.lastSavedAt=new Date().toISOString();
  S.lastSavedByDevice=DEVICE_ID;
  try{
    const payload=JSON.stringify(S);
    const resp=await fetch(`https://api.jsonbin.io/v3/b/${JB_BIN}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':JB_KEY},
      body:payload
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    setCloudCache(JSON.parse(payload)); // the cloud now holds exactly this, so no re-read is needed
    save();clearDirty();
    closeSyncModal();
  }catch(e){
    syncModalStep='error';syncModalError='Save failed: '+e.message;renderSyncModal();
  }
}
function doSyncLoad(){
  S=JSON.parse(JSON.stringify(cloudCache.data));
  ['extras','recipes','later','freezer','history','master','masterHidden','components','leftDismissed'].forEach(k=>{if(!S[k])S[k]=[];});
  if(!S.shopQty)S.shopQty={};
  if(!S.recipeSort)S.recipeSort='az';
  if(!S.shopSort)S.shopSort='az';
  if(!S.regulars)S.regulars={rai:[],ryan:[],fern:[],items:[]};
  ['rai','ryan','fern','items'].forEach(k=>{if(!S.regulars[k])S.regulars[k]=[];});
  ensureLayout();
  normRecipes();normSimpleLists();
  save();clearDirty();
  closeSyncModal();
  render();
}

function uid(){return Date.now()+Math.random().toString(36).slice(2);}
function tds(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(ds,n){const[y,m,d]=ds.split('-');const dt=new Date(+y,+m-1,+d);dt.setDate(dt.getDate()+n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function fmtShort(ds){if(!ds)return '';const[y,m,d]=ds.split('-');const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return days[new Date(+y,+m-1,+d).getDay()]+' '+d+'/'+m+'/'+y.slice(2);}
function fmtDay(ds){if(!ds)return '';const[y,m,d]=ds.split('-');return['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(+y,+m-1,+d).getDay()];}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function dayColour(ds){
  if(!ds)return'var(--green-acc)';
  const[y,m,d]=ds.split('-');
  const dow=new Date(+y,+m-1,+d).getDay();
  // Sun=0 pink, Mon=1 red, Tue=2 orange, Wed=3 yellow, Thu=4 green, Fri=5 blue, Sat=6 purple
  return['var(--day0)','var(--day1)','var(--day2)','var(--day3)','var(--day4)','var(--day5)','var(--day6)'][dow];
}
function fmtLong(ds){
  if(!ds)return '';
  const[y,m,d]=ds.split('-');
  const dt=new Date(+y,+m-1,+d);
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const n=+d;
  const suf=n===1||n===21||n===31?'st':n===2||n===22?'nd':n===3||n===23?'rd':'th';
  return days[dt.getDay()]+' '+n+suf+' '+months[dt.getMonth()];
}
// Menu sections. Here = ticked through to solid. Planned = tapped once (or an unplanned meal within 14 days of the last Here meal).

function renderCal(){
  const el=document.getElementById('cal-modal');
  if(!calModal){if(el)el.remove();return;}
  const {y,m,view,date}=calModal;
  let body='';
  if(view==='month'){
    const first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),today=tds();
    const mealDates=new Set(S.meals.map(x=>x.date)),histDates=new Set(S.history.map(h=>h.date));
    const mn=['January','February','March','April','May','June','July','August','September','October','November','December'][m];
    let cells=['M','T','W','T','F','S','S'].map(w=>`<div class="cal-wd">${w}</div>`).join('');
    for(let i=0;i<lead;i++)cells+='<div></div>';
    for(let d=1;d<=days;d++){
      const ds=ymd(y,m,d),past=ds<today;
      const dot=mealDates.has(ds)?'<i class="dot"></i>':histDates.has(ds)?'<i class="dot f"></i>':'<i class="nodot"></i>';
      cells+=`<button class="cal-d${past?' past':''}${ds===today?' today':''}" onclick="calDay('${ds}')"><span>${d}</span>${dot}</button>`;
    }
    body=`<div style="display:flex;align-items:center;margin-bottom:0.5rem"><button class="di" style="margin-left:0" onclick="calNav(-1)" aria-label="previous month">&#8249;</button><h2 style="flex:1;text-align:center;margin:0">${mn} ${y}</h2><button class="di" style="margin-left:0" onclick="calNav(1)" aria-label="next month">&#8250;</button></div>
      <div class="cal-grid">${cells}</div>
      <p style="font-size:12px;color:var(--text3);margin-top:0.7rem">A dot marks a day with a meal. Tap a day to see it, or to add one.</p>
      <div class="modal-btns" style="margin-top:0.6rem"><button class="btn gh" onclick="closeCal()">Close</button></div>`;
  }else if(view==='day'){
    const ms=S.meals.filter(x=>x.date===date).sort((a,b)=>(a.meal||'').localeCompare(b.meal||''));
    const hs=S.history.filter(h=>h.date===date);
    const stateOf=x=>mealSec(x,menuAnchor())==='here'?'Here':x.status==='planned'?'Planned':'Not planned yet';
    body=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:0.6rem"><button class="di" style="margin-left:0" onclick="calBack()" aria-label="back to month">&#8249;</button><h2 style="margin:0;flex:1">${fmtLong(date)}</h2></div>
      ${ms.map(x=>{
        const r=x.recipeId?S.recipes.find(q=>q.id===x.recipeId):null;
        return`<div class="cal-meal"><span class="cal-chip">${stateOf(x)}</span>
          ${r?recipeCardReadHTML(r):`<div class="rn" style="margin-bottom:0.4rem">${esc(x.meal)||'<i>no meal set</i>'}</div>${x.ingredients.length?`<div class="rsl">Ingredients</div><div style="font-size:13px;color:var(--text2)">${x.ingredients.map(i=>esc(i.name)).join(', ')}</div>`:''}${x.notes?`<div style="font-size:13px;color:var(--text3);font-style:italic;margin-top:0.4rem">${esc(x.notes)}</div>`:''}`}
          <div class="modal-btns" style="margin-top:0.7rem"><button class="btn sm pri" onclick="calOpenMeal('${x.id}')">Open on Menu</button><button class="btn sm gh d" onclick="calRemove('${x.id}')">Remove</button></div></div>`;}).join('')}
      ${hs.map(h=>`<div class="cal-meal" style="opacity:0.7"><span class="cal-chip">Completed</span><div class="rn">${esc(h.meal)||'<i>no meal set</i>'}</div></div>`).join('')}
      ${date>=tds()?`<button class="btn sm" style="width:100%" onclick="calModal.view='add';calModal.tab='sug';renderCal()">+ Add another meal this day</button>`:''}`;
  }else{
    const sug=recSuggestions(buildShopItems()),fzm=fzMeals(),tab=calModal.tab;
    const tb=(id,l)=>`<button class="btn sm ${tab===id?'pri':'gh'}" style="flex:1 1 0;min-width:0;padding:6px 4px;font-size:13px;white-space:nowrap" onclick="calSetTab('${id}')">${l}</button>`;
    let list='';
    if(tab==='sug'){
      list=(sug.length||fzm.length)?`<div class="rpicker-list">${fzm.map(x=>`<div class="rpicker-item" onclick="calAddFz(${x.idx})"><span style="flex:1">${esc(x.f.name)}${useTag(x.f.use)}</span><span style="font-size:12px;color:var(--blue-text);font-weight:600;flex-shrink:0">from freezer</span></div>`).join('')}${sug.map(q=>`<div class="rpicker-item" onclick="calAddRecipe('${q.r.id}')"><div><div style="font-weight:600">${esc(q.r.name)}</div>${q.partial.length?`<div style="font-size:12px;color:var(--acc)">${esc(usesUpText(q))}</div>`:''}${q.haveComps.length?`<div style="font-size:12px;color:var(--acc)">${esc(haveText(q))}</div>`:''}</div></div>`).join('')}</div>`
        :`<p class="es" style="margin:0">Nothing to suggest right now.</p>`;
    }else if(tab==='freezer'){
      list=`<div class="rpicker-list">${fzm.map(x=>`<div class="rpicker-item" onclick="calAddFz(${x.idx})"><span style="flex:1">${esc(x.f.name)}${useTag(x.f.use)}</span></div>`).join('')}</div>`;
    }else{
      list=S.recipes.length?`<div class="rpicker-list">${[...S.recipes].sort((a,b)=>a.name.localeCompare(b.name)).map(r=>`<div class="rpicker-item" onclick="calAddRecipe('${r.id}')">${esc(r.name)}</div>`).join('')}</div>`:`<p class="es" style="margin:0">No recipes saved yet.</p>`;
    }
    const hasMeals=S.meals.some(x=>x.date===date);
    body=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:0.6rem"><button class="di" style="margin-left:0" onclick="${hasMeals?"calModal.view='day'":"calModal.view='month'"};renderCal()" aria-label="back">&#8249;</button><h2 style="margin:0;flex:1">${fmtLong(date)}</h2></div>
      <div class="iar" style="margin-bottom:0.7rem"><input type="text" id="cal-name" placeholder="type a meal name..." onkeydown="if(event.key==='Enter')calAddText()"><button class="btn sm pri" onclick="calAddText()">Add</button></div>
      <div style="display:flex;gap:6px;margin-bottom:0.6rem">${tb('sug','&#128161; Ideas')}${tb('all','Recipes')}${fzm.length?tb('freezer','&#129482; Freezer'):''}</div>
      ${list}
      <p style="font-size:12px;color:var(--text3);margin-top:0.6rem">Added as &#8220;not planned yet&#8221;: nothing goes on the shopping list until you tap + on its card.</p>`;
  }
  const html=`<div class="modal-bg" id="cal-modal"><div class="modal-card" style="max-height:90vh;overflow-y:auto">${body}</div></div>`;
  if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
}
// ── Delete modal: "Delete day entirely" / "Clear meal" / Cancel ──
let deleteModalMealId=null;
function openDeleteModal(id){deleteModalMealId=id;renderDeleteModal();}
function closeDeleteModal(){deleteModalMealId=null;renderDeleteModal();}
function renderDeleteModal(){
  const el=document.getElementById('delete-modal');
  if(!deleteModalMealId){if(el)el.remove();return;}
  const html=`<div class="modal-bg" id="delete-modal"><div class="modal-card">
    <h2>Remove this meal?</h2>
    <p style="font-size:14px;color:var(--text2);margin-bottom:1rem">Choose whether to remove the whole entry, or just clear it and start that date fresh.</p>
    <div class="modal-btns" style="flex-direction:column;gap:8px">
      <button class="btn red" style="width:100%" onclick="reallyDeleteMeal('${deleteModalMealId}')">Delete day entirely</button>
      <button class="btn" style="width:100%" onclick="clearMealEntry('${deleteModalMealId}')">Clear meal</button>
      <button class="btn gh" style="width:100%" onclick="closeDeleteModal()">Cancel</button>
    </div>
  </div></div>`;
  if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
}
function reallyDeleteMeal(id){
  const dm=mById(id);if(dm)restoreStock(dm.ingredients);
  S.meals=S.meals.filter(m=>m.id!==id);expandedMeals.delete(id);
  closeDeleteModal();save();render();
}
function clearMealEntry(id){
  const m=mById(id);
  if(m){restoreStock(m.ingredients);m.meal='';m.notes='';m.ingredients=[];m.status='planned';m.recipeId=null;}
  closeDeleteModal();save();render();
}

// ── Completed-meal history: last 14, most recently completed first ──
function finishMeal(id){
  const m=mById(id);if(!m)return;
  S.history.unshift({hid:uid(),mid:m.id,date:m.date,meal:m.meal,ingredients:m.ingredients,notes:m.notes,recipeId:m.recipeId||null});
  if(S.history.length>14)S.history.length=14;
  S.meals=S.meals.filter(x=>x.id!==id);
  expandedMeals.delete(id);
  save();render();
}
function reinstateHistory(hid){
  const idx=S.history.findIndex(h=>h.hid===hid);
  if(idx<0)return;
  const h=S.history[idx];
  S.meals.push({id:uid(),date:h.date,meal:h.meal,ingredients:h.ingredients,notes:h.notes,status:'ready',recipeId:h.recipeId||null});
  S.history.splice(idx,1);
  save();render();
}
function clearHistory(){
  if(!S.history.length)return;
  if(confirm('Clear meal history? This cannot be undone.')){S.history=[];save();render();}
}
let historyOpen=false;
function toggleHistory(){historyOpen=!historyOpen;rMenu();}
function historyHTML(){
  const n=S.history.length;
  return`<div class="util-card">
    <div class="util-head" onclick="toggleHistory()"><span>${historyOpen?'&#9660;':'&#9654;'}</span><span>Last two weeks</span><span class="util-n">${n}</span></div>
    ${historyOpen?(n?`${S.history.map(h=>`<div class="reg-row"><span style="flex:1;min-width:0"><span style="color:var(--text3);font-size:12px">${fmtShort(h.date)}</span> — ${esc(h.meal)||'<span style="font-style:italic;color:var(--text3)">no meal set</span>'}</span><button class="btn sm gh" onclick="reinstateHistory('${h.hid}')">&#8630; put back</button></div>`).join('')}
        <div style="margin-top:0.5rem;text-align:right"><button class="btn sm gh d" onclick="clearHistory()">Clear history</button></div>`
      :`<p class="util-note">Nothing completed yet.</p>`):''}
  </div>`;
}
// Status button: planned (orange +) -> ready (green tick) -> tap again to complete (goes to history).
// Meals saved before this feature have no status and are treated as ready.
function applyStockTo(m){
  const lo=getLeftovers();
  m.ingredients.forEach(ing=>{if(ing.loc)return;const loc=takeFromStock(ing.name,lo);if(loc){ing.loc=loc;delete ing.check;ing.done=false;}});
}
function advanceMeal(id){
  const m=mById(id);if(!m)return;
  if(m.status==='later'){applyStockTo(m);m.status='planned';save();render();}
  else if(m.status==='planned'){m.status='ready';m.ingredients=m.ingredients.filter(i=>!i.check);save();render();}
  else finishMeal(id);
}

function togMenu(id){
  if(expandedMeals.has(id))expandedMeals.delete(id);else expandedMeals.add(id);
  const body=document.getElementById('mb-'+id);
  const arr=document.getElementById('ma-'+id);
  if(!body)return;
  const open=expandedMeals.has(id);
  body.style.display=open?'block':'none';
  if(arr)arr.setAttribute('aria-expanded',open);
}

function setMenuDate(id,val){const m=mById(id);if(m)m.date=val;save();rMenu();}
function setMenuMeal(id,val){
  const m=mById(id);if(!m)return;m.meal=val;save();
  // Update collapsed header text without full re-render
  const hdr=document.getElementById('mh-'+id);
  if(hdr)hdr.textContent=val||'';
}
function setMenuNotes(id,val){
  const m=mById(id);if(!m)return;m.notes=val;save();
  // Update collapsed notes preview without full re-render
  const nd=document.getElementById('mn-'+id);
  if(nd){nd.textContent=val;nd.style.display=val?'block':'none';}
}

function addIM(id){
  const inp=document.getElementById('ii-'+id);
  const v=inp.value.trim();if(!v)return;
  const m=mById(id);if(!m)return;
  m.ingredients.push({name:v,done:false});
  inp.value='';save();rMenu();
  flashAdded(document.getElementById('iadd-'+id));
  refocus('ii-'+id);
}
// Editing one ingredient on a menu card
let ied=null; // {mid,j,name,use,aisle}
function cycIM(id,j){const m=mById(id);if(!m||!m.ingredients[j])return;m.ingredients[j].use=nextUse(m.ingredients[j].use);save();render();}
function startEditIng(id,j){const m=mById(id);if(!m||!m.ingredients[j])return;const g=m.ingredients[j];const mm=masterFor(g.name);ied={mid:id,j,name:g.name,use:canonUse(g.use),aisle:mm&&mm.tag?mm.tag:null,orig:mm&&mm.tag?mm.tag:null};rMenu();setTimeout(()=>{const i=document.getElementById('ied-in');if(i){i.focus();i.select();}},0);}
function cancelEditIng(){ied=null;rMenu();}
function iedSet(k,v){if(!ied)return;ied[k]=v;rMenu();}
function iedAisle(a){if(!ied)return;ied.aisle=(ied.aisle===a)?null:a;rMenu();}
function saveEditIng(){
  if(!ied)return;
  const m=mById(ied.mid);const g=m&&m.ingredients[ied.j];
  const v=(ied.name||'').trim();
  if(g&&v){
    g.name=v;g.use=ied.use;
    if(ied.aisle!==ied.orig){const e=ensureMaster(v);if(e)e.tag=ied.aisle;}
  }
  ied=null;save();rMenu();
}
function aisleChipsHTML(cur,fn){return`<div class="tag-row" style="flex-basis:100%;margin:2px 0 0">${AISLES.map(a=>`<span class="tag ${cur===a.id?'on':'off'}" onclick="${fn}('${a.id}')">${a.label}</span>`).join('')}</div>`;}
function useChoiceHTML(cur,fn){return['whole','half','little'].map(u=>`<button class="ing-pill-use ${cur===u?u:''}" style="margin:0" onclick="${fn}('${u}')">${USE_LABEL[u]}</button>`).join('');}
function qtyStepHTML(key){
  const it=buildShopItems().find(x=>x.display.toLowerCase()===key);if(!it)return'';
  const k=key.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return`<span>Quantity to buy</span><span class="qty"><button onclick="adjShopQty('${k}',-1)" aria-label="fewer">&#8722;</button><b>${it.packs}</b><button onclick="adjShopQty('${k}',1)" aria-label="more">+</button></span>`;
}
function menuIngRow(m,ing,j){
  if(ied&&ied.mid===m.id&&ied.j===j){
    const onList=!ing.check&&!ing.loc;
    return`<li class="ing-edit"><input type="text" id="ied-in" value="${esc(ied.name)}" oninput="ied.name=this.value" onkeydown="if(event.key==='Enter')saveEditIng();else if(event.key==='Escape')cancelEditIng()" style="flex:1;min-width:0;font-size:16px;padding:6px 10px;border:1.5px solid var(--acc);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none"><button class="btn sm pri" onclick="saveEditIng()">Save</button><button class="btn sm gh" onclick="cancelEditIng()">&#10005;</button>
      <div class="ed-sub"><span>Amount</span>${useChoiceHTML(ied.use,'iedUse')}</div>
      ${onList?`<div class="ed-sub">${qtyStepHTML(ing.name.trim().toLowerCase())}</div>`:''}
      <div class="ed-sub"><span>Aisle</span></div>${aisleChipsHTML(ied.aisle,'iedAisle')}
    </li>`;
  }
  const pill=`<button class="ing-pill-use ${canonUse(ing.use)}" onclick="cycIM('${m.id}',${j})" aria-label="amount: ${USE_LABEL[canonUse(ing.use)]}. Tap to change">${USE_LABEL[canonUse(ing.use)]}</button>`;
  const btns=`<button class="di" onclick="startEditIng('${m.id}',${j})" aria-label="edit" style="margin-left:0;min-width:30px">&#9998;</button><button class="di" onclick="remI('${m.id}',${j})" aria-label="remove" style="margin-left:0;min-width:30px">&#10005;</button>`;
  if(ing.loc)return`<li class="ing"><span class="loc-tag">${LOC_LABEL[ing.loc]||ing.loc}</span><span style="flex:1;min-width:0">${esc(ing.name)}</span>${pill}${btns}</li>`;
  if(ing.check)return`<li class="ing check"><button class="chk-plus" onclick="confirmCheck('${m.id}',${j})" aria-label="to check - tap to add to shopping list">+</button><span style="flex:1;min-width:0">${esc(ing.name)}<span class="use-tag" style="color:var(--text3);background:var(--surface2);border-color:var(--border-med)">to check</span></span>${pill}${btns}</li>`;
  return`<li class="ing${ing.done?' dn':''}"><input type="checkbox" ${ing.done?'checked':''} onchange="togI('${m.id}',${j})"><span style="flex:1;min-width:0">${esc(ing.name)}</span>${pill}${btns}</li>`;
}
function confirmCheck(id,j){const m=mById(id);if(!m||!m.ingredients[j])return;m.ingredients[j].check=false;m.ingredients[j].done=false;save();render();}
function remI(id,j){const m=mById(id);if(!m)return;restoreStock([m.ingredients[j]]);m.ingredients.splice(j,1);if(ied&&ied.mid===id)ied=null;save();rMenu();}
function togI(id,j){
  const m=mById(id);if(!m)return;
  const ing=m.ingredients[j];if(!ing)return;
  ing.done=!ing.done;
  if(!ing.done)ing.cleared=false; // unticking brings it back onto the shopping list
  save();render();
}

let pickerTagFilter=null;
function setPickerTag(mid,tagId){
  pickerTagFilter=(pickerTagFilter===tagId)?null:tagId;
  const el=document.getElementById('picker-'+mid);
  if(el)el.outerHTML=pickerHTML(mid);
}
let pickerTab=null; // 'sug' | 'all' | 'freezer' (reset each time the picker is opened)
function setPickerTab(mid,t){pickerTab=t;const el=document.getElementById('picker-'+mid);if(el)el.outerHTML=pickerHTML(mid);}
function fzMeals(){return S.freezer.map((f,idx)=>({f,idx})).filter(x=>x.f.kind==='meal');}
function pickerHTML(mid){
  const sug=recSuggestions(buildShopItems());
  const fzm=fzMeals();
  const tab0=(sug.length||fzm.length)?'sug':'all';
  const avail=['sug','all'].concat(fzm.length?['freezer']:[]);
  const tab=avail.includes(pickerTab)?pickerTab:tab0;
  const tabBtn=(id,label)=>`<button class="btn sm ${tab===id?'pri':'gh'}" style="flex:1 1 0;min-width:0;padding:6px 4px;font-size:13px;white-space:nowrap" onclick="setPickerTab('${mid}','${id}')">${label}</button>`;
  const fzRow=x=>`<div class="rpicker-item" onclick="useFreezer('${mid}',${x.idx})"><span style="flex:1">${esc(x.f.name)}${useTag(x.f.use)}</span><span style="font-size:12px;color:var(--blue-text);font-weight:600;flex-shrink:0">from freezer</span></div>`;
  let body='';
  if(tab==='sug'){
    body=(sug.length||fzm.length)
      ?`<div class="rpicker-list">${fzm.map(fzRow).join('')}${sug.map(s=>`<div class="rpicker-item" onclick="openRecipeModal('${mid}','${s.r.id}','confirm')"><div><div style="font-weight:600">${esc(s.r.name)}</div><div style="font-size:12px;color:var(--text2)">${s.missing===0?'ready to make!':s.missing+' more needed'}</div>${s.partial.length?`<div style="font-size:12px;color:var(--acc)">${esc(usesUpText(s))}</div>`:''}${s.haveComps.length?`<div style="font-size:12px;color:var(--acc)">${esc(haveText(s))}</div>`:''}</div></div>`).join('')}</div>`
      :`<p class="es" style="margin:0">Nothing to suggest right now &#8211; a recipe needs at least two ingredients you already have (leftovers, things in stock or freezer ingredients).</p>`;
  }else if(tab==='freezer'){
    body=`<div class="rpicker-list">${fzm.map(fzRow).join('')}</div>`;
  }else if(!S.recipes.length){
    body=`<p class="es" style="margin:0">No recipes saved yet.</p>`;
  }else{
    const usedTags=TAGS.filter(t=>S.recipes.some(r=>r.tags&&r.tags.includes(t.id)));
    const sorted=[...S.recipes].sort((a,b)=>a.name.localeCompare(b.name));
    const filtered=pickerTagFilter?sorted.filter(r=>r.tags&&r.tags.includes(pickerTagFilter)):sorted;
    body=`${usedTags.length?`<div class="tag-row" style="margin:0 0 0.5rem">
      ${usedTags.map(t=>tagHTML(t.id,pickerTagFilter===t.id,`setPickerTag('${mid}','${t.id}')`)).join('')}
      ${pickerTagFilter?`<span class="tag off" onclick="setPickerTag('${mid}',null)" style="color:var(--text3)">✕ all</span>`:''}
    </div>`:''}
    <div class="rpicker-list">${filtered.map(r=>`<div class="rpicker-item" onclick="openRecipeModal('${mid}','${r.id}','confirm')">${esc(r.name)}${(r.tags&&r.tags.length)?`<span style="margin-left:auto;display:flex;gap:3px">${r.tags.map(tid=>{const t=TAGS.find(x=>x.id===tid);return t?`<span style="font-size:11px">${t.label.split(' ')[0]}</span>`:''}).join('')}</span>`:''}</div>`).join('')}</div>`;
  }
  return`<div class="rpicker" id="picker-${mid}">
    <div style="display:flex;gap:6px;margin-bottom:0.6rem">${tabBtn('sug','&#128161; Ideas')}${tabBtn('all','Recipes')}${fzm.length?tabBtn('freezer','&#129482; Freezer'):''}</div>
    ${body}
    <div style="margin-top:0.5rem"><button class="btn sm gh" onclick="togglePicker(null)">Cancel</button></div>
  </div>`;
}

function useFreezer(mid,idx){
  const m=mById(mid);if(!m)return;
  const fz=S.freezer[idx];if(!fz)return;const name=fz.name;
  restoreStock(m.ingredients);
  m.meal=name;m.ingredients=[];m.status='planned';m.recipeId=null;
  S.freezer.splice(idx,1);
  openPicker=null;
  save();rMenu();
}

function togglePicker(mid){openPicker=(openPicker===mid)?null:mid;pickerTab=null;rMenu();}

function applyRecipe(mid,rid,rname){
  const m=mById(mid);if(!m)return;
  const r=S.recipes.find(x=>x.id===rid)||S.recipes.find(x=>x.name===decodeURIComponent(rname));
  if(!r)return;
  m.meal=r.name;
  // Only copy the ingredients array — never the method field
  const ings=Array.isArray(r.ingredients)?r.ingredients:[];
  restoreStock(m.ingredients);
  m.ingredients=mealIngsFor(ings);
  m.recipeId=r.id;
  openPicker=null;
  save();rMenu();
}

// ── Recipe confirm/view modal (shared by Menu's "pick recipe"/"view recipe") ──
let modalRecipe=null; // {mid,rid,mode:'confirm'|'view'}
function openRecipeModal(mid,rid,mode){modalRecipe={mid,rid,mode};renderRecipeModal();}
function closeRecipeModal(){modalRecipe=null;renderRecipeModal();}
function recipeCardReadHTML(r){
  const hM=r.method&&r.method.trim();
  const rtags=r.tags||[];
  return`<div class="rn" style="margin-bottom:0.6rem">${esc(r.name)}</div>
    ${r.ingredients.length?`<div class="rsl">Ingredients</div><div class="ing-pills">${r.ingredients.map(ing=>`<div class="ing-pill${isCupboard(ing.name)?' cup':''}"><span class="ing-pill-text">${esc(ing.name)}${useTag(ing.use)}</span></div>`).join('')}</div>`:''}
    ${hM?`<div class="rsl" style="margin-top:0.6rem">Method</div><div class="method-area"><div class="mt" style="cursor:default">${esc(r.method)}</div></div>`:''}
    ${rtags.length?`<div class="rsl" style="margin-top:0.6rem">Tags</div><div class="tag-row">${rtags.map(tid=>tagHTML(tid,true,'')).join('')}</div>`:''}`;
}
function renderRecipeModal(){
  const el=document.getElementById('recipe-modal');
  if(!modalRecipe){if(el)el.remove();return;}
  const r=S.recipes.find(x=>x.id===modalRecipe.rid);
  if(!r){modalRecipe=null;if(el)el.remove();return;}
  const isConfirm=modalRecipe.mode==='confirm';
  const html=`<div class="modal-bg" id="recipe-modal">
    <div class="modal-card">
      ${recipeCardReadHTML(r)}
      <div class="modal-btns" style="margin-top:1.1rem;padding-top:0.75rem;border-top:0.5px solid var(--border)">
        ${isConfirm
          ?`<button class="btn pri" onclick="confirmApplyRecipe()">Add recipe</button><button class="btn gh" onclick="closeRecipeModal()">Cancel</button>`
          :`<button class="btn pri" onclick="closeRecipeModal()">Close</button><button class="btn gh" onclick="changeRecipeFromView()">Pick a different recipe</button>`}
      </div>
    </div>
  </div>`;
  if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
}
function confirmApplyRecipe(){
  if(!modalRecipe)return;
  applyRecipe(modalRecipe.mid,modalRecipe.rid,'');
  closeRecipeModal();
}
function changeRecipeFromView(){
  if(!modalRecipe)return;
  const mid=modalRecipe.mid;
  closeRecipeModal();
  togglePicker(mid);
}

function rMenu(){
  const c=document.getElementById('tab-menu');
  const meals=sortedMeals();

// ── ITEMS WE BUY: master list of everything cleared off the shopping list, with an aisle tag ──
const AISLES=[
  {id:'veg',label:'🥬 Fruit & veg'},{id:'chilled',label:'🧊 Chilled'},{id:'ambient',label:'🥫 Ambient'},
  {id:'household',label:'🧴 Household'},{id:'bread',label:'🍞 Bread'},{id:'frozen',label:'❄️ Frozen'},{id:'baby',label:'🍼 Baby'}
];
function aisleLabel(id){const a=AISLES.find(x=>x.id===id);return a?a.label:'';}
function masterKey(n){return ingWords(n,true).join(' ');}   // "2 Red Onions" -> "red onion"
function masterName(n){const t=ingWords(n,true,true).join(' ');return t.charAt(0).toUpperCase()+t.slice(1);}
// Every recipe ingredient and every Regulars item is added to the master list automatically
// (never bought yet, no aisle). Items removed by hand are remembered in masterHidden so they
// don't keep coming back; buying or manually adding one clears that.
function syncMaster(){
  if(!S.master)S.master=[];if(!S.masterHidden)S.masterHidden=[];
  const have=new Set(S.master.map(m=>m.key)),hid=new Set(S.masterHidden);
  let changed=false;
  function addName(n){
    const key=masterKey(n);if(!key||have.has(key)||hid.has(key))return;
    have.add(key);changed=true;
    S.master.push({id:key,name:masterName(n),key,count:0,last:null,tag:null});
  }
  (S.recipes||[]).forEach(r=>(r.ingredients||[]).forEach(i=>addName(typeof i==='string'?i:i&&i.name)));
  Object.values(S.regulars||{}).forEach(arr=>(arr||[]).forEach(addName));
  // Older recipes carried their own cupboard flag; it now lives on the master item.
  (S.recipes||[]).forEach(r=>(r.ingredients||[]).forEach(i=>{
    if(i&&typeof i==='object'&&i.cupboard){
      const e=ensureMaster(i.name);if(e&&!e.cupboard)e.cupboard=true;
      delete i.cupboard;changed=true;
    }
  }));
  return changed;
}
// The master item for a name (created if missing, e.g. after being removed by hand)
function ensureMaster(name){
  const key=masterKey(name);if(!key)return null;
  let e=S.master.find(m=>m.key===key);
  if(!e){unhide(key);e={id:key,name:masterName(name),key,count:0,last:null,tag:null};S.master.push(e);}
  return e;
}
// Cupboard items (herbs, spices, sauces…) are matched on the exact cleaned name only
function isCupboard(name){const key=masterKey(name);return !!(key&&S.master.some(m=>m.key===key&&m.cupboard));}
function setCupboard(name,on){const e=ensureMaster(name);if(!e)return;if(on)e.cupboard=true;else delete e.cupboard;}
function unhide(key){S.masterHidden=(S.masterHidden||[]).filter(k=>k!==key);}
function recordBought(names){
  const seen=new Set();
  names.forEach(n=>{
    const key=masterKey(n);if(!key||seen.has(key))return;seen.add(key);unhide(key);
    const e=S.master.find(m=>m.key===key);
    if(e){e.count=(e.count||0)+1;e.last=tds();}
    else S.master.push({id:key,name:masterName(n),key,count:1,last:tds(),tag:null});
  });
}
// Find the master entry for a shopping list item: same cleaned name, else the most specific
// master item whose words are all in the shopping item ("onion" covers "red onion pack").
function masterFor(display){
  const key=masterKey(display);if(!key)return null;
  const exact=S.master.find(m=>m.key===key);if(exact)return exact;
  const w=ingWords(display,true);let best=null,bl=0;
  S.master.forEach(m=>{const mw=m.key.split(' ');if(mw.length>bl&&mw.every(x=>w.includes(x))){best=m;bl=mw.length;}});
  return best;
}

function setMasterTag(id,tag){const e=S.master.find(m=>m.id===id);if(!e)return;e.tag=(e.tag===tag)?null:tag;save();rReg();}
function remMaster(id){const e=S.master.find(m=>m.id===id);if(e&&!S.masterHidden.includes(e.key))S.masterHidden.push(e.key);S.master=S.master.filter(m=>m.id!==id);if(masterOpen===id)masterOpen=null;save();rReg();}

// ── SHOPPING LIST ──
function buildShopItems(){
  const map={};
  // Near-identical names (potato / potatoes) are collected into one line
  const simKey=n=>{const w=ingWords(n,true).sort().join(' ');return w||n.trim().toLowerCase();};
  function add(key,display,src,mealName,use){
    key=simKey(display);
    if(!map[key])map[key]={display,count:0,sources:[],meals:new Set(),units:0};
    const it=map[key];
    if(display.length<it.display.length||(display.length===it.display.length&&display<it.display))it.display=display;
    it.count++;it.sources.push(src);
    it.units+=useUnits(use);
    if(mealName)it.meals.add(mealName);
  }
  S.meals.forEach(m=>{if(m.status==='later')return;m.ingredients.forEach((ing,j)=>{if(ing.cleared||ing.check||ing.loc)return;add(ing.name.trim().toLowerCase(),ing.name.trim(),{type:'meal',id:m.id,j},m.meal&&m.meal.trim()?m.meal.trim():null,ing.use);});});
  S.extras.forEach((e,i)=>add(e.name.trim().toLowerCase(),e.name.trim(),{type:'extra',i},null,e.use));
  Object.values(map).forEach(item=>{
    // Whole packs to buy: total amount used (whole=1, 2/3, 1/2, 1/3, a little=0.1) rounded up.
    item.packs=Math.ceil(item.units/30);
    if(item.packs<1)item.packs=1;
    item.auto=item.packs;
    // manual +/- from the edit row is kept as an adjustment on top of the calculated packs
    item.packs=Math.max(1,item.auto+((S.shopQty||{})[item.display.toLowerCase()]||0));
    item.done=item.sources.every(s=>{
      if(s.type==='meal'){const m=mById(s.id);return m&&m.ingredients[s.j]?m.ingredients[s.j].done:true;}
      return S.extras[s.i].done;
    });
    item.meals=Array.from(item.meals);
  });
  return Object.values(map);
}

function setShopSort(v){S.shopSort=v;save();rShop();}
function togShopItem(key){
  const item=buildShopItems().find(it=>it.display.toLowerCase()===key);
  if(!item)return;
  // Ticking only marks items done (struck through) everywhere they appear, including
  // the meal cards on the Menu tab. Nothing is removed until "Clear done" is pressed.
  const nd=!item.done;
  item.sources.forEach(s=>{
    if(s.type==='meal'){const m=mById(s.id);if(m&&m.ingredients[s.j])m.ingredients[s.j].done=nd;}
    else if(S.extras[s.i])S.extras[s.i].done=nd;
  });
  save();rShop();
  if(ctab()==='menu')rMenu();
}
function togLater(i){
  if(!S.later[i])return;
  S.later[i].done=!S.later[i].done;

}
function promoteLater(i){

}

function clrAllDone(){
  buildShopItems().forEach(it=>{if(it.done&&S.shopQty)delete S.shopQty[it.display.toLowerCase()];});
  const bought=[];
  S.meals.forEach(m=>m.ingredients.forEach(i=>{if(i.done&&!i.cleared)bought.push(i.name);}));
  S.extras.forEach(e=>{if(e.done)bought.push(e.name);});
  (S.later||[]).forEach(e=>{if(e.done)bought.push(e.name);});
  recordBought(bought);
  ensureLayout();bought.forEach(n=>S.boughtLog.push({id:uid(),name:n,at:Date.now()}));
  S.meals.forEach(m=>{m.ingredients.forEach(i=>{if(i.done)i.cleared=true;});});
  S.extras=S.extras.filter(e=>!e.done);
  S.later=(S.later||[]).filter(e=>!e.done);
  S.customLists.forEach(l=>{if(l.page==='shopping')S.cl[l.id]=(S.cl[l.id]||[]).filter(e=>!e.done);});
  save();rShop();
  if(ctab()==='menu')rMenu();
}

function adjShopQty(key,d){

function saveEditShop(){
  const inp=document.getElementById('shop-edit');const v=inp?inp.value.trim():'';
  if(v&&editingShop!==null){
    // rename every place the item comes from (meal ingredients and extras)
    const item=buildShopItems().find(it=>it.display.toLowerCase()===editingShop);

// ── Ingredient matching: ignore quantities/units/plurals; "onion" matches "2 red onions" ──
const ING_NOISE=new Set(['g','kg','mg','ml','l','cl','dl','oz','lb','lbs','tbsp','tsp','tbs','cup','pack','packet','tin','can','jar','bottle','bunch','handful','pinch','slice','clove','of','a','an','the','fresh','chopped','diced','sliced','large','small','medium','grated','minced','frozen','dried','ground','x']);
function singular(w){
  if(w.length>3&&w.endsWith('ies'))return w.slice(0,-3)+'y';
  if(w.length>4&&w.endsWith('oes'))return w.slice(0,-2);
  if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')&&!w.endsWith('us')&&!w.endsWith('is'))return w.slice(0,-1);
  return w;
}
const KEEP_DESC=new Set(['frozen','dried','ground']); // change which aisle something is in
function ingWords(s,keepDesc,noSing){
  return String(s||'').toLowerCase()
    .replace(/\([^)]*\)/g,' ')
    .replace(/[¼-¾⅐-⅞]/g,' ')
    .replace(/[0-9]+([.\/][0-9]+)?/g,' ')
    .replace(/[^a-zÀ-ɏ\s-]/g,' ')
    .split(/[\s-]+/).filter(w=>w&&(!ING_NOISE.has(w)||(keepDesc&&KEEP_DESC.has(w)))).map(w=>noSing?w:singular(w));
}
// True when every word of the shorter ingredient appears in the longer one
function ingMatch(a,b){
  if(!a.length||!b.length)return false;
  const [s,l]=a.length<=b.length?[a,b]:[b,a];
  return s.every(w=>l.includes(w));
}

// ── Leftovers: how much of the last pack is unused once every meal on the menu is made ──
// Total use is added up in 30ths of a pack and rounded up to whole packs; what's left of the last
// pack is the leftover. Meal ingredients that were ticked/cleared still count (you've bought them);
// finished meals do not.
function leftLabel(left){
  if(left<=8)return'a little left';
  if(left<=17)return'about half a pack left';
  return'plenty left';
}
function getLeftovers(){
  const map={};
  function add(name,use,src){
    const key=name.trim().toLowerCase();if(!key||isCupboard(name))return;
    if(!map[key])map[key]={display:name.trim(),units:0,from:new Set()};
    map[key].units+=useUnits(use);
    if(src)map[key].from.add(src);
  }
  S.meals.forEach(m=>{if(m.status==='later')return;m.ingredients.forEach(ing=>{if(!ing.check&&!ing.loc)add(ing.name,ing.use,m.meal&&m.meal.trim()?m.meal.trim():null);});});
  S.extras.forEach(e=>add(e.name,e.use,'shopping list'));
  const moved=new Set((S.components||[]).filter(c=>c.src==='leftover').map(c=>ingWords(c.name).join(' ')));
  const all=[];
  Object.values(map).forEach(o=>{
    const k=ingWords(o.display).join(' ');
    if(moved.has(k))return;               // already tracked as an in-stock item
    const rem=o.units%30;
    if(!rem)return;                       // packs are fully used
    const left=30-rem;
    if(left<3)return;
    all.push({display:o.display,key:k,left,label:leftLabel(left),words:ingWords(o.display),from:Array.from(o.from)});
  });
  // Dismissed leftovers stay hidden only while the meals that cause them are still on the menu
  if(!S.leftDismissed)S.leftDismissed=[];
  const present=new Set(all.map(l=>l.key));
  S.leftDismissed=S.leftDismissed.filter(k=>present.has(k));
  const gone=new Set(S.leftDismissed);
  return all.filter(l=>!gone.has(l.key)).sort((a,b)=>a.display.localeCompare(b.display));
}
function leftoverRowsHTML(lo){
  return lo.map((l,i)=>`<div class="left-row" style="display:flex;align-items:center;gap:4px"><div style="flex:1;min-width:0"><span style="font-weight:600">${esc(l.display)}</span> — ${l.label}${l.from.length?` <span class="shop-src">(${l.from.map(esc).join(', ')})</span>`:''}</div><button class="di" style="margin-left:0" onclick="moveLeftover(${i})" title="move to in stock" aria-label="move to in stock">&#8594;</button><button class="di" style="margin-left:0" onclick="dismissLeftover(${i})" title="not actually left over - hide" aria-label="hide this leftover">&#10005;</button></div>`).join('');
}
// Hide a leftover that isn't really there (it comes back by itself only if the meals change)
function dismissLeftover(i){
  const l=getLeftovers()[i];if(!l)return;
  S.leftDismissed.push(l.key);
  save();render();
}
// Move a leftover across to the in-stock list, keeping roughly how much is left
function moveLeftover(i){
  const l=getLeftovers()[i];if(!l)return;
  const use=l.left>=18?'whole':(l.left>=9?'half':'little');
  const c=S.components.find(x=>ingWords(x.name).join(' ')===l.key);
  if(c){c.use=use;c.src='leftover';}
  else S.components.push({name:l.display,use,qty:1,src:'leftover'});
  save();render();
}

function haveText(s){return s.haveComps&&s.haveComps.length?'You have in: '+s.haveComps.join(', '):'';}
function usesUpText(s){
  const bits=s.partial.map(p=>p.name+(p.pairs?' (finishes the pack)':''));
  return'Uses up leftover: '+bits.join(', ');
}

// Every recipe not already on the menu that uses at least two ingredients you already have: leftovers,
// "useful meal components" or freezer ingredients. Ranked: recipes that use up the most leftovers first (a "half" that
// finishes a half-pack counts most), then by how many ingredients match.
function recSuggestions(shopItems){
  if(!S.recipes||!S.recipes.length)return[];
  const shopWords=shopItems.filter(i=>!i.done&&!isCupboard(i.display)).map(i=>ingWords(i.display));
  const leftovers=getLeftovers();
  const comps=(S.components||[]).concat((S.freezer||[]).filter(f=>f.kind==='ingredient')).map(c=>ingWords(c.name)).filter(w=>w.length);
  const onMenu=new Set(S.meals.filter(m=>m.meal).map(m=>m.meal.trim().toLowerCase()));
  return S.recipes
    .filter(r=>!onMenu.has(r.name.trim().toLowerCase()))
    .map(r=>{
      const ings=(r.ingredients||[]).map(normIng).filter(x=>x&&x.name&&!isCupboard(x.name));
      if(!ings.length)return null;
      const matchedNames=[],partial=[],haveComps=[];
      ings.forEach(ing=>{
        const w=ingWords(ing.name);
        const lo=leftovers.find(l=>l.words.length&&l.words.every(x=>w.includes(x))); // recipe must be at least as specific as the leftover ("cheese" doesn't use up cream cheese)
        if(lo){
          const u=useUnits(ing.use);
          partial.push({name:ing.name,pairs:u<=lo.left&&lo.left-u<=3});  // fits and (almost) finishes the pack
          matchedNames.push(ing.name);
        }else if(comps.some(cw=>cw.every(x=>w.includes(x)))){
          haveComps.push(ing.name);   // a cupboard component you already have in
          matchedNames.push(ing.name);
        }else if(shopWords.some(sw=>ingMatch(w,sw))){
          matchedNames.push(ing.name);
        }
      });
      const matched=matchedNames.length;
      const score=matched+partial.reduce((n,p)=>n+(p.pairs?3:2),0)+haveComps.length*2;
      return{r,matched,missing:ings.length-matched,total:ings.length,matchedNames,partial,haveComps,score};
    })
    .filter(x=>x&&(x.partial.length+x.haveComps.length)>=2)   // needs at least two ingredients you already have (leftovers, components, freezer ingredients); the shopping list doesn't count
    .sort((a,b)=>b.score-a.score||a.missing-b.missing||a.r.name.localeCompare(b.r.name));
}
